function deleteTesterHandout(id){
  if(!requirePerm('delete_invoices','حذف توزيع العينات/التسترز')) return;
  const th = DB.testerHandouts.find(x=>x.id===id);
  if(!th) return;
  const isApproved = (th.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(th.date)) return;
  const msg = isApproved
    ? 'التوزيع ده معتمد ومترحّل بالفعل — سيتم إرجاع الكمية للمخزون وحذف قيد المصروف بالكامل. هل أنت متأكد؟'
    : 'هل تريد حذف هذا التوزيع نهائياً؟';
  confirmAction('حذف التوزيع', msg, ()=>{
    if(isApproved){
      th.items.forEach(it=>{
        const p = productById(it.productId);
        if(p) adjustStock(p, it.qty);
        logStockMove(it.productId, it.qty, 'samples_delete', th.number, 'حذف توزيع عينات/تسترز');
      });
      persist('products');
      removeJournalBySource(th.id);
    }
    DB.testerHandouts = DB.testerHandouts.filter(x=>x.id!==id);
    persist('testerHandouts');
    logActivity('samples', 'حذف توزيع عينات/تسترز '+th.number);
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}
function returnedQtyForTesterItem(handoutId, productId){
  return DB.returns.filter(r=>r.originalInvoiceId===handoutId && r.type==='tester_return').reduce((s,r)=>{
    const it = r.items.find(x=>x.productId===productId);
    return s + (it?it.qty:0);
  },0);
}
function openTesterReturnModal(handoutId){
  const th = DB.testerHandouts.find(x=>x.id===handoutId);
  if(!th) return;
  if((th.status||'approved')!=='approved'){ toast('التوزيع ده لسه مش معتمد - لازم يتعتمد الأول قبل عمل مرتجع عليه'); return; }
  const rows = th.items.map(it=>{
    const already = returnedQtyForTesterItem(handoutId, it.productId);
    const maxRet = Math.max(0, it.qty - already);
    return {...it, already, maxRet};
  });
  if(rows.every(r=>r.maxRet<=0)){ toast('تم استرجاع كل الأصناف في هذا التوزيع بالفعل'); return; }
  const body = `
    <p style="font-size:12.5px;color:var(--text-muted);margin-top:0;">توزيع ${th.number}${th.customerName?' - '+esc(th.customerName):''}</p>
    <div class="item-rows" id="testerRetRows">
      <div class="item-row head-row" style="grid-template-columns:2fr 1fr 1fr 1fr;"><div>المنتج</div><div>الكمية الأصلية</div><div>المتاح للإرجاع</div><div>كمية الإرجاع</div></div>
      ${rows.map((r,i)=>`
        <div class="item-row" style="grid-template-columns:2fr 1fr 1fr 1fr;">
          <div>${esc(r.name)}</div>
          <div class="tnum">${fmt(r.qty)}</div>
          <div class="tnum">${fmt(r.maxRet)}</div>
          <div><input type="number" min="0" max="${r.maxRet}" step="1" value="0" class="tester-ret-qty" data-idx="${i}" ${r.maxRet<=0?'disabled':''}></div>
        </div>`).join('')}
    </div>
  `;
  window._testerRetRows = rows;
  openModal('مرتجع عينات/تسترز', body, ()=>{
    const items = [];
    document.querySelectorAll('.tester-ret-qty').forEach(inp=>{
      const idx = parseInt(inp.dataset.idx);
      const qty = parseFloat(inp.value)||0;
      const r = window._testerRetRows[idx];
      if(qty>0){
        if(qty>r.maxRet){ toast('كمية الإرجاع أكبر من المتاح لـ '+r.name); return; }
        items.push({productId:r.productId, name:r.name, qty, cost:r.cost, total:qty*(r.cost||0)});
      }
    });
    if(items.length===0){ toast('أدخل كمية إرجاع لصنف واحد على الأقل'); return false; }
    if(!checkPeriodLock(todayISO())) return false;
    const value = items.reduce((s,i)=>s+i.total,0);
    const ret = { id:uid(), number:nextNumber(DB.returns,'SMPRET'), type:'tester_return', originalInvoiceId:th.id, originalNumber:th.number, date:todayISO(), partyId:th.customerId||null, partyName:th.customerName||'', items, subtotal:value, taxAmount:0, total:value, createdAt:Date.now(), createdBy:currentUserName() };
    DB.returns.push(ret);
    items.forEach(it=>{ const p = productById(it.productId); if(p) adjustStock(p, it.qty); });
    items.forEach(it=>{ logStockMove(it.productId, it.qty, 'samples_return', ret.number, 'مرتجع عينات/تسترز على توزيع '+th.number); });
    persist('returns'); persist('products');
    if(value>0){
      postJournal(ret.date, 'مرتجع عينات وتسترز '+ret.number+' - توزيع '+th.number, [
        {accountId:'acc_inventory', debit:value, credit:0},
        {accountId:'acc_samples', debit:0, credit:value},
      ], 'tester_return', ret.id);
    }
    logActivity('samples', 'مرتجع عينات/تسترز '+ret.number+' على توزيع '+th.number+' بقيمة '+money(value));
    closeModal(); render(); toast('تم تسجيل المرتجع بنجاح');
  });
}

function openConsignReportModal(){
  if(DB.customers.length===0){ toast('أضف عميل (متجر) أولاً'); return; }

    <div id="consignReportItems"><p style="font-size:12.5px;color:var(--text-muted);">اختر المتجر أولاً لعرض أصناف الأمانة لديه.</p></div>
    <div class="row3" style="margin-top:14px;">
      <div class="field"><label>نسبة عمولة المتجر %</label><input id="f_commission" type="number" step="0.01" value="0" oninput="updateConsignReportTotals()"></div>
      <div class="field"><label>نسبة الضريبة %</label><input id="f_tax_rate" type="number" step="0.01" value="${dTax}" oninput="updateConsignReportTotals()"></div>
      <div class="field" style="display:flex;align-items:flex-end;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:9px;">
          <input type="checkbox" id="f_tax_enabled" ${DB.settings.taxEnabled?'checked':''} onchange="updateConsignReportTotals()" style="width:auto;">
          تطبيق الضريبة
        </label>
      </div>
    </div>
    <div style="margin-top:8px;">
      <div class="tot-line"><span>إجمالي المبيعات</span><span class="tnum" id="crSubtotal">${money(0)}</span></div>
      <div class="tot-line"><span>الضريبة</span><span class="tnum" id="crTax">${money(0)}</span></div>
      <div class="tot-line"><span>عمولة المتجر</span><span class="tnum" id="crCommission">${money(0)}</span></div>
      <div class="tot-line grand"><span>صافي المستحق لنا</span><span class="tnum" id="crTotal">${money(0)}</span></div>

  `;

    const cust = customerById(partyId);
    const branchId = document.getElementById('f_branch') ? document.getElementById('f_branch').value : '';
    const branch = branchId ? (cust.branches||[]).find(b=>b.id===branchId) : null;
    const qtyInputs = Array.from(document.querySelectorAll('.consign-qty-sold'));
    const items = [];
    for(const inp of qtyInputs){
      const qtySold = parseFloat(inp.value)||0;
      if(qtySold<=0) continue;
      const productId = inp.dataset.productId;
      const p = productById(productId);
      const held = consignStockFor(partyId, productId, branchId||null);

      {accountId:'acc_sales', debit:0, credit:subtotal},
    ];
    if(taxAmount>0) lines.push({accountId:'acc_vat_out', debit:0, credit:taxAmount});
    if(commissionAmount>0) lines.push({accountId:'acc_consign_comm', debit:commissionAmount, credit:0});
    if(cost>0){ lines.push({accountId:'acc_cogs', debit:cost, credit:0}); lines.push({accountId:'acc_consign_inv', debit:0, credit:cost}); }
    postJournal(date, 'تقرير مبيعات أمانة '+rep.number+' - '+cust.name, lines, 'consign_report', rep.id);
    if(paid>0){
      postJournal(date, 'تحصيل عند تقرير أمانة '+rep.number, [
        {accountId:cashAcc, debit:paid, credit:0},
        {accountId:'acc_ar', debit:0, credit:paid, partyType:'customer', partyId, partyName:cust.name},
      ], 'consign_report', rep.id);
    }
    logActivity('consignment', 'تقرير مبيعات أمانة '+rep.number+' - '+cust.name+' بقيمة '+money(total));
    const invItems = items.map(it=>({productId:it.productId, name:it.name, code:it.code, barcode:it.barcode||'', qty:it.qtySold, price:it.price, cost:it.cost, total:it.total, unit:'قطعة'}));
    const mirrorInv = {
      id:uid(), number:nextInvoiceNo(), date, partyId, partyName:cust.name, poNumber,
      branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null,
      items:invItems, subtotal, discountType:'amount', discountValue:0, discountAmount:0,
      taxEnabled, taxRate, taxAmount, total, paidAmount:paid,
      paymentTerm:'consignment', termLabel:'بيع بالأمانة', dueDate:date,
      fromConsignment:true, consignReportId:rep.id, commissionAmount, commissionPercent,
      createdAt:Date.now(), createdBy:currentUserName()
    };
    DB.sales.push(mirrorInv);
    persist('sales');
    closeModal(); goTo('sales');
    printInvoice('sales', mirrorInv.id);
    toast('تم تسجيل التقرير وإصدار فاتورة بيع رقم '+mirrorInv.number+' - وفتحنا نافذة الطباعة لك');
  });
}
function onConsignReportPartyChange(){
  const partyId = document.getElementById('f_party').value;
  const wrap = document.getElementById('consignReportItems');
  const branchSel = document.getElementById('f_branch');
  const currentBranchVal = branchSel ? branchSel.value : '';
  if(branchSel){
    const cust = partyId ? customerById(partyId) : null;
    const branches = (cust && cust.branches) || [];
    const isSameParty = branchSel.dataset.forParty===partyId;
    branchSel.innerHTML = '<option value="">بدون فرع - العنوان الرئيسي</option>' + branches.map(b=>`<option value="${b.id}" ${isSameParty&&b.id===currentBranchVal?'selected':''}>${esc(b.name)}</option>`).join('');
    branchSel.dataset.forParty = partyId;
  }
  if(!partyId){ wrap.innerHTML = `<p style="font-size:12.5px;color:var(--text-muted);">اختر المتجر أولاً لعرض أصناف الأمانة لديه.</p>`; return; }
  const branchId = branchSel ? (branchSel.value||null) : null;
  const map = consignStockMap(partyId, branchId);
  const rows = Object.keys(map).map(pid=>{ const p = productById(pid); return {p, held:map[pid]}; }).filter(r=>r.p && r.held>0.001);
  if(rows.length===0){ wrap.innerHTML = `<p style="font-size:12.5px;color:var(--text-muted);">لا توجد بضاعة أمانة لدى هذا ${branchId?'الفرع':'المتجر'} حالياً.</p>`; return; }
  wrap.innerHTML = `
    <div class="item-rows">
      <div class="item-row head-row" style="grid-template-columns:2fr 1fr 1fr;"><div>المنتج</div><div>الرصيد لديه</div><div>الكمية المباعة</div></div>
      ${rows.map(r=>`
        <div class="item-row" style="grid-template-columns:2fr 1fr 1fr;">
          <div>${esc(r.p.name)}</div>
          <div class="tnum">${fmt(r.held)}</div>
          <div><input type="number" class="consign-qty-sold" data-product-id="${r.p.id}" min="0" max="${r.held}" step="1" value="0" oninput="updateConsignReportTotals()"></div>
        </div>`).join('')}
    </div>
  `;

function updateConsignReportTotals(){
  let subtotal = 0;
  document.querySelectorAll('.consign-qty-sold').forEach(inp=>{
    const qty = parseFloat(inp.value)||0;
    const p = productById(inp.dataset.productId);
    if(p) subtotal += qty*p.salePrice;
  });
  const taxEnabled = document.getElementById('f_tax_enabled') ? document.getElementById('f_tax_enabled').checked : false;
  const taxRate = parseFloat((document.getElementById('f_tax_rate')||{}).value)||0;
  const taxAmount = taxEnabled ? subtotal*taxRate/100 : 0;
  const commissionPercent = parseFloat((document.getElementById('f_commission')||{}).value)||0;
  const commissionAmount = subtotal*commissionPercent/100;
  const total = subtotal + taxAmount - commissionAmount;
  const set = (id,val)=>{ const el = document.getElementById(id); if(el) el.textContent = val; };
  set('crSubtotal', money(subtotal));
  set('crTax', money(taxAmount));
  set('crCommission', money(commissionAmount));
  set('crTotal', money(total));
}

function parseCSV(text){
  text = text.replace(/^\uFEFF/, '');
  const rows = [];
  let i=0, field='', row=[], inQuotes=false;
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){
        if(text[i+1]==='"'){ field+='"'; i+=2; continue; }
        inQuotes=false; i++; continue;
      }else{ field+=c; i++; continue; }
    }else{
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ row.push(field); field=''; i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ row.push(field); rows.push(row); row=[]; field=''; i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length||row.length){ row.push(field); rows.push(row); }
  return rows.filter(r=>!(r.length===1 && r[0].trim()===''));
}

function importProductsFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const rows = parseCSV(reader.result);
    if(rows.length<2){ toast('الملف فارغ أو غير صالح'); return; }
    let added=0, updated=0;
    rows.slice(1).forEach(r=>{
      const [code,name,category,unit,barcode,purchasePrice,salePrice,reorderLevel,quantity,notes] = r;
      if(!name || !name.trim()) return;
      let p = code ? DB.products.find(x=>x.code===code.trim()) : null;
      const data = {
        code: (code||'').trim() || ('PRD-'+String(DB.products.length+1).padStart(4,'0')),
        name: name.trim(), category:(category||'').trim(), unit:(unit||'قطعة').trim(),
        barcode:(barcode||'').trim(), purchasePrice:parseFloat(purchasePrice)||0, salePrice:parseFloat(salePrice)||0,
        reorderLevel:parseFloat(reorderLevel)||0, notes:(notes||'').trim(),
      };
      if(p){ Object.assign(p, data); updated++; }
      else{ data.quantity = parseFloat(quantity)||0; data.id = uid(); DB.products.push(data); added++; }
    });
    persist('products');
    logActivity('import', 'استيراد منتجات من ملف - إضافة '+added+' وتحديث '+updated);
    render(); toast('تم الاستيراد: '+added+' منتج جديد، '+updated+' تم تحديثه');
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function importExpensesFile(ev){
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    const rows = parseCSV(reader.result);
    if(rows.length<2){ toast('الملف فارغ أو غير صالح'); return; }
    let added=0, updated=0, skipped=0;
    rows.slice(1).forEach(r=>{
      const [number, accName, amount, date, memo] = r;
      if(!accName || !accName.trim() || !amount) return;
      const acc = DB.accounts.find(a=>a.type==='expense' && a.name.trim()===accName.trim());
      if(!acc){ skipped++; return; }
      const amt = parseFloat(amount)||0;
      if(amt<=0) return;
      let exp = number ? DB.expenses.find(x=>x.number===number.trim()) : null;
      const data = { accountId:acc.id, amount:amt, date:(date||todayISO()).trim(), memo:(memo||'مصروف مستورد').trim() };
      if(exp && (exp.status||'approved')!=='approved'){ Object.assign(exp, data); updated++; }
      else if(!exp){
        data.id = uid(); data.number = nextNumber(DB.expenses,'EXP'); data.status = 'pending';
        data.cashAccountId = cashBankAccounts()[0] ? cashBankAccounts()[0].id : 'acc_cash';
        data.createdAt = Date.now(); data.createdBy = currentUserName();
        DB.expenses.push(data); added++;
      }else{ skipped++; }
    });
    persist('expenses');
    logActivity('import', 'استيراد مصروفات من ملف - إضافة '+added+' وتحديث '+updated+(skipped?' وتخطي '+skipped:''));
    render(); toast('تم الاستيراد: '+added+' جديد (بانتظار الموافقة)، '+updated+' تم تحديثه'+(skipped?'، '+skipped+' اتخطى':''));
  };
  reader.readAsText(file);
  ev.target.value = '';
}

function exportCSV(filename, headers, rows){
  const escCsv = v => '"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const lines = [headers.map(escCsv).join(','), ...rows.map(r=>r.map(escCsv).join(','))];
  const csv = '\uFEFF'+lines.join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logActivity('export', 'تصدير ملف: '+filename);
}

function agingBuckets(list, kind){
  const today = todayISO();
  const rows = list.map(x=>{
    const invs = DB[kind].filter(s=>s.partyId===x.id);
    const buckets = {b0:0, b30:0, b60:0, b90:0};
    invs.forEach(inv=>{
      const due = inv.total - inv.paidAmount;
      if(due<=0.009) return;
      const dueDate = inv.dueDate || inv.date;
      const days = Math.floor((new Date(today) - new Date(dueDate)) / 86400000);
      if(days<=0) buckets.b0 += due;
      else if(days<=30) buckets.b0 += due;
      else if(days<=60) buckets.b30 += due;
      else if(days<=90) buckets.b60 += due;
      else buckets.b90 += due;
    });
    const total = buckets.b0+buckets.b30+buckets.b60+buckets.b90;
    return {name:x.name, ...buckets, total};
  }).filter(r=>r.total>0.009).sort((a,b)=>b.total-a.total);
  return rows;
}

function reportIncomeStatement(){
  const revAccs = DB.accounts.filter(a=>a.type==='revenue');
  const expAccs = DB.accounts.filter(a=>a.type==='expense' && a.id!=='acc_cogs');
  const revRows = revAccs.map(a=>({a, val:accountBalance(a.id, repFrom, repTo)})).filter(r=>Math.abs(r.val)>0.009);
  const expRows = expAccs.map(a=>({a, val:accountBalance(a.id, repFrom, repTo)})).filter(r=>Math.abs(r.val)>0.009);
  const totalRev = revRows.reduce((s,r)=>s+r.val,0);
  const totalOpex = expRows.reduce((s,r)=>s+r.val,0);
  const cogs = accountBalance('acc_cogs', repFrom, repTo);
  const grossProfit = totalRev - cogs;
  const net = grossProfit - totalOpex;
  const grossMargin = totalRev>0 ? (grossProfit/totalRev*100) : 0;
  const netMargin = totalRev>0 ? (net/totalRev*100) : 0;
  const periodLabel = (repFrom||repTo) ? (fmtDate(repFrom||'—')+' — '+fmtDate(repTo||'—')) : 'كل الفترات';
  const row = (label, val, opts={}) => `<tr>
      <td style="${opts.indent?'padding-right:22px;color:var(--text-muted);':''}${opts.bold?'font-weight:700;':''}">${esc(label)}</td>
      <td class="tnum" style="${opts.bold?'font-weight:700;':''}${val<0?'color:var(--danger);':''}">${opts.paren&&val>0?'('+money(val)+')':money(val)}</td>
    </tr>`;
  return `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">عن الفترة: ${periodLabel}</div>
    <div class="table-wrap"><table><tbody>
      <tr><td colspan="2" style="font-weight:700;color:var(--primary-dark);padding-top:10px;">الإيرادات</td></tr>
      ${revRows.length===0?'<tr><td style="padding-right:22px;color:var(--text-muted);">لا توجد إيرادات</td><td></td></tr>':revRows.map(r=>row(r.a.name, r.val, {indent:true})).join('')}
      ${row('إجمالي الإيرادات', totalRev, {bold:true})}

      <tr><td colspan="2" style="padding-top:14px;">تكلفة البضاعة المباعة</td><td></td></tr>
      ${row('(-) تكلفة البضاعة المباعة', cogs, {indent:true, paren:true})}
      <tr><td colspan="2" style="border-top:1.5px solid var(--border);"></td></tr>
      ${row('مجمل الربح (Gross Profit)', grossProfit, {bold:true})}

      <tr><td colspan="2" style="font-weight:700;color:var(--primary-dark);padding-top:14px;">المصروفات التشغيلية</td></tr>
      ${expRows.length===0?'<tr><td style="padding-right:22px;color:var(--text-muted);">لا توجد مصروفات</td><td></td></tr>':expRows.map(r=>row(r.a.name, r.val, {indent:true})).join('')}
      ${row('(-) إجمالي المصروفات التشغيلية', totalOpex, {bold:true, paren:true})}
      <tr><td colspan="2" style="border-top:1.5px solid var(--border);"></td></tr>
      <tr><td style="font-weight:700;font-size:15px;">${net>=0?'صافي الربح':'صافي الخسارة'}</td><td class="tnum" style="font-weight:700;font-size:15px;${net>=0?'color:var(--success);':'color:var(--danger);'}">${money(net)}</td></tr>
    </tbody></table></div>
    <div class="stat-grid" style="margin-top:18px;">
      <div class="stat-card"><div class="lbl">مجمل الربح (Gross Profit)</div><div class="val">${money(grossProfit)}</div></div>
      <div class="stat-card gold"><div class="lbl">هامش الربح الإجمالي (Gross Margin)</div><div class="val">${grossMargin.toFixed(1)}%</div></div>
      <div class="stat-card ${net>=0?'green':'red'}"><div class="lbl">صافي الربح / الخسارة</div><div class="val">${money(net)}</div></div>
      <div class="stat-card ${netMargin>=0?'green':'red'}"><div class="lbl">هامش صافي الربح (Net Margin)</div><div class="val">${netMargin.toFixed(1)}%</div></div>
    </div>
    <p style="font-size:11.5px;color:var(--text-muted);margin-top:10px;">هامش الربح الإجمالي = مجمل الربح ÷ الإيرادات. هامش صافي الربح = صافي الربح ÷ الإيرادات (بعد خصم تكلفة البضاعة المباعة وكل المصروفات التشغيلية).</p>
  `;
}
function reportCashFlow(){
  const cashAccIds = cashBankAccounts().map(a=>a.id);
  if(cashAccIds.length===0) return `<p style="color:var(--text-muted);">لا توجد خزائن أو حسابات بنكية معرّفة بعد.</p>`;

  const categoryLabels = {operating:'الأنشطة التشغيلية', investing:'الأنشطة الاستثمارية', financing:'الأنشطة التمويلية'};
  const sourceLabels = {
    sale_invoice:'تحصيلات وتعاملات مع العملاء', purchase_invoice:'مدفوعات للموردين', expense:'مصروفات تشغيلية',
    custody:'حركات العهد', consign_report:'تحصيل تقارير بيع بالأمانة', consign_shipment:'حركات بضاعة أمانة',
    production:'تكلفة تشغيل/عمالة تصنيع', landedcost:'شحن وتكاليف إضافية',
    tester_handout:'عينات وتسترز', tester_return:'مرتجع عينات وتسترز', purchase_receive:'استلام مشتريات',
    fixed_asset:'شراء أصول ثابتة', fixed_asset_disposal:'بيع/استبعاد أصول ثابتة',
    manual_capital:'إيداعات رأس المال', manual_advance:'دفعات مقدمة من/إلى العملاء والموردين', manual:'حركات يدوية أخرى',
  };
  const categories = {operating:{}, investing:{}, financing:{}};

  let openingBalance = 0;
  if(repFrom){
    DB.journal.forEach(j=>{
      if(j.date>=repFrom) return;
      j.lines.forEach(l=>{ if(cashAccIds.includes(l.accountId)) openingBalance += (l.debit||0)-(l.credit||0); });
    });
  }

  DB.journal.forEach(j=>{
    if(!inRange(j.date)) return;
    j.lines.forEach(l=>{
      if(!cashAccIds.includes(l.accountId)) return;
      const otherLines = j.lines.filter(x=>x!==l);
      const isTransfer = otherLines.length>0 && otherLines.every(x=>cashAccIds.includes(x.accountId));
      if(isTransfer) return;
      let cat = 'operating';
      let labelKey = j.sourceType;
      if(j.sourceType==='fixed_asset' || j.sourceType==='fixed_asset_disposal'){ cat='investing'; }
      else if(j.sourceType==='manual'){
        if(otherLines.some(x=>x.accountId==='acc_capital')){ cat='financing'; labelKey='manual_capital'; }
        else if(otherLines.some(x=>x.accountId==='acc_cust_adv'||x.accountId==='acc_supp_adv')){ labelKey='manual_advance'; }
        else { labelKey='manual'; }
      }
      const net = (l.debit||0)-(l.credit||0);
      const label = sourceLabels[labelKey] || sourceLabels['manual'];
      categories[cat][label] = (categories[cat][label]||0) + net;
    });
  });

  const sectionHtml = (catKey) => {
    const rows = Object.entries(categories[catKey]);
    const subtotal = rows.reduce((s,[,v])=>s+v,0);
    return `
      <h3 style="font-size:14.5px;color:var(--primary-dark);margin-top:18px;">${categoryLabels[catKey]}</h3>
      <div class="table-wrap"><table><tbody>
        ${rows.length===0?'<tr><td style="color:var(--text-muted);">لا توجد حركات</td><td></td></tr>':rows.map(([label,val])=>`<tr><td>${esc(label)}</td><td class="tnum" style="${val<0?'color:var(--danger);':''}">${money(val)}</td></tr>`).join('')}
        <tr><td style="font-weight:700;">صافي التدفق من ${categoryLabels[catKey]}</td><td class="tnum" style="font-weight:700;${subtotal<0?'color:var(--danger);':''}">${money(subtotal)}</td></tr>
      </tbody></table></div>
    `;
  };

  const totalOperating = Object.values(categories.operating).reduce((s,v)=>s+v,0);
  const totalInvesting = Object.values(categories.investing).reduce((s,v)=>s+v,0);
  const totalFinancing = Object.values(categories.financing).reduce((s,v)=>s+v,0);
  const netChange = totalOperating + totalInvesting + totalFinancing;
  const closingBalance = openingBalance + netChange;

  return `
    ${sectionHtml('operating')}
    ${sectionHtml('investing')}
    ${sectionHtml('financing')}
    <div class="stat-grid" style="margin-top:18px;">
      <div class="stat-card"><div class="lbl">رصيد النقدية في بداية الفترة</div><div class="val">${money(openingBalance)}</div></div>
      <div class="stat-card ${netChange>=0?'green':'red'}"><div class="lbl">صافي التغيّر في النقدية</div><div class="val">${money(netChange)}</div></div>
      <div class="stat-card gold"><div class="lbl">رصيد النقدية في نهاية الفترة</div><div class="val">${money(closingBalance)}</div></div>
    </div>
    <p style="font-size:11.5px;color:var(--text-muted);margin-top:10px;">القائمة دي بتتبع الحركات الفعلية اللي دخلت أو خرجت من الخزائن والحسابات البنكية بس (مش أرباح دفترية زي قائمة الدخل)، وبتستثني التحويلات الداخلية بين الخزائن نفسها عشان متتكررش. لو مفيش فترة محددة فوق، الرصيد الافتتاحي بيبقى صفر وبيعرض كل الحركات من بداية استخدامك للنظام.</p>
  `;
}
function reportBalanceSheet(){
  const asOf = repTo || todayISO();
  const assetAccs = DB.accounts.filter(a=>a.type==='asset');
  const liabAccs = DB.accounts.filter(a=>a.type==='liability');
  const equityAccs = DB.accounts.filter(a=>a.type==='equity');
  const revAccs = DB.accounts.filter(a=>a.type==='revenue');
  const expAccs = DB.accounts.filter(a=>a.type==='expense');
  const assetRows = assetAccs.map(a=>({a, val:accountBalance(a.id, null, asOf)}));
  const liabRows = liabAccs.map(a=>({a, val:accountBalance(a.id, null, asOf)}));
  const equityRows = equityAccs.map(a=>({a, val:accountBalance(a.id, null, asOf)}));
  const netIncome = revAccs.reduce((s,a)=>s+accountBalance(a.id,null,asOf),0) - expAccs.reduce((s,a)=>s+accountBalance(a.id,null,asOf),0);
  const totalAssets = assetRows.reduce((s,r)=>s+r.val,0);
  const totalLiab = liabRows.reduce((s,r)=>s+r.val,0);
  const totalEquity = equityRows.reduce((s,r)=>s+r.val,0) + netIncome;
  return `
    <div style="font-size:12px;color:var(--text-muted);margin-bottom:12px;">كما في تاريخ: ${fmtDate(asOf)}</div>
    <div class="row2">
      <div>
        <h3 style="font-size:14.5px;color:var(--primary-dark);">الأصول</h3>
        <div class="table-wrap"><table><tbody>
          ${assetRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
          <tr><td style="font-weight:700;">إجمالي الأصول</td><td class="tnum" style="font-weight:700;">${money(totalAssets)}</td></tr>
        </tbody></table></div>
      </div>
      <div>
        <h3 style="font-size:14.5px;color:var(--primary-dark);">الخصوم وحقوق الملكية</h3>
        <div class="table-wrap"><table><tbody>
          ${liabRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
          <tr><td style="font-weight:700;">إجمالي الخصوم</td><td class="tnum" style="font-weight:700;">${money(totalLiab)}</td></tr>
          ${equityRows.map(r=>`<tr><td>${esc(r.a.name)}</td><td class="tnum">${money(r.val)}</td></tr>`).join('')}
          <tr><td>صافي الربح (غير مرحل)</td><td class="tnum">${money(netIncome)}</td></tr>
          <tr><td style="font-weight:700;">إجمالي حقوق الملكية</td><td class="tnum" style="font-weight:700;">${money(totalEquity)}</td></tr>
        </tbody></table></div>
      </div>
    </div>
    <div class="stat-grid" style="margin-top:16px;">
      <div class="stat-card"><div class="lbl">إجمالي الأصول</div><div class="val">${money(totalAssets)}</div></div>
      <div class="stat-card"><div class="lbl">إجمالي الخصوم + حقوق الملكية</div><div class="val">${money(totalLiab+totalEquity)}</div></div>
      <div class="stat-card ${Math.abs(totalAssets-(totalLiab+totalEquity))<0.01?'green':'red'}"><div class="lbl">حالة التوازن</div><div class="val" style="font-size:15px;">${Math.abs(totalAssets-(totalLiab+totalEquity))<0.01?'متوازنة ✓':'غير متوازنة!'}</div></div>
    </div>
  `;
}

function openTransferModal(){
  const accs = cashBankAccounts();
  if(accs.length<2){ toast('أضف خزينة أو حساب بنكي ثانٍ أولاً لعمل تحويل'); return; }
  const opts = accs.map(a=>`<option value="${a.id}">${esc(a.name)} (${money(accountBalance(a.id))})</option>`).join('');
  const body = `
    <div class="row2">
      <div class="field"><label>من</label><select id="f_from">${opts}</select></div>
      <div class="field"><label>إلى</label><select id="f_to">${opts}</select></div>
    </div>
    <div class="row2">
      <div class="field"><label>المبلغ</label><input id="f_amt" type="number" step="0.01" value="0"></div>
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${todayISO()}"></div>
    </div>
    <div class="field"><label>ملاحظات</label><input id="f_memo" placeholder="تحويل بين الخزائن"></div>
  `;
  openModal('تحويل بين الخزائن', body, ()=>{
    const from = document.getElementById('f_from').value;
    const to = document.getElementById('f_to').value;
    const amt = parseFloat(document.getElementById('f_amt').value)||0;
    const date = document.getElementById('f_date').value || todayISO();
    const memo = document.getElementById('f_memo').value.trim() || 'تحويل بين الخزائن';
    if(from===to){ toast('اختر حسابين مختلفين'); return false; }
    if(amt<=0){ toast('أدخل مبلغ صحيح'); return false; }
    const fromAcc = accountById(from), toAcc = accountById(to);
    postJournal(date, memo+' ('+fromAcc.name+' → '+toAcc.name+')', [
      {accountId:to, debit:amt, credit:0},
      {accountId:from, debit:0, credit:amt},
    ], 'manual');
    logActivity('transfer', 'تحويل '+money(amt)+' من '+fromAcc.name+' إلى '+toAcc.name);
    closeModal(); render(); toast('تم التحويل بنجاح');
  });
}

  const totalCr = j.lines.reduce((s,l)=>s+(l.credit||0),0);
  const body = `
    <div class="row2">
      <div class="field"><label>رقم القيد</label><input value="${j.number}" disabled></div>
      <div class="field"><label>التاريخ</label><input value="${fmtDate(j.date)}" disabled></div>

    <div class="field"><label>البيان</label><input value="${esc(j.memo)}" disabled></div>
    ${j.createdBy?`<div class="field"><label>بواسطة</label><input value="${esc(j.createdBy)}" disabled></div>`:''}
    <div class="table-wrap"><table>
      <thead><tr><th>الحساب</th><th>مدين</th><th>دائن</th></tr></thead>
      <tbody>${j.lines.map(l=>`<tr><td>${esc(accountById(l.accountId)?accountById(l.accountId).name:'-')}${l.partyName?' ('+esc(l.partyName)+')':''}</td><td class="tnum">${l.debit?money(l.debit):'-'}</td><td class="tnum">${l.credit?money(l.credit):'-'}</td></tr>`).join('')}</tbody>
      <tfoot><tr><td style="font-weight:700;">الإجمالي</td><td class="tnum" style="font-weight:700;">${money(totalDr)}</td><td class="tnum" style="font-weight:700;">${money(totalCr)}</td></tr></tfoot>
    </table></div>

    <div class="overlay" onmousedown="if(event.target===this) closeModal()">

        <div>${body}</div>
        <div class="modal-foot"><button class="btn btn-outline" onclick="closeModal()">إغلاق</button></div>
      </div>
    </div>
  `;
}
function deleteJournalEntryDirect(id){
  if(!requirePerm('manage_accounts','حذف قيد تصحيحي')) return;
  const j = DB.journal.find(x=>x.id===id);
  if(!j) return;
  if(!checkPeriodLock(j.date)) return;
  confirmAction('حذف تصحيحي للقيد', 'ده حذف مباشر للقيد المحاسبي بس، من غير ما يعكس أي تأثير على المخزون أو حالة المستند الأصلي (الفاتورة/الإذن) تلقائياً. استخدمها بس لتصحيح قيد مكرر بالغلط، وتأكد إنك ظبطت المخزون يدوياً لو محتاج. هل أنت متأكد؟', ()=>{
    DB.journal = DB.journal.filter(x=>x.id!==id);
    persist('journal');
    logActivity('journal_delete', 'حذف تصحيحي لقيد '+(j.memo||id));
    closeModal(); render(); toast('تم حذف القيد');
  });
}
function deleteManualJournal(id){
  const j = DB.journal.find(x=>x.id===id);
  if(j && j.sourceType==='expense' && j.sourceId){
    deleteExpense(j.sourceId);
    return;
  }
  if(!requirePerm('manage_accounts','حذف القيود')) return;
  confirmAction('حذف القيد', 'هل تريد حذف هذا القيد؟', ()=>{
    DB.journal = DB.journal.filter(x=>x.id!==id);
    persist('journal');
    logActivity('journal_delete', 'حذف قيد '+(j?j.memo:id));
    closeModal(); render(); toast('تم حذف القيد');
  });
}
function openExpenseModal(editId){
  const editExp = editId ? DB.expenses.find(x=>x.id===editId) : null;
  if(editExp && (editExp.status||'approved')==='approved'){ toast('المصروف ده معتمد بالفعل ومترحّل في الحسابات - لا يمكن تعديله'); return; }
  if(editExp && editExp.createdBy!==currentUserName() && !can('view_all_expenses')){ toast('مش عندك صلاحية تعديل مصروفات مستخدمين تانيين'); return; }
  const expAccs = DB.accounts.filter(a=>a.type==='expense' && (a.id==='acc_expense' || a.id==='acc_opex' || a.id==='acc_mkt_commission' || a.code==='5600'));
  window._expAccOpts = expAccs.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
  const body = `
    <div class="alert-bar">${icon('alert')}<div>المصروف ده هيتسجل <b>بانتظار الموافقة</b> ومش هيترحّل في الحسابات إلا بعد اعتماده.</div></div>
    <div class="row2">
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${editExp?editExp.date:todayISO()}"></div>
      <div class="field"><label>الخزينة / الحساب البنكي</label><select id="f_cashacc">${cashBankOptionsHtml(editExp?editExp.cashAccountId:null)}</select></div>
    </div>
    <label>بنود المصروفات</label>
    <div class="item-rows" id="expRows">
      <div class="item-row head-row" style="grid-template-columns:1.6fr 2fr .9fr 34px;"><div>حساب المصروف</div><div>البيان</div><div>المبلغ</div><div></div></div>
    </div>
    ${!editExp?`<button class="btn btn-outline btn-sm" type="button" onclick="addExpenseRow()">${icon('plus')} إضافة مصروف تاني في نفس الإذن</button>`:''}
    <div class="field" style="margin-top:12px;">
      <label>مرفق (إيصال / فاتورة) - اختياري</label>
      <div id="expAttachPreview" style="margin-bottom:8px;">
        ${editExp&&editExp.attachment?`
          <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:8px;">
            ${icon('printer')}<span style="font-size:12.5px;flex:1;">${esc(editExp.attachmentName||'مرفق')}</span>
            <a href="${editExp.attachment}" target="_blank" style="font-size:12px;color:var(--primary);">عرض</a>
          </div>`:''}
      </div>
      <input type="file" id="f_attach" accept="image/*,.pdf" onchange="onExpenseAttachSelected(event)">
    </div>
  `;
  openModal(editExp?'تعديل مصروف':'تسجيل مصروف', body, ()=>{
    const date = document.getElementById('f_date').value || todayISO();
    const cashAcc = document.getElementById('f_cashacc').value;
    const attachment = window._newExpenseAttachment!==undefined ? window._newExpenseAttachment : (editExp?editExp.attachment:null);
    const attachmentName = window._newExpenseAttachmentName!==undefined ? window._newExpenseAttachmentName : (editExp?editExp.attachmentName:null);
    window._newExpenseAttachment = undefined; window._newExpenseAttachmentName = undefined;
    const rows = Array.from(document.querySelectorAll('#expRows .item-row:not(.head-row)'));
    const lines = [];
    rows.forEach(row=>{
      const accId = row.querySelector('.exp-acc').value;
      const amt = parseFloat(row.querySelector('.exp-amt').value)||0;
      const memo = row.querySelector('.exp-memo').value.trim();
      if(accId && amt>0) lines.push({accId, amt, memo:memo||'مصروف'});
    });
    if(lines.length===0){ toast('أدخل بيانات صحيحة لبند واحد على الأقل'); return false; }
    if(editExp){
      const l = lines[0];
      const oldSnap = { amount:editExp.amount, memo:editExp.memo, date:editExp.date, accountName:(accountById(editExp.accountId)||{}).name };
      Object.assign(editExp, {accountId:l.accId, amount:l.amt, date, cashAccountId:cashAcc, memo:l.memo, attachment, attachmentName});
      persist('expenses');
      const diff = diffSummary(oldSnap, {amount:l.amt, memo:l.memo, date, accountName:(accountById(l.accId)||{}).name}, [
        {key:'memo', label:'البيان'},
        {key:'amount', label:'المبلغ', fmt:v=>money(v||0)},
        {key:'date', label:'التاريخ', fmt:v=>v?fmtDate(v):'-'},
        {key:'accountName', label:'حساب المصروف'},
      ]);
      logActivity('expense_edit', 'تعديل مصروف '+(editExp.number||'')+(diff?' — '+diff:' - لا توجد تغييرات جوهرية'));
      closeModal(); render(); toast('تم حفظ التعديلات - لسه بانتظار الموافقة');
    }else{
      const batchId = lines.length>1 ? uid() : null;
      const sharedNumber = nextNumber(DB.expenses,'EXP');
      lines.forEach(l=>{
        const exp = { id:uid(), number:sharedNumber, accountId:l.accId, amount:l.amt, date, cashAccountId:cashAcc, memo:l.memo, attachment, attachmentName, batchId, status:'pending', createdAt:Date.now(), createdBy:currentUserName() };
        DB.expenses.push(exp);
      });
      persist('expenses');
      logActivity('expense_create', lines.length>1?('تسجيل '+lines.length+' مصروف في نفس الإذن (بانتظار الموافقة)'):('تسجيل مصروف: '+lines[0].memo+' بمبلغ '+money(lines[0].amt)+' (بانتظار الموافقة)'));
      closeModal(); render(); toast(lines.length>1?('تم حفظ '+lines.length+' مصروف بانتظار الموافقة'):'تم الحفظ بانتظار الموافقة');
    }
  });
  if(editExp){
    addExpenseRow();
    setTimeout(()=>{
      const row = document.querySelector('#expRows .item-row:not(.head-row)');
      if(row){
        row.querySelector('.exp-acc').value = editExp.accountId;
        row.querySelector('.exp-amt').value = editExp.amount;
        row.querySelector('.exp-memo').value = editExp.memo;
      }
    }, 0);
  }else{
    addExpenseRow();
  }
}

  const div = document.createElement('div');

  div.id = rowId;
  div.style.gridTemplateColumns = '1.6fr 2fr .9fr 34px';
  div.innerHTML = `
    <select class="exp-acc">${window._expAccOpts}</select>

function onExpenseAttachSelected(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 1.5*1024*1024){ toast('حجم الملف كبير جداً - اختر ملف أصغر من 1.5MB'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    window._newExpenseAttachment = reader.result;
    window._newExpenseAttachmentName = file.name;
    const preview = document.getElementById('expAttachPreview');
    if(preview) preview.innerHTML = `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:8px;">
        ${icon('printer')}<span style="font-size:12.5px;flex:1;">${esc(file.name)}</span>
        <a href="${reader.result}" target="_blank" style="font-size:12px;color:var(--primary);">عرض</a>
      </div>`;
  };
  reader.readAsDataURL(file);
}
function editExpense(id){ openExpenseModal(id); }
function approveExpense(id){

  if(!exp || exp.status!=='pending') return;
  if(!checkPeriodLock(exp.date)) return;
  confirmAction('اعتماد المصروف', 'سيتم ترحيل القيد المحاسبي فوراً. هل أنت متأكد؟', ()=>{
    exp.status = 'approved'; exp.approvedBy = currentUserName(); exp.approvedAt = Date.now();
    persist('expenses');
    postJournal(exp.date, exp.memo, [
      {accountId:exp.accountId, debit:exp.amount, credit:0},
      {accountId:exp.cashAccountId, debit:0, credit:exp.amount},
    ], 'expense', exp.id);
    logActivity('expense_approve', 'اعتماد مصروف: '+exp.memo+' بمبلغ '+money(exp.amount));
    closeModal(); render(); toast('تم الاعتماد والترحيل بنجاح');
  });
}
function rejectExpense(id){
  if(!requirePerm('approve_expenses','رفض المصروفات')) return;

function approveExpenseBatch(batchId){
  if(!requirePerm('approve_expenses','اعتماد المصروفات')) return;
  const items = DB.expenses.filter(e=>e.batchId===batchId && e.status==='pending');
  if(items.length===0) return;
  if(!checkPeriodLock(items[0].date)) return;

      ], 'expense', exp.id);
    });

function rejectExpenseBatch(batchId){
  if(!requirePerm('approve_expenses','رفض المصروفات')) return;
  const items = DB.expenses.filter(e=>e.batchId===batchId && e.status==='pending');
  if(items.length===0) return;
  confirmAction('رفض دفعة مصروفات', 'هل تريد رفض '+items.length+' مصروف؟', ()=>{
    items.forEach(exp=>{ exp.status='rejected'; exp.rejectedBy=currentUserName(); exp.rejectedAt=Date.now(); });
    persist('expenses');
    logActivity('expense_reject', 'رفض دفعة من '+items.length+' مصروف');
    closeModal(); render(); toast('تم الرفض');
  });
}
function deleteExpenseBatch(batchId){
  if(!requirePerm('delete_invoices','حذف المصروفات')) return;
  const items = DB.expenses.filter(e=>e.batchId===batchId);
  if(items.length===0) return;
  const anyApproved = items.some(e=>(e.status||'approved')==='approved');
  if(anyApproved && !checkPeriodLock(items[0].date)) return;
  confirmAction('حذف دفعة مصروفات', 'سيتم حذف '+items.length+' مصروف'+(anyApproved?' وعكس القيود المحاسبية المعتمدة منهم':'')+'. هل أنت متأكد؟', ()=>{
    items.forEach(exp=>{
      if((exp.status||'approved')==='approved') removeJournalBySource(exp.id);
    });
    DB.expenses = DB.expenses.filter(e=>e.batchId!==batchId);
    persist('expenses');
    logActivity('expense_delete', 'حذف دفعة من '+items.length+' مصروف');
    closeModal(); render(); toast('تم الحذف');
  });
}
function deleteExpense(id){
  if(!requirePerm('delete_invoices','حذف المصروفات')) return;
  const exp = DB.expenses.find(x=>x.id===id);
  if(!exp) return;
  if(exp.fromCustody && exp.custodyEntryId){ deleteCustodyEntry(exp.custodyEntryId); return; }
  const isApproved = (exp.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(exp.date)) return;
  const msg = isApproved ? 'المصروف ده معتمد ومترحّل بالفعل - سيتم حذف القيد المحاسبي بالكامل. هل أنت متأكد؟' : 'هل تريد حذف هذا المصروف نهائياً؟';
  confirmAction('حذف المصروف', msg, ()=>{
    if(isApproved) removeJournalBySource(exp.id);
    DB.expenses = DB.expenses.filter(x=>x.id!==id);
    persist('expenses');
    logActivity('expense_delete', 'حذف مصروف: '+exp.memo+' بمبلغ '+money(exp.amount));
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}

const CUSTODY_ENTRY_LABELS = {issue:'صرف عهدة', topup:'تعزيز عهدة', expense:'مصروف من العهدة', return:'إرجاع من العهدة'};
function custodyBalance(custodyId){
  const entries = DB.custodyEntries.filter(e=>e.custodyId===custodyId && (e.status||'approved')==='approved');
  let bal = 0;
  entries.forEach(e=>{
    if(e.type==='issue' || e.type==='topup') bal += e.amount;
    else if(e.type==='expense' || e.type==='return') bal -= e.amount;
  });
  return bal;
}

function openCustodyEntryModal(custodyId, type){
  const c = DB.custodies.find(x=>x.id===custodyId);
  if(!c) return;
  const bal = custodyBalance(custodyId);
  const expAccs = DB.accounts.filter(a=>a.type==='expense' && (a.id==='acc_expense' || a.id==='acc_opex' || a.id==='acc_mkt_commission' || a.code==='5600'));
  window._custodyExpAccOpts = expAccs.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
  const isExpense = type==='expense';
  const isReturn = type==='return';
  const titleMap = {expense:'تسجيل مصروف من العهدة', topup:'تعزيز العهدة', return:'إرجاع من العهدة'};
  const body = `
    ${(isExpense||isReturn)?`<p style="font-size:12px;color:var(--text-muted);margin:0 0 8px 0;">الرصيد الحالي بيد ${esc(c.holderName)}: <b>${money(bal)}</b></p>`:''}
    ${!isExpense?`<div class="row2">
      <div class="field"><label>المبلغ *</label><input id="f_amt" type="number" step="0.01" min="0" value="0"></div>
      <div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${todayISO()}"></div>
    </div>`:`<div class="field"><label>التاريخ</label><input id="f_date" type="date" value="${todayISO()}"></div>
    <label>بنود المصروفات</label>
    <div class="item-rows" id="custodyExpRows">
      <div class="item-row head-row" style="grid-template-columns:1.6fr 2fr .9fr 34px;"><div>حساب المصروف</div><div>البيان</div><div>المبلغ</div><div></div></div>
    </div>
    <button class="btn btn-outline btn-sm" type="button" onclick="addCustodyExpenseRow()">${icon('plus')} إضافة مصروف تاني من نفس العهدة</button>`}
    ${(type==='topup')?`<div class="field" style="margin-top:10px;"><label>الخزينة / الحساب البنكي المصروف منه</label><select id="f_cashacc">${cashBankOptionsHtml()}</select></div>`:''}
    ${isReturn?`<div class="field" style="margin-top:10px;"><label>الخزينة / الحساب البنكي المرتجع إليه</label><select id="f_cashacc">${cashBankOptionsHtml()}</select></div>`:''}
    ${!isExpense?`<div class="field" style="margin-top:10px;"><label>البيان</label><input id="f_memo" placeholder="${type==='topup'?'مثال: تعزيز شهري':'مثال: إرجاع باقي العهدة'}"></div>`:''}
    ${isExpense?`<div class="field" style="margin-top:10px;">
      <label>مرفق (إيصال) - اختياري</label>
      <div id="custodyAttachPreview" style="margin-bottom:8px;"></div>
      <input type="file" id="f_attach" accept="image/*,.pdf" onchange="onCustodyAttachSelected(event)">
    </div>`:''}
  `;
  openModal(titleMap[type], body, ()=>{
    const date = document.getElementById('f_date').value || todayISO();
    if(!checkPeriodLock(date)) return false;
    if(!isExpense){
      const amt = parseFloat(document.getElementById('f_amt').value)||0;
      if(amt<=0){ toast('أدخل مبلغ صحيح'); return false; }
      if(isReturn && amt>bal+0.009){ toast('المبلغ أكبر من رصيد العهدة الحالي ('+money(bal)+')'); return false; }
      const memo = document.getElementById('f_memo').value.trim() || (titleMap[type]);
      const cashAccountId = document.getElementById('f_cashacc').value;
      const entry = { id:uid(), custodyId, type, date, amount:amt, accountId:null, memo, cashAccountId, status:'pending', createdAt:Date.now(), createdBy:currentUserName() };
      DB.custodyEntries.push(entry);
      persist('custodyEntries');
      logActivity('custody', CUSTODY_ENTRY_LABELS[type]+' لعهدة '+c.number+' بمبلغ '+money(amt)+' (بانتظار الموافقة)');
      closeModal(); render(); toast('تم الحفظ بانتظار الموافقة');
      return;
    }
    const rows = Array.from(document.querySelectorAll('#custodyExpRows .item-row:not(.head-row)'));
    const lines = [];
    rows.forEach(row=>{
      const accId = row.querySelector('.cexp-acc').value;
      const amt = parseFloat(row.querySelector('.cexp-amt').value)||0;
      const memo = row.querySelector('.cexp-memo').value.trim();
      if(accId && amt>0) lines.push({accId, amt, memo:memo||'مصروف'});
    });
    if(lines.length===0){ toast('أدخل بيانات صحيحة لبند واحد على الأقل'); return false; }
    const totalAmt = lines.reduce((s,l)=>s+l.amt,0);
    if(totalAmt>bal+0.009){ toast('إجمالي المبالغ ('+money(totalAmt)+') أكبر من رصيد العهدة الحالي ('+money(bal)+')'); return false; }
    const attachment = window._newCustodyAttachment;
    const attachmentName = window._newCustodyAttachmentName;
    window._newCustodyAttachment = undefined; window._newCustodyAttachmentName = undefined;
    const batchId = lines.length>1 ? uid() : null;
    lines.forEach(l=>{
      const entry = { id:uid(), custodyId, type, date, amount:l.amt, accountId:l.accId, memo:l.memo, cashAccountId:null, attachment, attachmentName, batchId, status:'pending', createdAt:Date.now(), createdBy:currentUserName() };
      DB.custodyEntries.push(entry);
    });
    persist('custodyEntries');
    logActivity('custody', lines.length>1?('تسجيل '+lines.length+' مصروف من عهدة '+c.number+' بإجمالي '+money(totalAmt)+' (بانتظار الموافقة)'):(CUSTODY_ENTRY_LABELS.expense+' لعهدة '+c.number+' بمبلغ '+money(lines[0].amt)+' (بانتظار الموافقة)'));
    closeModal(); render(); toast(lines.length>1?('تم حفظ '+lines.length+' مصروف بانتظار الموافقة'):'تم الحفظ بانتظار الموافقة');
  });
  if(isExpense) addCustodyExpenseRow();
}
function addCustodyExpenseRow(){
  const wrap = document.getElementById('custodyExpRows');
  const rowId = 'custodyexprow_'+uid();
  const div = document.createElement('div');
  div.className = 'item-row';

function onCustodyAttachSelected(ev){
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 1.5*1024*1024){ toast('حجم الملف كبير جداً - اختر ملف أصغر من 1.5MB'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    window._newCustodyAttachment = reader.result;
    window._newCustodyAttachmentName = file.name;
    const preview = document.getElementById('custodyAttachPreview');
    if(preview) preview.innerHTML = `<div style="display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border-radius:8px;">${icon('printer')}<span style="font-size:12.5px;">${esc(file.name)}</span></div>`;
  };
  reader.readAsDataURL(file);
}
function approveCustodyEntry(id){
  if(!requirePerm('approve_expenses','اعتماد حركات العهدة')) return;
  const e = DB.custodyEntries.find(x=>x.id===id);
  if(!e || e.status!=='pending') return;
  if(!checkPeriodLock(e.date)) return;
  const c = DB.custodies.find(x=>x.id===e.custodyId);
  confirmAction('اعتماد الحركة', 'سيتم ترحيل القيد المحاسبي فوراً. هل أنت متأكد؟', ()=>{
    e.status = 'approved'; e.approvedBy = currentUserName(); e.approvedAt = Date.now();
    persist('custodyEntries');
    if(e.type==='issue' || e.type==='topup'){
      postJournal(e.date, e.memo+' - '+c.holderName, [
        {accountId:'acc_custody', debit:e.amount, credit:0},
        {accountId:e.cashAccountId, debit:0, credit:e.amount},
      ], 'custody', e.id);
    }else if(e.type==='expense'){
      postJournal(e.date, e.memo+' - '+c.holderName, [
        {accountId:e.accountId, debit:e.amount, credit:0},
        {accountId:'acc_custody', debit:0, credit:e.amount},
      ], 'custody', e.id);
      const mirrorExp = { id:uid(), number:c.number, accountId:e.accountId, amount:e.amount, date:e.date, cashAccountId:null, memo:e.memo, attachment:e.attachment, attachmentName:e.attachmentName, status:'approved', approvedBy:currentUserName(), approvedAt:Date.now(), fromCustody:true, custodyId:c.id, custodyHolderName:c.holderName, custodyEntryId:e.id, createdAt:e.createdAt, createdBy:e.createdBy };
      DB.expenses.push(mirrorExp);
      persist('expenses');
    }else if(e.type==='return'){
      postJournal(e.date, e.memo+' - '+c.holderName, [
        {accountId:e.cashAccountId, debit:e.amount, credit:0},
        {accountId:'acc_custody', debit:0, credit:e.amount},
      ], 'custody', e.id);
    }
    logActivity('custody', 'اعتماد '+CUSTODY_ENTRY_LABELS[e.type]+' لعهدة '+c.number);
    closeModal(); render(); toast('تم الاعتماد والترحيل بنجاح');
  });
}
function rejectCustodyEntry(id){
  if(!requirePerm('approve_expenses','رفض حركات العهدة')) return;
  const e = DB.custodyEntries.find(x=>x.id===id);
  if(!e || e.status!=='pending') return;
  confirmAction('رفض الحركة', 'هل تريد رفض هذه الحركة؟', ()=>{
    e.status = 'rejected'; e.rejectedBy = currentUserName(); e.rejectedAt = Date.now();
    persist('custodyEntries');
    logActivity('custody', 'رفض حركة عهدة');
    closeModal(); render(); toast('تم الرفض');
  });
}
function deleteCustodyEntry(id){
  if(!requirePerm('delete_invoices','حذف حركات العهدة')) return;
  const e = DB.custodyEntries.find(x=>x.id===id);
  if(!e) return;
  const isApproved = (e.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(e.date)) return;
  confirmAction('حذف الحركة', isApproved?'الحركة دي معتمدة بالفعل - سيتم عكس القيد المحاسبي بالكامل. هل أنت متأكد؟':'هل تريد حذف هذه الحركة؟', ()=>{
    if(isApproved) removeJournalBySource(e.id);
    if(e.type==='expense'){
      DB.expenses = DB.expenses.filter(x=>x.custodyEntryId!==e.id);
      persist('expenses');
    }
    DB.custodyEntries = DB.custodyEntries.filter(x=>x.id!==id);
    persist('custodyEntries');
    logActivity('custody', 'حذف حركة عهدة');
    closeModal(); render(); toast('تم الحذف');
  });
}
function closeCustody(custodyId){
  const c = DB.custodies.find(x=>x.id===custodyId);
  if(!c) return;
  const bal = custodyBalance(custodyId);
  confirmAction('إقفال العهدة', bal>0.009?'لسه فيها رصيد '+money(bal)+' - اتأكد إنه اترجع أو اتصرف قبل الإقفال. تحب تقفلها برضه؟':'هل تريد إقفال هذه العهدة؟', ()=>{
    c.status = 'closed';
    persist('custodies');
    logActivity('custody', 'إقفال عهدة '+c.number+' - '+c.holderName);
    closeModal(); render(); toast('تم الإقفال');
  });
}
function deleteCustody(custodyId){
  if(!requirePerm('delete_invoices','حذف العهد')) return;
  const c = DB.custodies.find(x=>x.id===custodyId);
  if(!c) return;
  if(c.status!=='closed'){ toast('لازم تقفل العهدة الأول قبل ما تقدر تحذفها'); return; }
  const pendingCount = DB.custodyEntries.filter(e=>e.custodyId===custodyId && e.status==='pending').length;
  if(pendingCount>0){ toast('فيه '+pendingCount+' حركة بانتظار الموافقة لسه على العهدة دي - اعتمدها أو ارفضها الأول'); return; }
  confirmAction('حذف العهدة', 'هيتم حذف العهدة "'+c.number+'" - '+c.holderName+' من القائمة. القيود المحاسبية المرحّلة فعلاً هتفضل زي ما هي. هل أنت متأكد؟', ()=>{
    DB.custodies = DB.custodies.filter(x=>x.id!==custodyId);
    DB.custodyEntries = DB.custodyEntries.filter(e=>e.custodyId!==custodyId);
    persist('custodies'); persist('custodyEntries');
    logActivity('custody', 'حذف عهدة '+c.number+' - '+c.holderName);
    closeModal(); render(); toast('تم الحذف');
  });
}

function getRawMaterialShortages(){
  const demand = {};
  DB.productionOrders.filter(o=>o.status==='pending').forEach(o=>{
    o.materials.forEach(m=>{
      demand[m.productId] = (demand[m.productId]||0) + m.qty;
    });
  });
  const shortages = [];
  Object.keys(demand).forEach(pid=>{
    const p = productById(pid);
    if(!p) return;
    if(p.quantity < demand[pid] - 0.009){
      shortages.push({product:p, needed:demand[pid], available:p.quantity, short:demand[pid]-p.quantity});
    }
  });
  return shortages.sort((a,b)=>b.short-a.short);
}
function renderHealthCheckPage(){
  const checks = [];
  const today = todayISO();

  // 1. Imbalanced journal entries
  const imbalanced = DB.journal.filter(j=>{
    const dr = j.lines.reduce((s,l)=>s+(l.debit||0),0);
    const cr = j.lines.reduce((s,l)=>s+(l.credit||0),0);
    return Math.abs(dr-cr)>0.02;
  });
  checks.push({label:'قيود محاسبية غير متزنة', ok:imbalanced.length===0, detail:imbalanced.length+' قيد فيه فرق بين المدين والدائن', severity:'danger', action:imbalanced.length>0?()=>{ goTo('reports'); reportTab='trial'; render(); }:null});

  // 2. Duplicate auto-posted journal entries (same source posted more than once)
  const bySource = {};
  DB.journal.filter(j=>j.sourceId && ['invoice_main','expense','consign_shipment','tester_handout','consign_report'].includes(j.kind)).forEach(j=>{
    const key = j.sourceId+'|'+j.kind;
    bySource[key] = (bySource[key]||0)+1;
  });
  const dupSources = Object.values(bySource).filter(c=>c>1).length;
  checks.push({label:'قيود مكررة محتملة (نفس المستند اتترحّل أكتر من مرة)', ok:dupSources===0, detail:dupSources+' مستند له أكتر من قيد', severity:'danger'});

  // 3. Overdue invoices
  const overdueInvs = approvedSales().filter(s=>isOverdue(s));
  const overdueTotal = overdueInvs.reduce((s,i)=>s+(i.total-i.paidAmount),0);
  checks.push({label:'فواتير بيع متأخرة عن الاستحقاق', ok:overdueInvs.length===0, detail:overdueInvs.length+' فاتورة بقيمة '+money(overdueTotal), severity:'warning', action:overdueInvs.length>0?()=>goTo('sales'):null});

  // 4. Old pending approvals (>7 days)
  const cutoff = Date.now() - 7*86400000;
  const oldPendingExp = DB.expenses.filter(e=>e.status==='pending' && e.createdAt<cutoff).length;
  const oldPendingShip = DB.consignShipments.filter(s=>s.status==='pending' && s.createdAt<cutoff).length;
  const oldPendingTester = DB.testerHandouts.filter(t=>t.status==='pending' && t.createdAt<cutoff).length;
  const oldPendingSales = DB.sales.filter(s=>s.status==='pending' && s.createdAt<cutoff).length;
  const oldPendingPurch = DB.purchases.filter(s=>s.status==='pending' && s.createdAt<cutoff).length;
  const totalOldPending = oldPendingExp+oldPendingShip+oldPendingTester+oldPendingSales+oldPendingPurch;
  checks.push({label:'موافقات معلّقة من أكتر من أسبوع', ok:totalOldPending===0, detail:totalOldPending+' مستند لسه بانتظار الموافقة (مصروفات: '+oldPendingExp+', أمانة: '+oldPendingShip+', تسترز: '+oldPendingTester+', فواتير بيع: '+oldPendingSales+', فواتير شراء: '+oldPendingPurch+')', severity:'warning'});

  const goodsInTransit = DB.purchases.filter(s=>(s.status||'approved')==='approved' && !s.received);
  const oldGoodsInTransit = goodsInTransit.filter(s=>(s.approvedAt||s.createdAt)<cutoff);
  checks.push({label:'بضاعة معتمدة ولسه مستلمتش بالمخزن من أكتر من أسبوع', ok:oldGoodsInTransit.length===0, detail:oldGoodsInTransit.length+' فاتورة شراء: '+oldGoodsInTransit.slice(0,5).map(s=>s.number).join('، '), severity:'warning', action:oldGoodsInTransit.length>0?()=>goTo('purchasereceiving'):null});

  if(isOnlineConfigured() && !LOCAL_MODE){
    const dataSizeMB = estimateDataSizeBytes()*(1+CLOUD_BACKUP_SLOTS)/1024/1024;
    const sizePct = (dataSizeMB/500)*100;
    checks.push({label:'مساحة قاعدة البيانات (تقديرية)', ok:sizePct<70, detail:dataSizeMB.toFixed(1)+' ميجا تقريباً من أصل 500 ميجا ('+sizePct.toFixed(0)+'%)', severity:sizePct>=90?'danger':'warning', action:()=>goTo('settings')});
  }

  // 5. Negative stock
  const negStock = DB.products.filter(p=>p.quantity<-0.009);
  checks.push({label:'منتجات بكمية سالبة في المخزون', ok:negStock.length===0, detail:negStock.length+' منتج: '+negStock.slice(0,5).map(p=>p.name).join('، '), severity:'danger', action:negStock.length>0?()=>goTo('inventory'):null});

  // 5b. Stock-by-warehouse mismatch (breakdown out of sync with total quantity)
  const whMismatch = DB.products.filter(p=>{
    if(!p.stockByWarehouse) return false;
    const sum = Object.values(p.stockByWarehouse).reduce((s,v)=>s+(v||0),0);
    return Math.abs(sum - p.quantity) > 0.009;
  });
  checks.push({label:'توزيع مخازن غير متطابق مع الكمية الإجمالية', ok:whMismatch.length===0, detail:whMismatch.length+' منتج: '+whMismatch.slice(0,5).map(p=>p.name).join('، '), severity:'danger', action:whMismatch.length>0?()=>reconcileWarehouseStock(whMismatch):null});

  // 6. Low stock
  const lowStock = DB.products.filter(p=>p.quantity>=0 && p.quantity<=p.reorderLevel);
  checks.push({label:'منتجات وصلت لحد إعادة الطلب', ok:lowStock.length===0, detail:lowStock.length+' منتج محتاج تعيد طلبه', severity:'info', action:lowStock.length>0?()=>goTo('inventory'):null});

  // 6b. Raw material shortages for pending production orders
  const rawShortages = getRawMaterialShortages();
  checks.push({label:'مواد خام ناقصة لأوامر تصنيع معلّقة', ok:rawShortages.length===0, detail:rawShortages.length+' مادة: '+rawShortages.slice(0,5).map(s=>s.product.name+' (ناقص '+fmt(s.short)+')').join('، '), severity:'warning', action:rawShortages.length>0?()=>goTo('production'):null});

  // 7. Customers exceeding credit limit
  const overLimit = DB.customers.filter(c=>c.creditLimit>0 && partyBalance('customer', c.id, 'acc_ar')>c.creditLimit+0.009);
  checks.push({label:'عملاء تخطوا الحد الائتماني', ok:overLimit.length===0, detail:overLimit.length+' عميل: '+overLimit.slice(0,5).map(c=>c.name).join('، '), severity:'warning', action:overLimit.length>0?()=>goTo('customers'):null});

  // 8. Negative consignment balances (data integrity)
  let negConsign = 0;
  DB.customers.forEach(c=>{
    const buckets = [{id:null}, ...(c.branches||[]).map(b=>({id:b.id}))];
    buckets.forEach(bucket=>{
      const map = consignStockMap(c.id, bucket.id);
      Object.values(map).forEach(v=>{ if(v<-0.009) negConsign++; });
    });
  });
  checks.push({label:'أرصدة بضاعة أمانة سالبة (خلل بيانات)', ok:negConsign===0, detail:negConsign+' رصيد سالب مكتشف', severity:'danger'});

  // 9. Backup recency
  let lastBackup = 0, hasFolder = false;
  try{ lastBackup = parseInt(localStorage.getItem('zib_last_backup')||'0'); hasFolder = !!localStorage.getItem('zib_backup_folder_name'); }catch(e){}
  const daysSinceBackup = lastBackup ? Math.floor((Date.now()-lastBackup)/86400000) : null;
  checks.push({label:'نسخة احتياطية حديثة', ok:hasFolder && daysSinceBackup!==null && daysSinceBackup<=3, detail:!hasFolder?'لسه مختارتش مجلد نسخ احتياطي تلقائي':(daysSinceBackup===null?'لسه ماخدتش نسخة بعد':'آخر نسخة كانت من '+daysSinceBackup+' يوم'), severity:'warning', action:()=>goTo('settings')});

  // 10. Period lock status (informational)
  checks.push({label:'قفل الفترات المحاسبية', ok:true, detail:DB.settings.lockDate?'مفعّل حتى '+fmtDate(DB.settings.lockDate):'مش مفعّل حالياً', severity:'info'});

  const dangerCount = checks.filter(c=>!c.ok && c.severity==='danger').length;
  const warningCount = checks.filter(c=>!c.ok && c.severity==='warning').length;
  const allGood = dangerCount===0 && warningCount===0;
  window._healthActions = checks.map(c=>c.action);

  return `
    <div class="stat-grid" style="margin-bottom:16px;">
      <div class="stat-card ${dangerCount>0?'red':'green'}"><div class="lbl">${icon('alert')} مشاكل عاجلة</div><div class="val">${dangerCount}</div></div>
      <div class="stat-card ${warningCount>0?'gold':'green'}"><div class="lbl">تنبيهات</div><div class="val">${warningCount}</div></div>
      <div class="stat-card green"><div class="lbl">الحالة العامة</div><div class="val" style="font-size:15px;">${allGood?'كل حاجة سليمة ✓':'محتاج مراجعة'}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>نتائج الفحص</h2></div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        ${checks.map((c,ci)=>{
          const color = c.ok ? 'var(--success)' : (c.severity==='danger'?'var(--danger)':(c.severity==='warning'?'#B8862E':'var(--text-muted)'));
          const bg = c.ok ? 'var(--success-bg)' : (c.severity==='danger'?'var(--danger-bg)':(c.severity==='warning'?'var(--warning-bg)':'var(--surface-2)'));
          return `<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 14px;background:${bg};border-radius:10px;gap:10px;flex-wrap:wrap;">
            <div>
              <div style="font-weight:600;font-size:13.5px;color:${c.ok?'var(--text)':color};">${c.ok?'✓ ':(c.severity==='danger'?'✕ ':'⚠ ')}${c.label}</div>
              <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${esc(c.detail)}</div>
            </div>
            ${(!c.ok && c.action)?`<button class="btn btn-outline btn-sm" onclick="window._healthActions[${ci}]()">عرض</button>`:''}
          </div>`;
        }).join('')}
      </div>
      <p style="font-size:11.5px;color:var(--text-muted);margin-top:14px;">الفحص ده بيتحدّث في كل مرة تفتح فيها الصفحة، ومش بيسجل ولا يغيّر أي حاجة في بياناتك.</p>
    </div>
  `;

/* ============ AUTO BACKUP TO LOCAL FOLDER ============ */
function idbOpen(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('zib_fs_store', 1);
    req.onupgradeneeded = ()=>{ req.result.createObjectStore('handles'); };
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function idbSet(key, val){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = ()=>reject(tx.error);
  });
}
async function idbGet(key){
  const db = await idbOpen();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('handles','readonly');
    const req = tx.objectStore('handles').get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = ()=>reject(req.error);
  });
}
async function pickBackupFolder(){
  if(!window.showDirectoryPicker){ toast('متصفحك لا يدعم هذه الميزة - جرب Chrome أو Edge على الكمبيوتر'); return; }
  try{
    const handle = await window.showDirectoryPicker({mode:'readwrite'});
    await idbSet('backupDir', handle);
    try{ localStorage.setItem('zib_backup_folder_name', handle.name); localStorage.removeItem('zib_backup_needs_permission'); }catch(e){}
    toast('تم اختيار مجلد النسخ الاحتياطي: '+handle.name);
    await runAutoBackup(true);
    render();
  }catch(e){ /* user cancelled the picker - no action needed */ }
}
function buildBackupObject(){
  return {
    products:DB.products, customers:DB.customers, suppliers:DB.suppliers, sales:DB.sales, purchases:DB.purchases,
    returns:DB.returns, quotations:DB.quotations, stockMoves:DB.stockMoves, consignShipments:DB.consignShipments, consignReports:DB.consignReports, testerHandouts:DB.testerHandouts, expenses:DB.expenses, productGroups:DB.productGroups, crmActivities:DB.crmActivities, purchaseOrders:DB.purchaseOrders, warehouses:DB.warehouses, salesReps:DB.salesReps, custodies:DB.custodies, custodyEntries:DB.custodyEntries, boms:DB.boms, productionOrders:DB.productionOrders, landedCosts:DB.landedCosts, comments:DB.comments, accounts:DB.accounts, journal:DB.journal, activityLog:DB.activityLog, priceLists:DB.priceLists, fixedAssets:DB.fixedAssets, settings:DB.settings,
    exportedAt:new Date().toISOString(), version:1
  };
}
async function runAutoBackup(manual){
  try{
    const handle = await idbGet('backupDir');
    if(!handle){ if(manual) toast('اختر مجلد النسخ الاحتياطي أولاً'); return; }
    let perm = await handle.queryPermission({mode:'readwrite'});
    if(perm!=='granted'){
      if(!manual){
        try{ localStorage.setItem('zib_backup_needs_permission','1'); }catch(e){}
        if(VIEW==='settings') render();
        return;
      }
      perm = await handle.requestPermission({mode:'readwrite'});
      if(perm!=='granted'){ toast('لم يتم منح إذن الكتابة للمجلد'); return; }
    }
    try{ localStorage.removeItem('zib_backup_needs_permission'); }catch(e){}
    const fileName = 'zib-auto-backup-'+todayISO()+'.json';
    const fileHandle = await handle.getFileHandle(fileName, {create:true});
    const writable = await fileHandle.createWritable();
    await writable.write(JSON.stringify(buildBackupObject(), null, 2));
    await writable.close();
    try{ localStorage.setItem('zib_last_backup', String(Date.now())); }catch(e){}
    if(manual) toast('تم أخذ نسخة احتياطية بنجاح في المجلد المختار');
    if(VIEW==='settings') render();
  }catch(e){ console.error('Auto backup failed', e); if(manual) toast('فشل أخذ النسخة الاحتياطية - جرب تختار المجلد تاني'); }
}
function autoBackupOnLoad(){
  idbGet('backupDir').then(async handle=>{
    if(!handle) return;
    const perm = await handle.queryPermission({mode:'readwrite'});
    if(perm==='granted'){
      try{ localStorage.removeItem('zib_backup_needs_permission'); }catch(e){}
    }else{
      try{ localStorage.setItem('zib_backup_needs_permission','1'); }catch(e){}
      if(VIEW==='settings') render();
      return;
    }
    let lastBackup = 0;
    try{ lastBackup = parseInt(localStorage.getItem('zib_last_backup')||'0'); }catch(e){}
    const hoursSince = (Date.now()-lastBackup)/3600000;
    if(hoursSince>=20) runAutoBackup(false);
  }).catch(()=>{});
}
function downloadBackup(){
  if(!requirePerm('manage_settings','تنزيل نسخة احتياطية')) return;
  const backup = buildBackupObject();
  const blob = new Blob([JSON.stringify(backup,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='zib-backup-'+todayISO()+'.json'; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  logActivity('backup', 'تنزيل نسخة احتياطية');
  toast('تم تنزيل النسخة الاحتياطية');
}
function estimateDataSizeBytes(){
  try{ return new Blob([JSON.stringify(buildBackupObject())]).size; }catch(e){ return 0; }
}
function renderDataSizeMonitor(){
  const liveDataBytes = estimateDataSizeBytes();
  const estimatedTotalBytes = liveDataBytes * (1 + CLOUD_BACKUP_SLOTS);
  const limitBytes = 500*1024*1024;
  const pct = Math.min(100, (estimatedTotalBytes/limitBytes)*100);
  const fmtMB = b => (b/1024/1024).toFixed(2);
  let color='var(--success)', bg='var(--success-bg)', severity='ok';
  if(pct>=70 && pct<90){ color='var(--warning)'; bg='var(--warning-bg)'; severity='warning'; }
  else if(pct>=90){ color='var(--danger)'; bg='var(--danger-bg)'; severity='danger'; }
  return `
    <div style="padding:12px 14px;background:${bg};border-radius:10px;">
      <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font-size:13px;font-weight:700;color:${color};margin-bottom:6px;">
        <span>${fmtMB(estimatedTotalBytes)} ميجابايت تقريباً</span>
        <span>من أصل 500 ميجا (النسخة المجانية من Supabase)</span>
      </div>
      <div style="background:rgba(0,0,0,.08);border-radius:6px;height:8px;overflow:hidden;">
        <div style="background:${color};height:100%;width:${pct}%;"></div>
      </div>
      <div style="font-size:11.5px;color:var(--text-muted);margin-top:8px;">
        ${severity==='danger'?'⚠️ قريب جداً من الحد المجاني - فكّر تشترك في خطة Pro (25 دولار شهرياً) قبل ما تقفل قاعدة البيانات.':severity==='warning'?'اقترب شوية من الحد المجاني - يفضل تراقب الموضوع من وقت للتاني.':'لسه بعيد عن الحد المجاني، مفيش داعي للقلق دلوقتي.'}
        <br>الرقم ده تقديري (بيانات النظام + نسختين احتياطيتين)، ومش بيشمل مساحات تانية بتاخدها Supabase نفسها.
      </div>
    </div>
  `;
}
let _cloudBackupMetaCache = null;
let _cloudBackupMetaLoading = false;
function renderCloudBackupList(){
  if(_cloudBackupMetaCache===null){
    if(!_cloudBackupMetaLoading){
      _cloudBackupMetaLoading = true;
      loadKey('zib_cloud_backup_meta', {entries:[]}).then(meta=>{
        _cloudBackupMetaCache = meta || {entries:[]};
        _cloudBackupMetaLoading = false;
        if(VIEW==='settings') render();
      }).catch(()=>{ _cloudBackupMetaCache = {entries:[]}; _cloudBackupMetaLoading=false; if(VIEW==='settings') render(); });
    }
    return `<p style="font-size:12.5px;color:var(--text-muted);">جاري تحميل قائمة النسخ...</p>`;
  }
  const entries = [...(_cloudBackupMetaCache.entries||[])].sort((a,b)=>b.timestamp-a.timestamp);
  if(entries.length===0) return `<p style="font-size:12.5px;color:var(--text-muted);">لسه معملتش أي نسخة احتياطية سحابية.</p>`;
  return `<div class="table-wrap"><table>
    <thead><tr><th>التاريخ</th><th></th></tr></thead>
    <tbody>${entries.map(e=>`<tr><td>${new Date(e.timestamp).toLocaleString('ar-EG-u-nu-latn',{dateStyle:'medium',timeStyle:'short'})}</td><td><button class="btn btn-outline btn-sm" onclick="restoreCloudBackup(${e.slot})">${icon('undo')} استعادة</button></td></tr>`).join('')}</tbody>
  </table></div>`;
}
const CLOUD_BACKUP_SLOTS = 2;
async function runCloudAutoBackup(manual){
  if(!isOnlineConfigured() || LOCAL_MODE){ if(manual) toast('النسخ الاحتياطي السحابي متاح بس لما النظام متصل بقاعدة بيانات أونلاين'); return; }
  try{
    const meta = (await loadKey('zib_cloud_backup_meta', {entries:[]})) || {entries:[]};
    let entries = meta.entries||[];
    let slot;
    if(entries.length<CLOUD_BACKUP_SLOTS){
      const usedSlots = entries.map(e=>e.slot);
      slot = Array.from({length:CLOUD_BACKUP_SLOTS}, (_,i)=>i).find(s=>!usedSlots.includes(s));
    }else{
      entries.sort((a,b)=>a.timestamp-b.timestamp);
      slot = entries[0].slot;
      entries = entries.slice(1);
    }
    await saveKey('zib_cloud_backup_'+slot, buildBackupObject());
    entries.push({slot, timestamp:Date.now()});
    await saveKey('zib_cloud_backup_meta', {entries});
    try{ localStorage.setItem('zib_last_cloud_backup', String(Date.now())); }catch(e){}
    _cloudBackupMetaCache = null;
    if(manual){ toast('تم أخذ نسخة احتياطية سحابية بنجاح'); render(); }
  }catch(e){ console.error('Cloud auto backup failed', e); if(manual) toast('فشل أخذ النسخة الاحتياطية السحابية'); }
}
function cloudAutoBackupOnLoad(){
  if(!isOnlineConfigured() || LOCAL_MODE) return;
  let lastBackup = 0;
  try{ lastBackup = parseInt(localStorage.getItem('zib_last_cloud_backup')||'0'); }catch(e){}
  const hoursSince = (Date.now()-lastBackup)/3600000;
  if(hoursSince>=20) runCloudAutoBackup(false);
}
async function restoreCloudBackup(slot){
  if(!requirePerm('manage_settings','استعادة نسخة احتياطية')) return;
  try{
    const data = await loadKey('zib_cloud_backup_'+slot, null);
    if(!data){ toast('تعذر تحميل النسخة الاحتياطية'); return; }
    confirmAction('استعادة نسخة احتياطية سحابية', 'سيتم استبدال كل البيانات الحالية بالكامل بهذه النسخة. هل أنت متأكد؟', ()=>{
      applyBackupData(data, 'سحابية');
    });
  }catch(e){ toast('تعذر تحميل النسخة الاحتياطية'); }
}
function applyBackupData(data, sourceLabel){
  DB.products = data.products||[]; DB.customers = data.customers||[]; DB.suppliers = data.suppliers||[];
  DB.sales = data.sales||[]; DB.purchases = data.purchases||[]; DB.returns = data.returns||[]; DB.quotations = data.quotations||[];
  DB.stockMoves = data.stockMoves||[]; DB.consignShipments = data.consignShipments||[]; DB.consignReports = data.consignReports||[];
  DB.testerHandouts = data.testerHandouts||[]; DB.expenses = data.expenses||[]; DB.productGroups = data.productGroups||[]; DB.crmActivities = data.crmActivities||[];
  DB.purchaseOrders = data.purchaseOrders||[]; DB.warehouses = data.warehouses||[{id:'wh_main', name:'المخزن الرئيسي', address:''}]; DB.salesReps = data.salesReps||[]; DB.custodies = data.custodies||[]; DB.custodyEntries = data.custodyEntries||[]; DB.boms = data.boms||[]; DB.productionOrders = data.productionOrders||[]; DB.landedCosts = data.landedCosts||[]; DB.comments = data.comments||[];
  DB.accounts = data.accounts||DEFAULT_ACCOUNTS.map(a=>({...a})); DB.journal = data.journal||[];
  DB.activityLog = data.activityLog||[]; DB.priceLists = data.priceLists||[]; DB.fixedAssets = data.fixedAssets||[]; DB.settings = data.settings||{companyName:'Z International Beauty', currency:'QAR', taxEnabled:false, taxRate:0};
  ensureDefaultAccounts();
  ['products','customers','suppliers','sales','purchases','returns','quotations','stockMoves','consignShipments','consignReports','testerHandouts','expenses','productGroups','crmActivities','purchaseOrders','warehouses','salesReps','custodies','custodyEntries','boms','productionOrders','landedCosts','comments','accounts','journal','activityLog','priceLists','fixedAssets','settings'].forEach(k=>persist(k));
  logActivity('restore', 'استعادة نسخة احتياطية '+(sourceLabel||'من ملف'));
  closeModal(); usersLoaded=false; render(); toast('تم استعادة النسخة الاحتياطية بنجاح');
}
function restoreBackup(ev){
  if(!requirePerm('manage_settings','استعادة نسخة احتياطية')) return;
  const file = ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    let data;
    try{ data = JSON.parse(reader.result); }catch(e){ toast('ملف غير صالح'); return; }
    confirmAction('استعادة نسخة احتياطية', 'سيتم استبدال كل البيانات الحالية بالكامل بالنسخة المحفوظة في الملف. هل أنت متأكد؟', ()=>{
      applyBackupData(data, 'من ملف');
    });
  };
  reader.readAsText(file);
}
function onLogoSelected(ev){
  if(!requirePerm('manage_settings','تعديل الإعدادات')) return;
  const file = ev.target.files[0];
  if(!file) return;
  if(file.size > 800*1024){ toast('حجم الصورة كبير جداً - اختر صورة أصغر من 800KB'); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    DB.settings.logo = reader.result;
    persist('settings'); render(); toast('تم رفع الشعار');
  };
  reader.readAsDataURL(file);
}
function removeLogo(){
  if(!requirePerm('manage_settings','تعديل الإعدادات')) return;
  DB.settings.logo = '';
  persist('settings'); render(); toast('تم إزالة الشعار');
}
function addCurrency(){
  if(!requirePerm('manage_settings','إضافة عملة')) return;
  const codeEl = document.getElementById('s_new_curr_code');
  const nameEl = document.getElementById('s_new_curr_name');
  const code = codeEl.value.trim().toUpperCase();
  const name = nameEl.value.trim();
  if(!code || !name){ toast('اكتب رمز واسم العملة'); return; }
  if(code===DB.settings.currency){ toast('دي أصلاً العملة الأساسية للنظام'); return; }
  if(!DB.settings.currencies) DB.settings.currencies = [];
  if(DB.settings.currencies.some(c=>c.code===code)){ toast('العملة دي مضافة بالفعل'); return; }
  DB.settings.currencies.push({code, name, rate:1});
  persist('settings');
  codeEl.value=''; nameEl.value='';
  render(); toast('تم إضافة العملة');
}
function deleteCurrency(code){
  if(!requirePerm('manage_settings','حذف عملة')) return;
  DB.settings.currencies = (DB.settings.currencies||[]).filter(c=>c.code!==code);
  persist('settings');
  render(); toast('تم الحذف');
}
function updateCurrencyRate(code, rate){
  if(!requirePerm('manage_settings','تعديل سعر الصرف')) return;
  const c = (DB.settings.currencies||[]).find(x=>x.code===code);
  if(!c) return;
  const r = parseFloat(rate)||1;
  c.rate = r;
  persist('settings');
  toast('تم تحديث سعر الصرف الافتراضي لـ'+code);
}

  if(!requirePerm('manage_settings','تعديل الإعدادات')) return;
  DB.settings.companyName = document.getElementById('s_name').value.trim() || 'Z International Beauty';
  DB.settings.currency = document.getElementById('s_currency').value.trim() || 'EGP';

const SETUP_SQL = `create table if not exists zib_data (
  key text primary key,
  value jsonb not null,
  updated_at timestamptz default now()
);

alter table zib_data enable row level security;

drop policy if exists "allow all access" on zib_data;
drop policy if exists "authenticated only" on zib_data;

create policy "authenticated only"
on zib_data for all
using (auth.role() = 'authenticated') with check (auth.role() = 'authenticated');

grant usage on schema public to anon, authenticated;
grant select, insert, update, delete on zib_data to anon, authenticated;

create table if not exists zib_users (
  id uuid primary key references auth.users(id) on delete cascade,
  username text unique not null,
  full_name text,
  role text default 'employee',
  permissions jsonb default '{}'::jsonb,
  lang text default 'ar',
  theme text default 'light',
  created_at timestamptz default now()
);

alter table zib_users add column if not exists permissions jsonb default '{}'::jsonb;
alter table zib_users add column if not exists lang text default 'ar';
alter table zib_users add column if not exists theme text default 'light';

alter table zib_users enable row level security;

drop policy if exists "users authenticated" on zib_users;

create policy "users authenticated"
on zib_users for all
using (auth.role() = 'authenticated') with check (auth.role() = 'authenticated');

grant select, insert, update, delete on zib_users to anon, authenticated;

notify pgrst, 'reload schema';`;

function lockBodyScroll(){
  if(document.body.dataset.scrollLocked) return;
  const scrollY = window.scrollY || window.pageYOffset || 0;
  document.body.dataset.scrollLocked = '1';
  document.body.dataset.scrollY = String(scrollY);
  document.body.style.position = 'fixed';
  document.body.style.top = '-'+scrollY+'px';
  document.body.style.left = '0';
  document.body.style.right = '0';
  document.body.style.width = '100%';
}
function unlockBodyScroll(){
  if(!document.body.dataset.scrollLocked) return;
  const scrollY = parseInt(document.body.dataset.scrollY||'0', 10);
  document.body.style.position = '';
  document.body.style.top = '';
  document.body.style.left = '';
  document.body.style.right = '';
  document.body.style.width = '';
  delete document.body.dataset.scrollLocked;
  delete document.body.dataset.scrollY;
  window.scrollTo(0, scrollY);
}

        <div id="modalBody">${bodyHtml}</div>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button>
          <button class="btn btn-primary" id="modalSaveBtn">${t('save')}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('modalSaveBtn').onclick = ()=>{
    const btn = document.getElementById('modalSaveBtn');
    if(btn.disabled) return;
    btn.disabled = true;
    const originalText = btn.textContent;
    btn.textContent = t('saving')||'...';
    const result = onSave();
    if(result===false){
      btn.disabled = false;
      btn.textContent = originalText;
    }
  };
  window._confirmCallback = null;
}
function closeModal(){ document.getElementById('modalRoot').innerHTML=''; unlockBodyScroll(); }
function confirmAction(title, msg, onYes){
  lockBodyScroll();
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="overlay" onmousedown="if(event.target===this) closeModal()">
      <div class="modal" style="max-width:400px;">
        <div class="modal-head"><h2>${title}</h2><button class="modal-close" onclick="closeModal()">${icon('close')}</button></div>
        <p style="font-size:13.5px;color:var(--text-muted);">${msg}</p>
        <div class="modal-foot">
          <button class="btn btn-outline" onclick="closeModal()">${t('cancel')}</button>
          <button class="btn btn-danger-o" id="confirmYesBtn" style="background:var(--danger);color:#fff;border-color:var(--danger);">${t('confirmDelete')}</button>
        </div>
      </div>
    </div>
  `;
  document.getElementById('confirmYesBtn').onclick = ()=>{
    const btn = document.getElementById('confirmYesBtn');
    if(btn.disabled) return;
    btn.disabled = true;
    onYes();
  };
}

/* ============ INIT ============ */
function hideAppLoader(){
  const el = document.getElementById('appLoader');
  if(el) el.classList.add('loader-hidden');
}
async function init(){
  try{
    loadSupaConfig();
    loadLang();
    loadTheme();
    if(!isOnlineConfigured() && !LOCAL_MODE){
      renderSetupScreen();
      return;
    }
    if(isOnlineConfigured() && !LOCAL_MODE){
      loadAuthSession();
      if(!AUTH_SESSION || !AUTH_SESSION.access_token){
        renderAuthScreen();
        return;
      }
      if(AUTH_SESSION.lang){ LANG = AUTH_SESSION.lang; try{localStorage.setItem('zib_lang',LANG);}catch(e){} applyLangToDom(); }
      if(AUTH_SESSION.theme){ THEME = AUTH_SESSION.theme; try{localStorage.setItem('zib_theme',THEME);}catch(e){} applyThemeToDom(); }
      startSessionKeepAlive();
    }
    await loadAll();
    render();
    autoBackupOnLoad();
    cloudAutoBackupOnLoad();
  } finally {
    hideAppLoader();
  }
}
document.addEventListener('click', (ev)=>{
  if(openDropdownIdx!==null && !ev.target.closest('.topnav-item')){
    closeDropdown();
  }
});
if(window.visualViewport){
  const syncOverlayHeight = ()=>{
    const overlay = document.querySelector('.overlay');
    if(overlay && window.innerWidth<=640){
      overlay.style.height = window.visualViewport.height + 'px';
    }
  };
  window.visualViewport.addEventListener('resize', syncOverlayHeight);
  window.visualViewport.addEventListener('scroll', syncOverlayHeight);
}
init();
</script>
</body>
</html>
