function openStockTransferModal(){
  const productOpts = DB.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  const whOpts = DB.warehouses.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('');
  const body = `
    <div class="field"><label>المنتج</label><select id="f_prod" onchange="updateTransferAvail()">${productOpts}</select></div>
    <div class="row2">
      <div class="field"><label>من مخزن</label><select id="f_from" onchange="updateTransferAvail()">${whOpts}</select></div>
      <div class="field"><label>إلى مخزن</label><select id="f_to">${whOpts}</select></div>
    </div>
    <div class="field"><label>الكمية المتاحة بالمخزن المصدر: <b id="transferAvail">0</b></label><input id="f_qty" type="number" min="0" step="1" value="0"></div>
  `;
  openModal('تحويل مخزون بين المخازن', body, ()=>{
    const pid = document.getElementById('f_prod').value;
    const from = document.getElementById('f_from').value;
    const to = document.getElementById('f_to').value;
    const qty = parseFloat(document.getElementById('f_qty').value)||0;
    if(from===to){ toast('اختر مخزنين مختلفين'); return false; }
    if(qty<=0){ toast('أدخل كمية صحيحة'); return false; }
    const p = productById(pid);
    ensureWarehouseInit(p);
    const avail = p.stockByWarehouse[from]||0;
    if(qty>avail){ toast('الكمية المطلوبة أكبر من المتاح بالمخزن المصدر'); return false; }
    p.stockByWarehouse[from] = avail - qty;
    p.stockByWarehouse[to] = (p.stockByWarehouse[to]||0) + qty;
    persist('products');
    const fromName = DB.warehouses.find(w=>w.id===from).name, toName = DB.warehouses.find(w=>w.id===to).name;
    logStockMove(pid, 0, 'warehouse_transfer', '-', 'تحويل '+fmt(qty)+' من '+fromName+' إلى '+toName);
    logActivity('warehouse', 'تحويل '+fmt(qty)+' من "'+p.name+'" من '+fromName+' إلى '+toName);
    closeModal(); render(); toast('تم التحويل بنجاح');
  });
  setTimeout(updateTransferAvail, 0);
}
function updateTransferAvail(){
  const pid = document.getElementById('f_prod').value;
  const from = document.getElementById('f_from').value;
  const p = productById(pid);
  if(!p) return;
  ensureWarehouseInit(p);
  const el = document.getElementById('transferAvail');
  if(el) el.textContent = fmt(p.stockByWarehouse[from]||0);
}
function openStockAdjustModal(productId){
  if(!requirePerm('manage_accounts','تسوية المخزون')) return;
  const p = productById(productId);
  if(!p) return;
  const body = `
    <div class="field"><label>المنتج</label><input value="${esc(p.name)}" disabled></div>
    <div class="row2">
      <div class="field"><label>الكمية الحالية بالنظام</label><input value="${fmt(p.quantity)}" disabled></div>
      <div class="field"><label>الكمية الفعلية بعد الجرد *</label><input id="f_actual_qty" type="number" step="1" value="${p.quantity}" oninput="updateAdjustDiff(${p.quantity})"></div>
    </div>
    <div id="adjustDiffLine" style="font-size:13px;color:var(--text-muted);margin-bottom:10px;">الفرق: 0</div>
    <div class="field"><label>سبب التسوية</label><textarea id="f_adjust_reason" rows="2" placeholder="مثال: جرد دوري - تلف - فقدان"></textarea></div>
  `;
  openModal('تسوية مخزون: '+p.name, body, ()=>{
    const actualQty = parseFloat(document.getElementById('f_actual_qty').value);
    if(isNaN(actualQty) || actualQty<0){ toast('أدخل كمية صحيحة'); return false; }
    const diff = actualQty - p.quantity;
    if(diff===0){ toast('لا يوجد فرق - الكمية مطابقة بالفعل'); return false; }
    const reason = document.getElementById('f_adjust_reason').value.trim() || 'تسوية جرد';
    const oldQty = p.quantity;
    p.quantity = actualQty;
    persist('products');
    logStockMove(p.id, diff, 'adjustment', '', reason);
    const value = Math.abs(diff) * (p.purchasePrice||0);
    if(value>0){
      if(diff>0){
        postJournal(todayISO(), 'تسوية مخزون (زيادة) - '+p.name+': '+reason, [
          {accountId:'acc_inventory', debit:value, credit:0},
          {accountId:'acc_inv_adj', debit:0, credit:value},
        ], 'manual');
      }else{
        postJournal(todayISO(), 'تسوية مخزون (نقص) - '+p.name+': '+reason, [
          {accountId:'acc_inv_adj', debit:value, credit:0},
          {accountId:'acc_inventory', debit:0, credit:value},
        ], 'manual');
      }
    }
    logActivity('stock_adjust', 'تسوية مخزون '+p.name+' من '+fmt(oldQty)+' إلى '+fmt(actualQty)+' ('+reason+')');
    closeModal(); render(); toast('تم تسجيل التسوية بنجاح');
  });
}
function updateAdjustDiff(oldQty){
  const el = document.getElementById('f_actual_qty');
  const line = document.getElementById('adjustDiffLine');
  if(!el||!line) return;
  const actual = parseFloat(el.value)||0;
  const diff = actual - oldQty;
  line.textContent = 'الفرق: '+(diff>0?'+':'')+fmt(diff);
  line.style.color = diff===0 ? 'var(--text-muted)' : (diff>0?'var(--success)':'var(--danger)');
}

function openPriceHistoryModal(productId){
  const p = productById(productId);
  if(!p) return;
  const rows = [];
  approvedPurchases().forEach(pur=>{
    pur.items.forEach(it=>{
      if(it.productId===productId) rows.push({date:pur.date, supplier:pur.partyName, qty:it.qty, price:it.price, invNumber:pur.number});
    });
  });
  rows.sort((a,b)=>b.date.localeCompare(a.date));
  const prices = rows.map(r=>r.price);
  const minP = prices.length?Math.min(...prices):0;
  const maxP = prices.length?Math.max(...prices):0;
  const avgP = prices.length?(prices.reduce((s,x)=>s+x,0)/prices.length):0;
  const body = rows.length===0 ? `<p style="font-size:12.5px;color:var(--text-muted);">لا يوجد سجل شراء سابق لهذا المنتج بعد.</p>` : `

      <div class="stat-card"><div class="lbl">متوسط السعر</div><div class="val">${money(avgP)}</div></div>
      <div class="stat-card"><div class="lbl">أعلى سعر</div><div class="val">${money(maxP)}</div></div>
    </div>
    <div class="table-wrap"><table>
      <thead><tr><th>التاريخ</th><th>المورد</th><th>رقم الفاتورة</th><th>الكمية</th><th>سعر الوحدة</th></tr></thead>
      <tbody>${rows.map(r=>`<tr><td>${fmtDate(r.date)}</td><td>${esc(r.supplier)}</td><td>${r.invNumber}</td><td class="tnum">${fmt(r.qty)}</td><td class="tnum">${money(r.price)}</td></tr>`).join('')}</tbody>
    </table></div>

  openModal('تاريخ أسعار الشراء - '+p.name, body, ()=>{ closeModal(); });

function duplicateSaleInvoice(id){

  window._quotePrefillPartyId = inv.partyId;

function openProductGroupModal(editId){
  const group = editId ? DB.productGroups.find(g=>g.id===editId) : null;
  const productOpts = DB.products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('');
  window._pgProductOpts = productOpts;
  const body = `
    <div class="field"><label>اسم المجموعة</label><input id="f_name" value="${group?esc(group.name):''}" placeholder="مثال: طلبية صالون الجميلة الشهرية"></div>
    <label>الأصناف</label>
    <div class="item-rows" id="pgRows">
      <div class="item-row head-row" style="grid-template-columns:2.5fr 1fr 34px;"><div>المنتج</div><div>الكمية</div><div></div></div>
    </div>
    <button class="btn btn-outline btn-sm" type="button" onclick="addPgRow()">${icon('plus')} إضافة صنف</button>
  `;
  openModal(group?'تعديل مجموعة منتجات':'مجموعة منتجات جديدة', body, ()=>{
    const name = document.getElementById('f_name').value.trim();
    if(!name){ toast('اكتب اسم للمجموعة'); return false; }
    const rows = Array.from(document.querySelectorAll('#pgRows .item-row:not(.head-row)'));
    const items = [];
    rows.forEach(row=>{
      const pid = row.querySelector('.sel-product').value;
      const qty = parseFloat(row.querySelector('.inp-qty').value)||0;
      if(pid && qty>0) items.push({productId:pid, qty});
    });
    if(items.length===0){ toast('أضف صنف واحد على الأقل'); return false; }
    if(group){ Object.assign(group, {name, items}); logActivity('product_group', 'تعديل مجموعة منتجات: '+name); }
    else{ DB.productGroups.push({id:uid(), name, items, createdAt:Date.now()}); logActivity('product_group', 'إنشاء مجموعة منتجات: '+name); }
    persist('productGroups');
    closeModal(); render(); toast('تم الحفظ بنجاح');
  });
  if(group && group.items.length){
    group.items.forEach(()=>addPgRow());
    setTimeout(()=>{
      const rows = document.querySelectorAll('#pgRows .item-row:not(.head-row)');
      group.items.forEach((it,i)=>{
        const row = rows[i]; if(!row) return;
        row.querySelector('.sel-product').value = it.productId;
        row.querySelector('.inp-qty').value = it.qty;
      });
    }, 0);
  }else{
    addPgRow();
  }
}
function addPgRow(){
  const wrap = document.getElementById('pgRows');
  const rowId = 'pgrow_'+uid();
  const div = document.createElement('div');
  div.className = 'item-row';
  div.id = rowId;
  div.style.gridTemplateColumns = '2.5fr 1fr 34px';
  div.innerHTML = `
    <select class="sel-product">${window._pgProductOpts}</select>
    <input class="inp-qty" type="number" min="0" step="1" value="1">
    <button class="rm-btn" type="button" onclick="document.getElementById('${rowId}').remove();">${icon('close')}</button>
  `;
  wrap.appendChild(div);
}
function deleteProductGroup(id){
  if(!requirePerm('delete_records','حذف مجموعات المنتجات')) return;
  confirmAction('حذف المجموعة', 'هل تريد حذف هذه المجموعة؟', ()=>{
    const g = DB.productGroups.find(x=>x.id===id);
    DB.productGroups = DB.productGroups.filter(x=>x.id!==id);
    persist('productGroups');
    logActivity('product_group', 'حذف مجموعة منتجات: '+(g?g.name:id));
    openProductGroupsModal();
    toast('تم الحذف');
  });
}
function loadProductGroupIntoSale(groupId, selectEl){
  if(!groupId) return;
  const group = DB.productGroups.find(g=>g.id===groupId);
  if(selectEl) selectEl.value = '';
  if(!group) return;
  group.items.forEach(()=>addItemRow('sale'));
  setTimeout(()=>{
    const rows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
    const newRows = Array.from(rows).slice(rows.length-group.items.length);
    const partyEl = document.getElementById('f_party');
    const partyId = partyEl ? partyEl.value : null;
    group.items.forEach((it,i)=>{
      const row = newRows[i]; if(!row) return;
      const prod = productById(it.productId);
      row.querySelector('.sel-product').value = it.productId;
      row.querySelector('.inp-qty').value = it.qty;

}
function loadProductGroupIntoConsign(groupId, selectEl, type){
  if(!groupId) return;

  if(selectEl) selectEl.value = '';
  if(!group) return;
  group.items.forEach(()=>addConsignItemRow(type));

      const row = newRows[i]; if(!row) return;

}
function duplicateProduct(id){
  const p = productById(id);
  if(!p) return;
  const prefill = {
    ...p,
    code: 'PRD-'+String(DB.products.length+1).padStart(4,'0'),
    name: p.name + ' (نسخة)',
    barcode: '',
    quantity: 0,
  };
  toast('عدّل بيانات النسخة واضغط حفظ');
  openProductModal(null, prefill);
}
function isProductUsedAnywhere(id){
  return DB.sales.some(s=>s.items.some(it=>it.productId===id))
    || DB.purchases.some(s=>s.items.some(it=>it.productId===id))
    || DB.quotations.some(s=>s.items.some(it=>it.productId===id))
    || DB.purchaseOrders.some(s=>s.items.some(it=>it.productId===id))
    || DB.testerHandouts.some(s=>s.items.some(it=>it.productId===id))
    || DB.consignShipments.some(s=>s.items.some(it=>it.productId===id))
    || DB.consignReports.some(s=>s.items.some(it=>it.productId===id))
    || DB.returns.some(s=>s.items.some(it=>it.productId===id))
    || DB.landedCosts.some(s=>s.items.some(it=>it.productId===id))
    || DB.boms.some(b=>b.productId===id || b.items.some(it=>it.materialId===id))
    || DB.productionOrders.some(o=>o.producedProductId===id || o.materials.some(m=>m.productId===id));
}
function deleteProduct(id){
  if(!requirePerm('delete_records','حذف المنتجات')) return;
  const p = productById(id);
  const used = isProductUsedAnywhere(id);
  if(used){ toast('لا يمكن حذف هذا المنتج لوجود مستندات مرتبطة به (فاتورة، إذن، وصفة تصنيع، أو غيرها)'); return; }
  confirmAction('حذف المنتج', 'هل تريد حذف هذا المنتج؟ لا يمكن التراجع عن هذا الإجراء.', ()=>{
    DB.products = DB.products.filter(x=>x.id!==id);
    DB.priceLists.forEach(pl=>{ if(pl.prices && pl.prices[id]!=null) delete pl.prices[id]; });
    persist('products'); persist('priceLists');
    logActivity('product_delete', 'حذف منتج '+(p?p.name:id));
    closeModal(); render(); toast('تم حذف المنتج');
  });
}

let partyFilter = {customers:'', suppliers:''};
/* ============ CRM (customer follow-up) ============ */
const CRM_STAGES = {
  lead: {label:'عميل محتمل', badge:'partial'},
  active: {label:'نشط', badge:'ok'},
  vip: {label:'VIP', badge:'paid'},
  inactive: {label:'غير نشط', badge:'unpaid'},
};
let crmFilter = 'all';
function renderCRMPage(){
  const today = todayISO();
  const rows = DB.customers.map(c=>{
    const acts = DB.crmActivities.filter(a=>a.customerId===c.id).sort((a,b)=>b.createdAt-a.createdAt);
    const last = acts[0];
    const stage = c.crmStage || 'lead';
    return {c, stage, lastActivity:last, nextFollowup:c.nextFollowup||null};
  });
  const dueToday = rows.filter(r=>r.nextFollowup && r.nextFollowup<=today);
  const overdue = rows.filter(r=>r.nextFollowup && r.nextFollowup<today);
  const vipCount = rows.filter(r=>r.stage==='vip').length;
  let filtered = rows;
  if(crmFilter==='due') filtered = dueToday;
  else if(crmFilter==='overdue') filtered = overdue;
  else if(CRM_STAGES[crmFilter]) filtered = rows.filter(r=>r.stage===crmFilter);
  filtered = filtered.sort((a,b)=>{
    if(a.nextFollowup && b.nextFollowup) return a.nextFollowup.localeCompare(b.nextFollowup);
    if(a.nextFollowup) return -1;
    if(b.nextFollowup) return 1;
    return a.c.name.localeCompare(b.c.name);
  });
  const tabs = [
    {id:'all', label:'الكل ('+rows.length+')'},
    {id:'due', label:'مستحقة اليوم ('+dueToday.length+')'},
    {id:'overdue', label:'متأخرة ('+overdue.length+')'},
    {id:'lead', label:CRM_STAGES.lead.label},
    {id:'active', label:CRM_STAGES.active.label},
    {id:'vip', label:CRM_STAGES.vip.label},
    {id:'inactive', label:CRM_STAGES.inactive.label},
  ];
  return `
    <div class="stat-grid">
      <div class="stat-card ${overdue.length>0?'red':''}"><div class="lbl">${icon('alert')} متابعات متأخرة</div><div class="val">${overdue.length}</div></div>
      <div class="stat-card gold"><div class="lbl">مستحقة اليوم</div><div class="val">${dueToday.length}</div></div>
      <div class="stat-card"><div class="lbl">عملاء VIP</div><div class="val">${vipCount}</div></div>
      <div class="stat-card"><div class="lbl">إجمالي العملاء</div><div class="val">${rows.length}</div></div>
    </div>
    <div class="card">
      <div class="card-head"><h2>متابعة العملاء</h2></div>
      <div class="tabs">${tabs.map(t=>`<div class="tab ${crmFilter===t.id?'active':''}" onclick="crmFilter='${t.id}'; render();">${t.label}</div>`).join('')}</div>
      ${filtered.length===0?emptyState('لا يوجد عملاء في هذا التصنيف','', false):`
      <div class="table-wrap"><table>
        <thead><tr><th>العميل</th><th>المرحلة</th><th>آخر نشاط</th><th>المتابعة القادمة</th><th></th></tr></thead>
        <tbody>${filtered.map(r=>{
          const isOverdueRow = r.nextFollowup && r.nextFollowup<today;
          const isDueRow = r.nextFollowup && r.nextFollowup===today;
          return `<tr>
            <td>${esc(r.c.name)}</td>
            <td>
              <select onchange="setCrmStage('${r.c.id}', this.value)" style="width:auto;padding:4px 8px;font-size:12px;">
                ${Object.keys(CRM_STAGES).map(k=>`<option value="${k}" ${r.stage===k?'selected':''}>${CRM_STAGES[k].label}</option>`).join('')}
              </select>
            </td>
            <td style="font-size:12px;color:var(--text-muted);">${r.lastActivity?esc(r.lastActivity.note).slice(0,40)+(r.lastActivity.note.length>40?'...':'')+' - '+fmtDate(r.lastActivity.date):'لا يوجد'}</td>
            <td>${r.nextFollowup?`<span class="${isOverdueRow?'badge unpaid':(isDueRow?'badge partial':'')}">${fmtDate(r.nextFollowup)}</span>`:'-'}</td>
            <td>
              <button class="btn btn-outline btn-sm" onclick="openCRMActivityModal('${r.c.id}')">${icon('plus')} تسجيل متابعة</button>
              <button class="btn btn-outline btn-icon btn-sm" onclick="openCRMTimelineModal('${r.c.id}')" title="السجل الكامل">${icon('history')}</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>`}
    </div>
  `;
}

  const c = customerById(customerId);
  if(!c) return;
  c.crmStage = stage;
  persist('customers');
  logActivity('crm', 'تغيير مرحلة العميل '+c.name+' إلى '+CRM_STAGES[stage].label);

function getCustomerStatementData(customerId){
  const cust = customerById(customerId);
  const invs = approvedSales().filter(s=>s.partyId===customerId);
  const totalInvoiced = invs.reduce((s,i)=>s+i.total,0);
  const totalPaid = invs.reduce((s,i)=>s+i.paidAmount,0);
  const groups = {};
  invs.forEach(inv=>{
    const key = inv.branchId || '__main__';
    const label = inv.branchName || 'العنوان الرئيسي (بدون فرع)';
    if(!groups[key]) groups[key] = {label, count:0, invoiced:0, paid:0};
    groups[key].count++;
    groups[key].invoiced += inv.total;
    groups[key].paid += inv.paidAmount;
  });
  const branchRows = Object.values(groups).sort((a,b)=>b.invoiced-a.invoiced);
  return { cust, invs: [...invs].sort((a,b)=>b.createdAt-a.createdAt), totalInvoiced, totalPaid, totalDue: totalInvoiced-totalPaid, branchRows };
}

function getEffectivePrice(productId, customerId){
  const p = productById(productId);
  if(!p) return 0;
  if(!customerId) return p.salePrice||0;
  const cust = customerById(customerId);
  if(!cust || !cust.priceListId) return p.salePrice||0;
  const pl = DB.priceLists.find(x=>x.id===cust.priceListId);
  if(!pl || !pl.prices || pl.prices[productId]==null) return p.salePrice||0;
  return pl.prices[productId];
}

let salesFilter = '';
function renderSales(){
  const list = [...DB.sales].filter(s=>(s.number+s.partyName+(s.poNumber||'')).toLowerCase().includes(salesFilter.toLowerCase())).sort((a,b)=>b.createdAt-a.createdAt);
  return `
    <div class="card">
      <div class="card-head">
        <h2>فواتير المبيعات (${DB.sales.length})</h2>
        <button class="btn btn-primary" onclick="openSaleModal()">${icon('plus')} فاتورة بيع جديدة</button>
      </div>
      <div class="search-bar"><input id="search_salesFilter" placeholder="بحث برقم الفاتورة أو اسم العميل أو رقم أمر الشراء..." value="${esc(salesFilter)}" oninput="salesFilter=this.value; renderKeepFocus('search_salesFilter');"></div>
      ${list.length===0 ? emptyState('لا توجد فواتير مبيعات','سجّل أول عملية بيع لعميلك',true,'sales') : `
      <div class="table-wrap"><table>
        <thead><tr><th>رقم الفاتورة</th><th>رقم أمر الشراء (PO)</th><th>العميل</th><th>الفرع</th><th>التاريخ</th><th>الاستحقاق</th><th>عدد الأصناف</th><th>الإجمالي</th><th>المدفوع</th><th>المتبقي</th><th>الحالة</th><th></th></tr></thead>
        <tbody>${list.map(s=>`
          <tr>
            <td>${s.number}</td><td>${s.poNumber?esc(s.poNumber):'-'}</td><td>${esc(s.partyName)}</td><td>${s.branchName?esc(s.branchName):'-'}</td><td>${fmtDate(s.date)}</td><td>${s.dueDate?fmtDate(s.dueDate):'-'}</td><td>${s.items.length}</td>
            <td class="tnum">${money(s.total)}</td><td class="tnum">${money(s.paidAmount)}</td>
            <td class="tnum">${money(s.total-s.paidAmount)}</td><td>${statusBadge(s)}${isOverdue(s)?' <span class="badge low">متأخرة</span>':''}${s.fromConsignment?' <span class="badge neutral">أمانة</span>':''}</td>
            <td>
              <button class="btn btn-outline btn-icon btn-sm" onclick="printInvoice('sales','${s.id}')" title="طباعة">${icon('printer')}</button>
              ${commentsButtonHtml('sale', s.id)}
              ${s.fromConsignment?'':`<button class="btn btn-outline btn-icon btn-sm" onclick="openSaleModal('${s.id}')" title="تعديل">${icon('edit')}</button>`}
              <button class="btn btn-outline btn-icon btn-sm" onclick="duplicateSaleInvoice('${s.id}')" title="نسخ الفاتورة">${icon('duplicate')}</button>
              ${((s.status||'approved')==='approved')?`
              ${s.fromConsignment?'':`<button class="btn btn-outline btn-icon btn-sm" onclick="openReturnModal('sales','${s.id}')" title="مرتجع">${icon('undo')}</button>`}
              <button class="btn btn-outline btn-sm" onclick="printDeliveryNote('${s.id}')" title="إذن تسليم">${icon('inventory')} إذن تسليم</button>
              ${s.total-s.paidAmount>0.009?`<button class="btn btn-outline btn-sm" onclick="openPaymentModal('sales','${s.id}')">${icon('money')} تحصيل</button>`:''}
              `:''}
              ${((s.status||'approved')==='pending' && can('approve_invoices'))?`
              <button class="btn btn-primary btn-sm" onclick="approveSaleInvoice('${s.id}')">${icon('plus')} اعتماد</button>
              <button class="btn btn-danger-o btn-sm" onclick="rejectSaleInvoice('${s.id}')">رفض</button>
              `:''}
              ${(can('delete_invoices') && !s.fromConsignment)?`<button class="btn btn-danger-o btn-icon btn-sm" onclick="deleteInvoice('sales','${s.id}')">${icon('trash')}</button>`:''}
            </td>
          </tr>`).join('')}</tbody>
      </table></div>`}
    </div>
  `;
}
function openSaleModal(editId){
  const editInv = editId ? DB.sales.find(i=>i.id===editId) : null;
  if(editInv && editInv.fromConsignment){ toast('دي فاتورة ناتجة من تقرير مبيعات أمانة - لا يمكن تعديلها مباشرة'); return; }
  if(!editInv && DB.products.length===0){ toast('أضف منتجات أولاً من صفحة المخزون'); return; }
  const customersOpts = DB.customers.map(c=>`<option value="${c.id}" ${editInv&&editInv.partyId===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  const productOpts = saleEligibleProducts(editInv?editInv.items.map(it=>it.productId):[]).map(p=>`<option value="${p.id}" data-price="${getEffectivePrice(p.id, editInv?editInv.partyId:null)}" data-stock="${p.quantity}">${esc(p.name)} (متاح: ${fmt(p.quantity)})</option>`).join('');
  const termsOpts = PAYMENT_TERMS.map(t=>`<option value="${t.id}" ${editInv&&editInv.paymentTerm===t.id?'selected':''}>${t.label} / ${t.labelEn}</option>`).join('');
  const dTax = DB.settings.taxRate!=null?DB.settings.taxRate:0;
  const body = `
    <div style="background:var(--surface-2);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13.5px;font-weight:700;">${dl('رقم الفاتورة','Invoice No.')}: ${editInv?esc(editInv.number):peekInvoiceNo()}</div>
    <div class="row2">
      <div class="field"><label>${lbl('العميل *','Customer *')}</label>
        <select id="f_party" onchange="onSalePartyChange()">${DB.customers.length? '<option value="">اختر عميل...</option>'+customersOpts : '<option value="">لا يوجد عملاء - أضف عميل أولاً</option>'}</select>
        ${quickAddPartyHtml('customers')}
      </div>
      <div class="field"><label>${lbl('الفرع المستلم (اختياري)','Receiving Branch')}</label><select id="f_branch"><option value="">بدون فرع - العنوان الرئيسي</option></select></div>
    </div>
    <div class="field"><label>${lbl('رقم أمر شراء العميل (PO Number)','Customer PO Number')}</label><input id="f_po" dir="ltr" style="text-align:left;" value="${editInv?esc(editInv.poNumber||''):''}" placeholder="مثال: PO-2026-0451 (يظهر على الفاتورة وإذن التسليم)"></div>
    <div class="field"><label>مندوب المبيعات (اختياري)</label><select id="f_rep"><option value="">بدون مندوب</option>${DB.salesReps.map(r=>`<option value="${r.id}" ${editInv&&editInv.salesRepId===r.id?'selected':''}>${esc(r.name)} (${(r.commissionType||'percent')==='fixed'?money(r.commissionValue!=null?r.commissionValue:0)+'/فاتورة':(r.commissionValue!=null?r.commissionValue:r.commissionPercent||0)+'%'})</option>`).join('')}</select></div>
    <div class="row3">
      <div class="field"><label>${lbl('التاريخ','Date')}</label><input id="f_date" type="date" value="${editInv?editInv.date:todayISO()}" oninput="onTermChange()"></div>
      <div class="field"><label>${lbl('شروط الدفع','Payment Terms')}</label><select id="f_term" onchange="onTermChange()">${termsOpts}</select></div>
      <div class="field"><label>${lbl('تاريخ الاستحقاق','Due Date')}</label><input id="f_duedate" type="date" value="${editInv?editInv.dueDate:todayISO()}" disabled></div>
    </div>
    <div id="advanceBox" style="display:none;"></div>
    <div id="consignNotice" style="display:none;background:var(--warning-bg);border:1px solid #EAD6A5;border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:12.5px;color:#8A5A0A;">
      ${icon('alert')} هيتم إصدار <b>إذن صرف بضاعة أمانة</b> بدل فاتورة بيع عادية — البضاعة هتفضل ملكك ومفيش أي إيراد أو ربح هيتسجل دلوقتي. لما المتجر يبيع فعلياً، سجّل ذلك من صفحة "البيع بالأمانة" لإثبات الإيراد الحقيقي.
    </div>
    <div class="field"><label>${lbl('مسح الباركود','Scan Barcode')}</label><input id="barcodeScan" placeholder="امسح الباركود بالقارئ أو اكتبه واضغط Enter" onkeydown="if(event.key==='Enter'){event.preventDefault(); scanBarcodeAdd(this,'sale');}"></div>
    <label>${lbl('الأصناف','Items')}</label>
    <div class="item-rows" id="itemRows">
      <div class="item-row head-row"><div>${lbl('المنتج','Item')}</div><div>${lbl('الكمية','Qty')}</div><div>${lbl('السعر','Price')}</div><div>${lbl('الإجمالي','Total')}</div><div></div></div>
    </div>
    <button class="btn btn-outline btn-sm" onclick="addItemRow('sale')" type="button">${icon('plus')} إضافة صنف</button>
    <div class="field" style="margin-top:8px;"><select onchange="loadProductGroupIntoSale(this.value, this)" style="font-size:12.5px;"><option value="">+ تحميل مجموعة منتجات محفوظة...</option>${DB.productGroups.map(g=>`<option value="${g.id}">${esc(g.name)} (${g.items.length} صنف)</option>`).join('')}</select></div>
    <div id="salePayFields">
    <div class="row3" style="margin-top:14px;">
      <div class="field"><label>${lbl('نوع الخصم','Discount Type')}</label>
        <select id="f_disc_type" onchange="updateSaleTotals()">
          <option value="amount" ${editInv&&editInv.discountType==='amount'?'selected':''}>مبلغ ثابت</option>
          <option value="percent" ${editInv&&editInv.discountType==='percent'?'selected':''}>نسبة %</option>
        </select>
      </div>
      <div class="field"><label>${lbl('قيمة الخصم','Discount Value')}</label><input id="f_disc_value" type="number" step="0.01" value="${editInv?editInv.discountValue||0:0}" oninput="updateSaleTotals()"></div>
      <div class="field"><label>${lbl('نسبة الضريبة %','VAT Rate %')}</label><input id="f_tax_rate" type="number" step="0.01" value="${editInv?editInv.taxRate:dTax}" oninput="updateSaleTotals()"></div>
    </div>
    <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-bottom:10px;">
      <input type="checkbox" id="f_tax_enabled" ${(editInv?editInv.taxEnabled:DB.settings.taxEnabled)?'checked':''} onchange="updateSaleTotals()" style="width:auto;">
      ${lbl('تطبيق ضريبة القيمة المضافة','Apply VAT')}
    </label>
    <div style="margin-top:8px;">
      <div class="tot-line"><span>${lbl('الإجمالي الفرعي','Subtotal')}</span><span class="tnum" id="subTotalDisp">${money(0)}</span></div>
      <div class="tot-line"><span>${lbl('الخصم','Discount')}</span><span class="tnum" id="discDisp">${money(0)}</span></div>
      <div class="tot-line"><span>${lbl('الصافي الخاضع للضريبة','Taxable Amount')}</span><span class="tnum" id="taxableDisp">${money(0)}</span></div>
      <div class="tot-line"><span>${lbl('ضريبة القيمة المضافة','VAT')}</span><span class="tnum" id="taxDisp">${money(0)}</span></div>
      <div class="tot-line grand"><span>${lbl('الإجمالي','Total')}</span><span class="tnum" id="saleTotalDisp">${money(0)}</span></div>
      <div class="field" style="margin-top:8px;"><label>${lbl('المبلغ المدفوع الآن (نقداً)','Amount Paid Now (Cash)')}</label><input id="f_paid" type="number" step="0.01" value="${editInv?0:0}" oninput="updateSaleTotals()"></div>
      <div class="field"><label>الخزينة / الحساب البنكي المستلم فيه</label><select id="f_cashacc">${cashBankOptionsHtml()}</select></div>
      <div class="tot-line grand"><span>${lbl('المتبقي','Balance Due')}</span><span class="tnum" id="saleDueDisp">${money(0)}</span></div>
      ${editInv?`<div style="font-size:12px;color:var(--text-muted);margin-top:6px;">المبلغ المدفوع سابقاً (${money(editInv.paidAmount)}) لن يتأثر بالتعديل — استخدم زر "تحصيل" لإضافة دفعات جديدة.</div>`:''}
    </div>
    </div>
  `;
  window._saleProductOpts = productOpts;
  openModal(editInv?('تعديل فاتورة بيع '+editInv.number):'فاتورة بيع جديدة', body, ()=>{
    const partyId = document.getElementById('f_party').value;
    if(!partyId){ toast('اختر عميل'); return false; }
    const date = document.getElementById('f_date').value || todayISO();
    const termId = document.getElementById('f_term').value;
    const dueDate = document.getElementById('f_duedate').value || date;
    const rows = Array.from(document.querySelectorAll('#itemRows .item-row:not(.head-row)'));
    const items = [];
    for(const row of rows){
      const sel = row.querySelector('.sel-product');
      const qtyEl = row.querySelector('.inp-qty');
      const priceEl = row.querySelector('.inp-price');
      if(!sel.value) continue;
      const prod = productById(sel.value);
      const qty = parseFloat(qtyEl.value)||0;
      const price = parseFloat(priceEl.value)||0;
      if(qty<=0) continue;
      const availableStock = prod.quantity + (editInv ? (editInv.items.find(x=>x.productId===prod.id)?.qty||0) : 0);
      if(qty>availableStock){ toast('الكمية المطلوبة من "'+prod.name+'" أكبر من المتاح بالمخزون'); return false; }
      items.push({productId:prod.id, name:prod.name, code:prod.code||'', barcode:prod.barcode||'', qty, price, cost:prod.purchasePrice, total:qty*price, notes:prod.notes||''});
    }
    if(items.length===0){ toast('أضف صنف واحد على الأقل'); return false; }

    if(termId==='consignment' && !editInv){
      const cust = customerById(partyId);
      const branchIdEl = document.getElementById('f_branch');
      const branchId = branchIdEl ? branchIdEl.value : '';
      const branch = branchId ? (cust.branches||[]).find(b=>b.id===branchId) : null;
      const shipItems = items.map(it=>({productId:it.productId, name:it.name, code:it.code, barcode:it.barcode, notes:it.notes, qty:it.qty, cost:it.cost}));
      const ship = { id:uid(), number:nextConsignOutNumber(), type:'out', date, customerId:partyId, customerName:cust.name, branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null, items:shipItems, poNumber:document.getElementById('f_po')?document.getElementById('f_po').value.trim():'', status:'pending', createdAt:Date.now(), createdBy:currentUserName() };
      DB.consignShipments.push(ship);
      persist('consignShipments');
      logActivity('consignment', 'إذن صرف بضاعة أمانة '+ship.number+' - '+ship.customerName+' (من نموذج فاتورة البيع - بانتظار الموافقة)');
      closeModal(); consignTab='shipments'; goTo('consignment');
      toast('تم الحفظ بانتظار الموافقة - لن يتحرك المخزون أو الحسابات حتى الاعتماد');
      return;
    }
    if(editInv && (editInv.status||'approved')==='approved' && !checkPeriodLock(date)) return false;
    const subtotal = items.reduce((s,i)=>s+i.total,0);
    const discType = document.getElementById('f_disc_type').value;
    const discValue = parseFloat(document.getElementById('f_disc_value').value)||0;
    const discountAmount = Math.min(subtotal, discType==='percent' ? subtotal*discValue/100 : discValue);
    const taxable = subtotal - discountAmount;
    const taxEnabled = document.getElementById('f_tax_enabled').checked;
    const taxRate = parseFloat(document.getElementById('f_tax_rate').value)||0;
    const taxAmount = taxEnabled ? taxable*taxRate/100 : 0;
    const total = taxable + taxAmount;
    const paid = Math.min(parseFloat(document.getElementById('f_paid').value)||0, total);
    const cashAcc = document.getElementById('f_cashacc') ? document.getElementById('f_cashacc').value : 'acc_cash';
    const advAvail = partyAdvanceBalance('customers', partyId);
    const advUseEl = document.getElementById('f_advUse');
    const advUse = advUseEl ? Math.min(parseFloat(advUseEl.value)||0, advAvail, Math.max(0,total-paid)) : 0;
    const party = customerById(partyId);
    const branchId = document.getElementById('f_branch') ? document.getElementById('f_branch').value : '';
    const branch = branchId ? (party.branches||[]).find(b=>b.id===branchId) : null;
    const poNumber = document.getElementById('f_po') ? document.getElementById('f_po').value.trim() : '';
    const salesRepId = document.getElementById('f_rep') ? document.getElementById('f_rep').value : '';
    const rep = salesRepId ? DB.salesReps.find(r=>r.id===salesRepId) : null;
    if(!editInv && party.creditLimit>0){
      const currentBalance = partyBalance('customer', partyId, 'acc_ar');
      const newBalance = currentBalance + (total - (paid+advUse));
      if(newBalance > party.creditLimit + 0.009){
        if(!confirm('تنبيه: هذا العميل هيتخطى الحد الائتماني المسموح له ('+money(party.creditLimit)+').\nالرصيد الحالي: '+money(currentBalance)+'\nالرصيد المتوقع بعد الفاتورة دي: '+money(newBalance)+'\n\nهل تريد المتابعة رغم ذلك؟')){
          return false;
        }
      }
    }

    const saleOrphan = items.find(it=>!productById(it.productId));
    if(saleOrphan){ toast('لا يمكن الحفظ: الصنف "'+saleOrphan.name+'" مرتبط بمنتج محذوف أو غير موجود حالياً في النظام'); return false; }

    const editIsApproved = editInv && (editInv.status||'approved')==='approved';
    const editIsPending = editInv && (editInv.status||'approved')==='pending';

    if(editIsApproved){
      let oldSaleItems = editInv.items;
      editInv.items.forEach(it=>{ const p = productById(it.productId); if(p) adjustStock(p, it.qty); });
      removeInvoiceMainEntry(editInv.id);
      items.forEach(it=>{ const p = productById(it.productId); adjustStock(p, -it.qty); });

      const cost = items.reduce((s,i)=>s+i.qty*(i.cost||0),0);
      const lines = [
        {accountId:'acc_ar', debit:total, credit:0, partyType:'customer', partyId, partyName:party.name},
        {accountId:'acc_sales', debit:0, credit:subtotal-discountAmount},
      ];
      if(taxAmount>0) lines.push({accountId:'acc_vat_out', debit:0, credit:taxAmount});
      if(cost>0){ lines.push({accountId:'acc_cogs', debit:cost, credit:0}); lines.push({accountId:'acc_inventory', debit:0, credit:cost}); }

      const oldSnap = { total:editInv.total, dueDate:editInv.dueDate, partyName:editInv.partyName, itemCount:editInv.items.length, termLabel:editInv.termLabel };
      Object.assign(editInv, { partyId, partyName:party.name, date, items, subtotal, discountType:discType, discountValue:discValue, discountAmount, taxEnabled, taxRate, taxAmount, total, paymentTerm:termId, termLabel:termById(termId).label, dueDate, branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null, poNumber, salesRepId:salesRepId||null, salesRepName:rep?rep.name:null });
      if(editInv.paidAmount>total) editInv.paidAmount = total;
      postJournal(date, 'فاتورة بيع '+editInv.number+' - '+party.name, lines, 'sale_invoice', editInv.id, 'invoice_main');
      const diff = diffSummary(oldSnap, {total, dueDate, partyName:party.name, itemCount:items.length, termLabel:termById(termId).label}, [
        {key:'partyName', label:'العميل'},
        {key:'total', label:'الإجمالي', fmt:v=>money(v||0)},
        {key:'dueDate', label:'تاريخ الاستحقاق', fmt:v=>v?fmtDate(v):'-'},
        {key:'itemCount', label:'عدد الأصناف'},
        {key:'termLabel', label:'شروط الدفع'},
      ]);
      logActivity('sale_edit', 'تعديل فاتورة بيع '+editInv.number+(diff?' — '+diff:' - لا توجد تغييرات جوهرية'));
      oldSaleItems.forEach(it=>{ logStockMove(it.productId, it.qty, 'sale_edit_reverse', editInv.number, 'إلغاء فاتورة بيع (تعديل)'); });
      editInv.items.forEach(it=>{ logStockMove(it.productId, -it.qty, 'sale_edit', editInv.number, 'تعديل فاتورة بيع'); });
      persist('sales'); persist('products');
      closeModal(); render(); toast('تم تعديل الفاتورة بنجاح');
      return;
    }

    if(editIsPending){
      Object.assign(editInv, { partyId, partyName:party.name, date, items, subtotal, discountType:discType, discountValue:discValue, discountAmount, taxEnabled, taxRate, taxAmount, total, paymentTerm:termId, termLabel:termById(termId).label, dueDate, branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null, poNumber, salesRepId:salesRepId||null, salesRepName:rep?rep.name:null, paidAmount:Math.min(total,paid+advUse) });
      persist('sales');
      logActivity('sale_edit', 'تعديل فاتورة بيع '+editInv.number+' (لسه بانتظار الموافقة)');
      closeModal(); render(); toast('تم حفظ التعديلات - لسه بانتظار الموافقة');
      return;
    }

    // New invoice - pending approval, no stock/journal impact yet
    const inv = { id:uid(), number:nextInvoiceNo(), date, partyId, partyName:party.name, branchId:branchId||null, branchName:branch?branch.name:null, branchAddress:branch?branch.address:null, poNumber, salesRepId:salesRepId||null, salesRepName:rep?rep.name:null, items, subtotal, discountType:discType, discountValue:discValue, discountAmount, taxEnabled, taxRate, taxAmount, total, paidAmount:Math.min(total,paid+advUse), paymentTerm:termId, termLabel:termById(termId).label, dueDate, status:'pending', createdAt:Date.now(), createdBy:currentUserName(), _cashAcc:cashAcc, _advUse:advUse };
    DB.sales.push(inv);
    persist('sales');
    logActivity('sale_create', 'إنشاء فاتورة بيع '+inv.number+' للعميل '+party.name+' بقيمة '+money(total)+' (بانتظار الموافقة)');
    if(window._saveAfterConvert){
      const q = DB.quotations.find(x=>x.id===window._saveAfterConvert);
      if(q){ q.status='converted'; q.convertedToSaleId=inv.id; persist('quotations'); }
      window._saveAfterConvert = null;
    }
    closeModal(); render(); toast('تم الحفظ بانتظار الموافقة - لن يتحرك المخزون أو الحسابات حتى الاعتماد');
  });
  if(editInv){
    editInv.items.forEach(it=>{ addItemRow('sale'); });
    setTimeout(()=>{
      const rows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
      editInv.items.forEach((it,i)=>{
        const row = rows[i]; if(!row) return;
        row.querySelector('.sel-product').value = it.productId;
        row.querySelector('.inp-qty').value = it.qty;
        row.querySelector('.inp-price').value = it.price;
      });
      updateSaleTotals();
    }, 0);
  }else if(window._quotePrefillItems){
    const prefillItems = window._quotePrefillItems;
    const prefillParty = window._quotePrefillPartyId;
    const prefillSourceId = window._quotePrefillSourceId;
    const prefillPO = window._quotePrefillPO;
    const prefillBranchId = window._quotePrefillBranchId;
    const partyEl0 = document.getElementById('f_party');
    if(partyEl0 && prefillParty) partyEl0.value = prefillParty;
    prefillItems.forEach(()=>addItemRow('sale'));
    setTimeout(()=>{
      const rows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');

        const row = rows[i]; if(!row) return;

        row.querySelector('.inp-qty').value = it.qty;
        row.querySelector('.inp-price').value = it.price;

function onSalePartyChange(selectedBranchId){
  const partyId = document.getElementById('f_party').value;
  document.querySelectorAll('#itemRows .item-row:not(.head-row)').forEach(row=>{
    const sel = row.querySelector('.sel-product');
    if(!sel) return;
    Array.from(sel.options).forEach(opt=>{
      if(opt.value) opt.dataset.price = getEffectivePrice(opt.value, partyId||null);
    });
    if(sel.value){
      const priceInput = row.querySelector('.inp-price');
      if(priceInput) priceInput.value = getEffectivePrice(sel.value, partyId||null);
    }
  });
  updateSaleTotals();
  const box = document.getElementById('advanceBox');
  const branchSel = document.getElementById('f_branch');
  if(branchSel){
    const cust = partyId ? customerById(partyId) : null;
    const branches = (cust && cust.branches) || [];
    branchSel.innerHTML = '<option value="">بدون فرع - العنوان الرئيسي</option>' + branches.map(b=>`<option value="${b.id}" ${b.id===selectedBranchId?'selected':''}>${esc(b.name)}</option>`).join('');
  }
  if(!box) return;
  if(!partyId){ box.style.display='none'; box.innerHTML=''; return; }
  const bal = partyAdvanceBalance('customers', partyId);
  if(bal>0.009){
    box.style.display='block';
    box.innerHTML = `<div class="field"><label>رصيد دفعة مقدمة متاح لهذا العميل: ${money(bal)} — كام تستخدم منه في الفاتورة دي؟</label><input id="f_advUse" type="number" step="0.01" min="0" max="${bal}" value="0" oninput="updateSaleTotals()"></div>`;
  }else{ box.style.display='none'; box.innerHTML=''; }
}
function onTermChange(){
  const termEl = document.getElementById('f_term');
  const dateEl = document.getElementById('f_date');
  const dueEl = document.getElementById('f_duedate');
  if(!termEl||!dateEl||!dueEl) return;
  const t = termById(termEl.value);
  if(t.days!=null){ dueEl.value = addDays(dateEl.value||todayISO(), t.days); dueEl.disabled = true; }
  else{ dueEl.disabled = false; }
  const notice = document.getElementById('consignNotice');
  const payFields = document.getElementById('salePayFields');
  if(notice){
    if(t.id==='consignment'){
      notice.style.display = 'block';
      if(payFields) payFields.style.display = 'none';
    }else{
      notice.style.display = 'none';
      if(payFields) payFields.style.display = '';
    }
  }
}

    const currency = document.getElementById('f_currency') ? document.getElementById('f_currency').value : DB.settings.currency;

      const lines = [

      const diff = diffSummary(oldSnap, {total, dueDate, partyName:supplier.name, itemCount:items.length, termLabel:termById(termId).label}, [
        {key:'partyName', label:'المورد'},
        {key:'total', label:'الإجمالي', fmt:v=>money(v||0)},
        {key:'dueDate', label:'تاريخ الاستحقاق', fmt:v=>v?fmtDate(v):'-'},

      oldPurchItems.forEach(it=>{ logStockMove(it.productId, -it.qty, 'purchase_edit_reverse', editInv.number, 'إلغاء فاتورة شراء (تعديل)'); });
      editInv.items.forEach(it=>{ logStockMove(it.productId, it.qty, 'purchase_edit', editInv.number, 'تعديل فاتورة شراء'); });
      persist('purchases'); persist('products');
      closeModal(); render(); toast('تم تعديل الفاتورة بنجاح');
      return;
    }

    if(editIsPending2){
      Object.assign(editInv, { partyId, partyName:supplier.name, date, items, subtotal, discountType:discType, discountValue:discValue, discountAmount, taxEnabled, taxRate, taxAmount, total, paymentTerm:termId, termLabel:termById(termId).label, dueDate, currency, exchangeRate, originalTotal:totalOrig, originalSubtotal:subtotalOrig, paidAmount:Math.min(total,paid+advUse) });
      persist('purchases');
      logActivity('purchase_edit', 'تعديل فاتورة شراء '+editInv.number+' (لسه بانتظار الموافقة)');
      closeModal(); render(); toast('تم حفظ التعديلات - لسه بانتظار الموافقة');
      return;
    }

    const inv = { id:uid(), number:nextNumber(DB.purchases,'PUR'), date, partyId, partyName:supplier.name, items, subtotal, discountType:discType, discountValue:discValue, discountAmount, taxEnabled, taxRate, taxAmount, total, paidAmount:Math.min(total,paid+advUse), paymentTerm:termId, termLabel:termById(termId).label, dueDate, currency, exchangeRate, originalTotal:totalOrig, originalSubtotal:subtotalOrig, status:'pending', createdAt:Date.now(), createdBy:currentUserName(), _cashAcc:cashAcc, _advUse:advUse };
    DB.purchases.push(inv);
    persist('purchases');
    logActivity('purchase_create', 'إنشاء فاتورة شراء '+inv.number+' من المورد '+supplier.name+' بقيمة '+money(total)+' (بانتظار الموافقة)');
    if(poSourceId){
      const po = DB.purchaseOrders.find(x=>x.id===poSourceId);
      if(po){ po.status = 'converted'; persist('purchaseOrders'); logActivity('po', 'تحويل أمر شراء '+po.number+' لفاتورة شراء '+inv.number); }
    }
    closeModal(); render(); toast('تم الحفظ بانتظار الموافقة - لن يتحرك المخزون أو الحسابات حتى الاعتماد');
  });
  if(editInv){
    editInv.items.forEach(()=>{ addItemRow('purchase'); });
    setTimeout(()=>{
      const rows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
      editInv.items.forEach((it,i)=>{
        const row = rows[i]; if(!row) return;
        row.querySelector('.sel-product').value = it.productId;
        row.querySelector('.inp-qty').value = it.qty;
        row.querySelector('.inp-price').value = it.price;
      });
      updateSaleTotals();
    }, 0);
  }else if(window._purchPrefillItems){
    const prefillItems = window._purchPrefillItems;
    const prefillParty = window._purchPrefillPartyId;
    const partyEl0 = document.getElementById('f_party');
    if(partyEl0 && prefillParty) partyEl0.value = prefillParty;
    prefillItems.forEach(()=>addItemRow('purchase'));
    setTimeout(()=>{
      const rows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
      prefillItems.forEach((it,i)=>{
        const row = rows[i]; if(!row) return;
        row.querySelector('.sel-product').value = it.productId;
        row.querySelector('.inp-qty').value = it.qty;
        row.querySelector('.inp-price').value = it.price;
      });
      const partyEl = document.getElementById('f_party');
      if(partyEl && prefillParty) partyEl.value = prefillParty;
      const currEl = document.getElementById('f_currency');
      const exRateEl = document.getElementById('f_exrate');
      if(currEl && window._purchPrefillCurrency){
        currEl.value = window._purchPrefillCurrency;
        if(exRateEl){
          exRateEl.value = window._purchPrefillExchangeRate||1;
          exRateEl.disabled = window._purchPrefillCurrency===DB.settings.currency;
        }
      }
      window._purchPrefillCurrency = null; window._purchPrefillExchangeRate = null;
      updateSaleTotals();
    }, 0);
    window._purchPrefillItems = null; window._purchPrefillPartyId = null;
  }else{
    addItemRow('purchase');
  }
  onTermChange();
  updateSaleTotals();
}
function onPurchaseCurrencyChange(){
  const currEl = document.getElementById('f_currency');
  const exRateEl = document.getElementById('f_exrate');
  if(!currEl || !exRateEl) return;
  const isBase = currEl.value === DB.settings.currency;
  exRateEl.disabled = isBase;
  if(isBase){
    exRateEl.value = 1;
  }else{
    const c = (DB.settings.currencies||[]).find(x=>x.code===currEl.value);
    exRateEl.value = (c && c.rate) ? c.rate : 1;
  }
  updateSaleTotals();
}
function onPurchasePartyChange(){
  const partyId = document.getElementById('f_party').value;
  const box = document.getElementById('advanceBox');
  if(!partyId){ box.style.display='none'; box.innerHTML=''; return; }
  const bal = partyAdvanceBalance('suppliers', partyId);
  if(bal>0.009){
    box.style.display='block';
    box.innerHTML = `<div class="field"><label>رصيد دفعة مقدمة متاح لهذا المورد: ${money(bal)} — كام تستخدم منه في الفاتورة دي؟</label><input id="f_advUse" type="number" step="0.01" min="0" max="${bal}" value="0" oninput="updateSaleTotals()"></div>`;
  }else{ box.style.display='none'; box.innerHTML=''; }
}
function scanBarcodeAdd(inputEl, mode){
  const code = inputEl.value.trim();
  inputEl.value = '';
  if(!code) return;
  const prod = findProductByBarcode(code);
  if(!prod){ toast('لا يوجد منتج بهذا الباركود: '+code); inputEl.focus(); return; }
  const rows = Array.from(document.querySelectorAll('#itemRows .item-row:not(.head-row)'));
  const existing = rows.find(row=>row.querySelector('.sel-product').value===prod.id);
  if(existing){
    const qtyEl = existing.querySelector('.inp-qty');
    qtyEl.value = (parseFloat(qtyEl.value)||0) + 1;
  }else{
    addItemRow(mode);
    const newRows = document.querySelectorAll('#itemRows .item-row:not(.head-row)');
    const row = newRows[newRows.length-1];
    row.querySelector('.sel-product').value = prod.id;
    row.querySelector('.inp-price').value = mode==='purchase' ? prod.purchasePrice : prod.salePrice;
    row.querySelector('.inp-qty').value = 1;
  }
  updateSaleTotals();
  toast('تمت إضافة: '+prod.name);
  inputEl.focus();
}
function addItemRow(kind){

  div.className = 'item-row';
  div.id = rowId;
  div.innerHTML = `
    <select class="sel-product" onchange="onProductRowChange('${rowId}')"><option value="">اختر منتج...</option>${window._saleProductOpts}</select>
    <input class="inp-qty" type="number" min="0" step="1" value="1" oninput="updateSaleTotals()">
    <input class="inp-price" type="number" min="0" step="0.01" value="0" oninput="updateSaleTotals()">
    <div class="inp-total tnum" style="font-size:13px;">0</div>

function onProductRowChange(rowId){
  const row = document.getElementById(rowId);
  const sel = row.querySelector('.sel-product');
  const opt = sel.selectedOptions[0];
  if(opt && opt.dataset.price){ row.querySelector('.inp-price').value = opt.dataset.price; }
  updateSaleTotals();
}
function updateSaleTotals(){
  let subtotal = 0;
  document.querySelectorAll('#itemRows .item-row:not(.head-row)').forEach(row=>{
    const qty = parseFloat(row.querySelector('.inp-qty').value)||0;
    const price = parseFloat(row.querySelector('.inp-price').value)||0;
    const t = qty*price;
    row.querySelector('.inp-total').textContent = fmt(t);
    subtotal += t;
  });
  const discTypeEl = document.getElementById('f_disc_type');
  const discValEl = document.getElementById('f_disc_value');
  const discType = discTypeEl ? discTypeEl.value : 'amount';
  const discVal = discValEl ? (parseFloat(discValEl.value)||0) : 0;
  const discountAmount = Math.min(subtotal, discType==='percent' ? subtotal*discVal/100 : discVal);
  const taxable = subtotal - discountAmount;
  const taxEnEl = document.getElementById('f_tax_enabled');
  const taxRateEl = document.getElementById('f_tax_rate');
  const taxEnabled = taxEnEl ? taxEnEl.checked : false;
  const taxRate = taxRateEl ? (parseFloat(taxRateEl.value)||0) : 0;
  const taxAmount = taxEnabled ? taxable*taxRate/100 : 0;
  const total = taxable + taxAmount;

  const currEl = document.getElementById('f_currency');
  const displayCur = currEl ? currEl.value : DB.settings.currency;
  const fmtCur = (n)=> fmt(n)+' '+displayCur;
  const set = (id,val)=>{ const el = document.getElementById(id); if(el) el.textContent = val; };
  set('subTotalDisp', fmtCur(subtotal));
  set('discDisp', fmtCur(discountAmount));
  set('taxableDisp', fmtCur(taxable));
  set('taxDisp', fmtCur(taxAmount));
  set('saleTotalDisp', fmtCur(total));
  const exRateEl = document.getElementById('f_exrate');
  const baseEquivEl = document.getElementById('baseCurrencyEquiv');
  if(currEl && exRateEl && baseEquivEl){
    const isForeign = currEl.value !== DB.settings.currency;
    if(isForeign){
      const rate = parseFloat(exRateEl.value)||1;
      baseEquivEl.style.display = 'block';
      baseEquivEl.textContent = 'يعادل تقريباً: '+money(total*rate)+' '+DB.settings.currency+' (بسعر صرف '+rate+')';
    }else{
      baseEquivEl.style.display = 'none';
    }
  }
  const paidEl = document.getElementById('f_paid');
  const paid = paidEl ? (parseFloat(paidEl.value)||0) : 0;
  const advUseEl = document.getElementById('f_advUse');
  const advUse = advUseEl ? (parseFloat(advUseEl.value)||0) : 0;
  set('saleDueDisp', fmtCur(Math.max(0,total-paid-advUse)));
}

function deleteInvoice(kind, id){
  if(!requirePerm('delete_invoices','حذف الفواتير')) return;
  const list0 = DB[kind];
  const inv0 = list0.find(i=>i.id===id);
  const isPending0 = inv0 && (inv0.status||'approved')==='pending';
  if(inv0 && !isPending0 && !checkPeriodLock(inv0.date)) return;
  if(inv0 && inv0.fromConsignment){
    toast('دي فاتورة ناتجة من تقرير مبيعات أمانة - لا يمكن حذفها مباشرة. استخدم "مرتجع بضاعة أمانة" من صفحة البيع بالأمانة لو محتاج تصحيح.');
    return;
  }
  const notYetReceived0 = kind==='purchases' && inv0 && !isPending0 && !inv0.received;
  const msg = isPending0 ? 'لسه الفاتورة دي مش معتمدة ولا أثّرت على المخزون أو الحسابات - هل تريد حذفها؟'
    : notYetReceived0 ? 'الفاتورة دي معتمدة لكن البضاعة لسه مستلمتش بالمخزن - هيتم عكس الالتزام المالي بس من غير أي تأثير على المخزون (لأنه أصلاً معملش). هل تريد المتابعة؟'
    : 'سيتم عكس تأثير هذه الفاتورة على المخزون والقيود المحاسبية. هل تريد المتابعة؟';
  confirmAction('حذف الفاتورة', msg, ()=>{
    const list = DB[kind];
    const inv = list.find(i=>i.id===id);
    if(inv){
      const isPending = (inv.status||'approved')==='pending';
      const notYetReceived = kind==='purchases' && !isPending && !inv.received;
      if(!isPending){
        removeJournalBySource(inv.id);
        if(!notYetReceived){
          inv.items.forEach(it=>{
            const p = productById(it.productId);
            if(p){ adjustStock(p, kind==='sales'? it.qty : -it.qty); }
          });
          inv.items.forEach(it=>{ logStockMove(it.productId, (kind==='sales'?it.qty:-it.qty), (kind==='sales'?'sale_delete':'purchase_delete'), inv.number, 'حذف فاتورة'); });
        }
      }
      DB[kind] = list.filter(i=>i.id!==id);
      persist(kind); persist('products');
      logActivity(kind==='sales'?'sale_delete':'purchase_delete', 'حذف '+(kind==='sales'?'فاتورة بيع ':'فاتورة شراء ')+inv.number+' - '+inv.partyName+' بقيمة '+money(inv.total));
    }
    closeModal(); render(); toast('تم حذف الفاتورة');
  });
}
function approveSaleInvoice(id){
  if(!requirePerm('approve_invoices','اعتماد فواتير البيع')) return;
  const inv = DB.sales.find(i=>i.id===id);
  if(!inv || (inv.status||'approved')!=='pending') return;
  if(!checkPeriodLock(inv.date)) return;
  const orphan = inv.items.find(it=>!productById(it.productId));
  if(orphan){ toast('لا يمكن الاعتماد: الصنف "'+orphan.name+'" مرتبط بمنتج محذوف أو غير موجود حالياً'); return; }
  for(const it of inv.items){
    const p = productById(it.productId);
    if(it.qty>p.quantity+0.001){ toast('لا يمكن الاعتماد: الكمية المطلوبة من "'+it.name+'" أكبر من المتاح بالمخزون حالياً ('+fmt(p.quantity)+')'); return; }
  }
  confirmAction('اعتماد فاتورة البيع', 'سيتم تحريك المخزون وترحيل القيد المحاسبي فوراً. هل أنت متأكد؟', ()=>{
    inv.status = 'approved'; inv.approvedBy = currentUserName(); inv.approvedAt = Date.now();
    const party = customerById(inv.partyId);
    inv.items.forEach(it=>{ const p = productById(it.productId); adjustStock(p, -it.qty); });
    const cost = inv.items.reduce((s,i)=>s+i.qty*(i.cost||0),0);
    const lines = [
      {accountId:'acc_ar', debit:inv.total, credit:0, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
      {accountId:'acc_sales', debit:0, credit:inv.subtotal-inv.discountAmount},
    ];
    if(inv.taxAmount>0) lines.push({accountId:'acc_vat_out', debit:0, credit:inv.taxAmount});
    if(cost>0){ lines.push({accountId:'acc_cogs', debit:cost, credit:0}); lines.push({accountId:'acc_inventory', debit:0, credit:cost}); }
    postJournal(inv.date, 'فاتورة بيع '+inv.number+' - '+inv.partyName, lines, 'sale_invoice', inv.id, 'invoice_main');
    const cashAcc = inv._cashAcc || 'acc_cash';
    const advUse = inv._advUse || 0;
    const paid = Math.max(0, inv.paidAmount - advUse);
    if(paid>0){
      postJournal(inv.date, 'تحصيل عند فاتورة '+inv.number, [
        {accountId:cashAcc, debit:paid, credit:0},
        {accountId:'acc_ar', debit:0, credit:paid, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
      ], 'sale_invoice', inv.id, 'payment');
    }
    if(advUse>0){
      postJournal(inv.date, 'استخدام دفعة مقدمة في فاتورة '+inv.number, [
        {accountId:'acc_cust_adv', debit:advUse, credit:0, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
        {accountId:'acc_ar', debit:0, credit:advUse, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
      ], 'sale_invoice', inv.id, 'advance_use');
    }
    delete inv._cashAcc; delete inv._advUse;
    persist('sales'); persist('products');
    logActivity('sale_approve', 'اعتماد فاتورة بيع '+inv.number+' بقيمة '+money(inv.total));
    inv.items.forEach(it=>{ logStockMove(it.productId, -it.qty, 'sale', inv.number, 'فاتورة بيع'); });
    closeModal(); render(); toast('تم الاعتماد والترحيل بنجاح');
  });
}

    const actualQtys = inv.items.map((it,idx)=>{
      const v = parseFloat(document.getElementById('recv_qty_'+idx).value);
      return isNaN(v)||v<0 ? null : v;
    });
    if(actualQtys.some(v=>v===null)){ toast('أدخل كمية صحيحة لكل صنف'); return false; }
    const notes = document.getElementById('f_recv_notes').value.trim();
    submitGoodsReceipt(inv.id, actualQtys, notes);
  });
  setTimeout(()=>{ inv.items.forEach((it,idx)=>updateReceivingRowFlag(idx)); }, 0);
}
function updateReceivingRowFlag(idx){
  const qtyInput = document.getElementById('recv_qty_'+idx);
  const flagEl = document.getElementById('recv_flag_'+idx);
  if(!qtyInput || !flagEl) return;
  const row = document.querySelectorAll('#modalBody table tbody tr')[idx];
  const expected = parseFloat(row.children[1].textContent.replace(/,/g,''))||0;
  const actual = parseFloat(qtyInput.value)||0;
  const diff = actual - expected;
  if(Math.abs(diff)<0.009){ flagEl.innerHTML = '<span class="badge ok">مطابق</span>'; }
  else if(diff<0){ flagEl.innerHTML = '<span class="badge low">أقل بـ'+fmt(Math.abs(diff))+'</span>'; }
  else{ flagEl.innerHTML = '<span class="badge partial">أكتر بـ'+fmt(diff)+'</span>'; }
}
function submitGoodsReceipt(id, actualQtys, notes){
  if(!requirePerm('approve_invoices','تأكيد استلام البضاعة')) return;
  const inv = DB.purchases.find(i=>i.id===id);
  if(!inv || (inv.status||'approved')!=='approved' || inv.received) return;
  if(!checkPeriodLock(inv.date)) return;
  const orphan = inv.items.find(it=>!productById(it.productId));
  if(orphan){ toast('لا يمكن تأكيد الاستلام: الصنف "'+orphan.name+'" مرتبط بمنتج محذوف أو غير موجود حالياً'); return; }
  confirmAction('تأكيد استلام البضاعة', 'سيتم إضافة الأعداد الفعلية اللي راجعتها لمخزونك ومعالجة أي فروقات محاسبياً. هل أنت متأكد؟', ()=>{
    inv.received = true; inv.receivedBy = currentUserName(); inv.receivedAt = Date.now();
    if(notes) inv.receivingNotes = notes;
    let totalTransitReverse = 0, totalToInventory = 0, totalDiscrepancy = 0;
    const varianceLines = [];
    inv.items.forEach((it,idx)=>{
      const actualQty = actualQtys[idx];
      const p = productById(it.productId);
      const unitPrice = it.price*(inv.exchangeRate||1);
      applyWeightedAverageCost(p, actualQty, unitPrice);
      adjustStock(p, actualQty);
      logStockMove(it.productId, actualQty, 'purchase', inv.number, 'استلام فاتورة شراء بالمخزن'+(actualQty!==it.qty?' (مطلوب '+it.qty+')':''));
      it.actualReceivedQty = actualQty;
      const expectedValue = it.qty * unitPrice;
      const actualValue = actualQty * unitPrice;
      totalTransitReverse += expectedValue;
      totalToInventory += actualValue;
      if(Math.abs(actualQty-it.qty)>0.009){
        totalDiscrepancy += (actualValue-expectedValue);
        varianceLines.push(it.name+': مطلوب '+fmt(it.qty)+' - مستلم '+fmt(actualQty));
      }
    });
    persist('purchases'); persist('products');
    const lines = [{accountId:'acc_inventory', debit:totalToInventory, credit:0}];
    if(totalDiscrepancy<0){ lines.push({accountId:'acc_recv_discrepancy', debit:-totalDiscrepancy, credit:0}); }
    lines.push({accountId:'acc_goods_transit', debit:0, credit:totalTransitReverse});
    if(totalDiscrepancy>0){ lines.push({accountId:'acc_recv_discrepancy', debit:0, credit:totalDiscrepancy}); }
    postJournal(inv.date, 'استلام بضاعة فاتورة شراء '+inv.number+' بالمخزن'+(varianceLines.length>0?' (فروقات: '+varianceLines.join('، ')+')':''), lines, 'purchase_receive', inv.id);
    logActivity('purchase_approve', 'تأكيد استلام بضاعة فاتورة شراء '+inv.number+' بالمخزن'+(varianceLines.length>0?' - فيه فروقات في '+varianceLines.length+' صنف':''));
    closeModal(); render(); toast('تم تأكيد الاستلام - المخزون اتحدث'+(varianceLines.length>0?' وتم تسجيل الفروقات':''));
  });
}
function rejectPurchaseInvoice(id){

function openPaymentModal(kind, id){
  const inv = DB[kind].find(i=>i.id===id);
  if(!inv) return;
  if((inv.status||'approved')!=='approved'){ toast('الفاتورة دي لسه مش معتمدة - لازم تعتمدها الأول قبل تسجيل أي دفعة عليها'); return; }
  const due = inv.total - inv.paidAmount;
  const body = `
    <div class="field"><label>الفاتورة</label><input value="${inv.number} - ${esc(inv.partyName)}" disabled></div>
    <div class="row2">

    </div>

  `;
  openModal('تسجيل دفعة', body, ()=>{

    const isSale = kind==='sales';
    if(isSale){
      postJournal(todayISO(), 'تحصيل دفعة فاتورة '+inv.number, [
        {accountId:cashAcc, debit:paidNow, credit:0},
        {accountId:'acc_ar', debit:0, credit:paidNow, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
      ], 'sale_invoice', inv.id);
    }else{

    closeModal(); render(); toast('تم تسجيل الدفعة');
  });
}

/* ============ RETURNS (مرتجعات) ============ */
function returnedQtyForItem(invoiceId, productId){
  return DB.returns.filter(r=>r.originalInvoiceId===invoiceId).reduce((s,r)=>{
    const it = r.items.find(x=>x.productId===productId);
    return s + (it?it.qty:0);
  },0);
}
function openReturnModal(kind, invoiceId){
  const inv = DB[kind].find(i=>i.id===invoiceId);
  if(!inv) return;
  if((inv.status||'approved')!=='approved'){ toast('الفاتورة دي لسه مش معتمدة - لازم تعتمدها الأول قبل عمل مرتجع عليها'); return; }
  if(kind==='purchases' && !inv.received){ toast('البضاعة دي لسه مستلمتش بالمخزن - لازم تأكد الاستلام الأول قبل عمل مرتجع عليها'); return; }
  const isSale = kind==='sales';
  const rows = inv.items.map(it=>{
    const already = returnedQtyForItem(invoiceId, it.productId);
    const maxRet = Math.max(0, it.qty - already);
    return {...it, already, maxRet};
  });
  if(rows.every(r=>r.maxRet<=0)){ toast('تم استرجاع كل الأصناف في هذه الفاتورة بالفعل'); return; }
  const body = `
    <p style="font-size:12.5px;color:var(--text-muted);margin-top:0;">فاتورة ${inv.number} - ${esc(inv.partyName)}</p>
    <div class="item-rows" id="retRows">
      <div class="item-row head-row" style="grid-template-columns:2fr 1fr 1fr 1fr;"><div>المنتج</div><div>الكمية الأصلية</div><div>المتاح للإرجاع</div><div>كمية الإرجاع</div></div>
      ${rows.map((r,i)=>`
        <div class="item-row" style="grid-template-columns:2fr 1fr 1fr 1fr;">
          <div>${esc(r.name)}</div>
          <div class="tnum">${fmt(r.qty)}</div>
          <div class="tnum">${fmt(r.maxRet)}</div>
          <div><input type="number" min="0" max="${r.maxRet}" step="1" value="0" class="ret-qty" data-idx="${i}" ${r.maxRet<=0?'disabled':''} oninput="updateReturnTotal()"></div>
        </div>`).join('')}
    </div>
    <div class="tot-line grand" style="margin-top:12px;"><span>إجمالي المرتجع</span><span class="tnum" id="retTotalDisp">${money(0)}</span></div>
  `;
  window._retRows = rows;
  openModal(isSale?'مرتجع مبيعات':'مرتجع مشتريات', body, ()=>{
    const items = [];
    document.querySelectorAll('.ret-qty').forEach(inp=>{
      const idx = parseInt(inp.dataset.idx);
      const qty = parseFloat(inp.value)||0;
      const r = window._retRows[idx];
      if(qty>0){
        if(qty>r.maxRet){ toast('كمية الإرجاع أكبر من المتاح لـ '+r.name); return; }
        items.push({productId:r.productId, name:r.name, qty, price:r.price, cost:r.cost, total:qty*r.price});
      }
    });
    if(items.length===0){ toast('أدخل كمية إرجاع لصنف واحد على الأقل'); return false; }
    if(!isSale){
      for(const it of items){
        const p = productById(it.productId);
        if(p && it.qty>p.quantity){ toast('لا يمكن إرجاع كمية أكبر من المتاح بالمخزون لـ '+it.name); return false; }
      }
    }
    const subtotal = items.reduce((s,i)=>s+i.total,0);
    const taxAmount = inv.taxEnabled ? subtotal*(inv.taxRate||0)/100 : 0;
    const total = subtotal+taxAmount;
    const ret = { id:uid(), number:nextNumber(DB.returns, isSale?'SRET':'PRET'), type:isSale?'sale_return':'purchase_return', originalInvoiceId:inv.id, originalNumber:inv.number, date:todayISO(), partyId:inv.partyId, partyName:inv.partyName, items, subtotal, taxAmount, total, createdAt:Date.now(), createdBy:currentUserName() };
    DB.returns.push(ret);
    items.forEach(it=>{ const p = productById(it.productId); if(p) adjustStock(p, isSale? it.qty : -it.qty); });
    items.forEach(it=>{ logStockMove(it.productId, (isSale?it.qty:-it.qty), (isSale?'sale_return':'purchase_return'), ret.number, 'مرتجع على فاتورة '+inv.number); });

    if(isSale){
      const cost = items.reduce((s,i)=>s+i.qty*(i.cost||0),0);
      const lines = [
        {accountId:'acc_sales', debit:subtotal, credit:0},
        {accountId:'acc_ar', debit:0, credit:total, partyType:'customer', partyId:inv.partyId, partyName:inv.partyName},
      ];
      if(taxAmount>0) lines.push({accountId:'acc_vat_out', debit:taxAmount, credit:0});
      if(cost>0){ lines.push({accountId:'acc_inventory', debit:cost, credit:0}); lines.push({accountId:'acc_cogs', debit:0, credit:cost}); }
      postJournal(ret.date, 'مرتجع مبيعات '+ret.number+' - فاتورة '+inv.number, lines, 'sale_return', ret.id, 'return');
    }else{
      const lines = [
        {accountId:'acc_ap', debit:total, credit:0, partyType:'supplier', partyId:inv.partyId, partyName:inv.partyName},
        {accountId:'acc_inventory', debit:0, credit:subtotal},
      ];
      if(taxAmount>0) lines.push({accountId:'acc_vat_in', debit:0, credit:taxAmount});
      postJournal(ret.date, 'مرتجع مشتريات '+ret.number+' - فاتورة '+inv.number, lines, 'purchase_return', ret.id, 'return');
    }
    persist('returns'); persist('products');
    logActivity(isSale?'sale_return':'purchase_return', (isSale?'مرتجع مبيعات ':'مرتجع مشتريات ')+ret.number+' على فاتورة '+inv.number+' بقيمة '+money(total));
    closeModal(); render(); toast('تم تسجيل المرتجع بنجاح');
  });
}
function updateReturnTotal(){
  let subtotal = 0;
  document.querySelectorAll('.ret-qty').forEach(inp=>{
    const idx = parseInt(inp.dataset.idx);
    const qty = parseFloat(inp.value)||0;
    const r = window._retRows[idx];
    subtotal += qty*r.price;
  });
  const el = document.getElementById('retTotalDisp');
  if(el) el.textContent = money(subtotal);
}

/* ============ CONSIGNMENT (البيع بالأمانة) ============ */
function consignStockMap(customerId, branchId){
  branchId = branchId || null;
  const map = {};
  DB.consignShipments.filter(s=>s.customerId===customerId && (s.branchId||null)===branchId && (s.status||'approved')==='approved').forEach(s=>{
    const sign = s.type==='return' ? -1 : 1;
    s.items.forEach(it=>{ map[it.productId] = (map[it.productId]||0) + sign*it.qty; });
  });
  DB.consignReports.filter(r=>r.customerId===customerId && (r.branchId||null)===branchId).forEach(r=>{
    r.items.forEach(it=>{ map[it.productId] = (map[it.productId]||0) - it.qtySold; });
  });
  return map;
}
function consignStockFor(customerId, productId, branchId){ return consignStockMap(customerId, branchId)[productId] || 0; }
function consignCustomerBalances(){
  const result = [];
  DB.customers.forEach(c=>{
    const buckets = [{id:null, name:null}, ...(c.branches||[]).map(b=>({id:b.id, name:b.name}))];
    buckets.forEach(bucket=>{
      const map = consignStockMap(c.id, bucket.id);
      let qty=0, value=0;
      Object.keys(map).forEach(pid=>{
        const q = map[pid];
        if(q>0.001){ const p = productById(pid); qty+=q; value += q*(p?p.purchasePrice:0); }
      });
      if(qty>0.001) result.push({customer:c, branchId:bucket.id, branchName:bucket.name, qty, value, map});
    });
  });
  return result.sort((a,b)=>b.value-a.value);
}

function deleteConsignReport(id){
  if(!requirePerm('delete_invoices','حذف تقارير مبيعات الأمانة')) return;
  const rep = DB.consignReports.find(x=>x.id===id);
  if(!rep) return;
  if(!checkPeriodLock(rep.date)) return;
  confirmAction('حذف تقرير المبيعات', 'سيتم حذف فاتورة البيع المرتبطة بهذا التقرير وعكس القيد المحاسبي بالكامل (الكمية المباعة هترجع تاني كرصيد أمانة لدى المتجر). هل أنت متأكد؟', ()=>{
    removeJournalBySource(rep.id);
    const mirrorInv = DB.sales.find(s=>s.consignReportId===rep.id);
    if(mirrorInv){ DB.sales = DB.sales.filter(s=>s.id!==mirrorInv.id); persist('sales'); }
    DB.consignReports = DB.consignReports.filter(x=>x.id!==id);
    persist('consignReports');
    logActivity('consignment', 'حذف تقرير مبيعات أمانة '+rep.number+' - '+rep.customerName);
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}

function approveConsignShipment(id){
  if(!requirePerm('approve_consignment','اعتماد أذونات بضاعة الأمانة')) return;
  const ship = DB.consignShipments.find(x=>x.id===id);
  if(!ship || ship.status!=='pending') return;
  if(!checkPeriodLock(ship.date)) return;
  const isReturn = ship.type==='return';
  const orphan = ship.items.find(it=>!productById(it.productId));
  if(orphan){ toast('لا يمكن الاعتماد: الصنف "'+orphan.name+'" مرتبط بمنتج محذوف أو غير موجود حالياً في النظام - راجع الصنف ده قبل الاعتماد'); return; }
  const stockMap = isReturn ? consignStockMap(ship.customerId, ship.branchId||null) : {};
  for(const it of ship.items){
    const p = productById(it.productId);
    if(isReturn){
      const held = stockMap[it.productId]||0;
      if(it.qty>held+0.001){ toast('لا يمكن الاعتماد: الكمية المرتجعة من "'+it.name+'" أكبر من رصيد الأمانة الحالي ('+fmt(held)+')'); return; }
    }else{
      if(it.qty>p.quantity+0.001){ toast('لا يمكن الاعتماد: الكمية المطلوبة من "'+it.name+'" أكبر من المتاح بالمخزن حالياً ('+fmt(p.quantity)+')'); return; }
    }
  }
  confirmAction('اعتماد '+(isReturn?'المرتجع':'إذن الصرف'), 'سيتم تحريك المخزون وترحيل القيد المحاسبي فوراً. هل أنت متأكد؟', ()=>{
    ship.status = 'approved'; ship.approvedBy = currentUserName(); ship.approvedAt = Date.now();
    persist('consignShipments');
    ship.items.forEach(it=>{
      const p = productById(it.productId);
      adjustStock(p, isReturn ? it.qty : -it.qty);
      logStockMove(it.productId, isReturn?it.qty:-it.qty, isReturn?'consign_return':'consign_out', ship.number, isReturn?'مرتجع بضاعة أمانة':'صرف بضاعة أمانة');
    });
    persist('products');
    const value = ship.items.reduce((s,it)=>s+it.qty*(it.cost||0),0);
    if(value>0){
      if(isReturn){
        postJournal(ship.date, 'مرتجع بضاعة أمانة '+ship.number+' من '+ship.customerName, [
          {accountId:'acc_inventory', debit:value, credit:0},
          {accountId:'acc_consign_inv', debit:0, credit:value},
        ], 'consign_shipment', ship.id);
      }else{
        postJournal(ship.date, 'صرف بضاعة أمانة '+ship.number+' إلى '+ship.customerName, [
          {accountId:'acc_consign_inv', debit:value, credit:0},
          {accountId:'acc_inventory', debit:0, credit:value},
        ], 'consign_shipment', ship.id);
      }
    }
    logActivity('consignment', 'اعتماد '+(isReturn?'مرتجع بضاعة أمانة ':'إذن صرف بضاعة أمانة ')+ship.number+' - '+ship.customerName);
    closeModal(); render(); toast('تم الاعتماد والترحيل بنجاح');
  });
}

function fixDuplicateApproval(id){
  if(!requirePerm('manage_accounts','إصلاح اعتماد مكرر')) return;
  const ship = DB.consignShipments.find(x=>x.id===id);
  if(!ship){ toast('الإذن غير موجود'); return; }
  const dupJournals = DB.journal.filter(j=>j.sourceId===ship.id && j.sourceType==='consign_shipment');
  if(dupJournals.length<2){ toast('مفيش تكرار مكتشف لهذا الإذن - القيود المرتبطة بيه عدد '+dupJournals.length+' بس'); return; }
  const isReturn = ship.type==='return';
  const extraCount = dupJournals.length - 1;
  const itemsList = ship.items.map(it=>'• '+it.name+': '+fmt(it.qty*extraCount)+' وحدة').join('\n');
  confirmAction('إصلاح اعتماد مكرر - '+ship.number,
    'لقينا '+dupJournals.length+' قيود مكررة لنفس الإذن (المفروض قيد واحد بس). هيتم:\n- حذف '+extraCount+' من القيود الزيادة (والإبقاء على واحد)\n- تصحيح كمية المخزون للمنتجات دي:\n'+itemsList+'\nهل أنت متأكد؟',
    ()=>{
      for(let i=0;i<extraCount;i++){
        const j = dupJournals[i];
        DB.journal = DB.journal.filter(x=>x.id!==j.id);
      }
      persist('journal');
      ship.items.forEach(it=>{
        const p = productById(it.productId);
        if(!p) return;
        const correction = it.qty * extraCount;
        adjustStock(p, isReturn ? -correction : correction);
        logStockMove(it.productId, isReturn?-correction:correction, 'duplicate_fix', ship.number, 'تصحيح اعتماد مكرر لإذن بضاعة أمانة');
      });
      persist('products');
      logActivity('consignment', 'إصلاح اعتماد مكرر لإذن '+ship.number+' - حذف '+extraCount+' قيد زيادة وتصحيح المخزون');
      closeModal(); render(); toast('تم الإصلاح بنجاح - راجع الأرقام للتأكد');
    });
}
function deleteConsignShipment(id){
  if(!requirePerm('delete_invoices','حذف أذونات بضاعة الأمانة')) return;
  const ship = DB.consignShipments.find(x=>x.id===id);
  if(!ship) return;
  const isApproved = (ship.status||'approved')==='approved';
  if(isApproved && !checkPeriodLock(ship.date)) return;
  if(isApproved && ship.type==='out'){
    const shipBranch = ship.branchId||null;
    const mapWithout = {};
    DB.consignShipments.filter(s=>s.customerId===ship.customerId && (s.branchId||null)===shipBranch && s.id!==ship.id && (s.status||'approved')==='approved').forEach(s=>{
      const sign = s.type==='return' ? -1 : 1;
      s.items.forEach(it=>{ mapWithout[it.productId] = (mapWithout[it.productId]||0) + sign*it.qty; });
    });
    DB.consignReports.filter(r=>r.customerId===ship.customerId && (r.branchId||null)===shipBranch).forEach(r=>{
      r.items.forEach(it=>{ mapWithout[it.productId] = (mapWithout[it.productId]||0) - it.qtySold; });
    });
    for(const key in mapWithout){
      if(mapWithout[key]<-0.001){ toast('لا يمكن الحذف: تم بيع أو إرجاع جزء من هذه الشحنة بالفعل عبر تقارير مبيعات أو مرتجعات لاحقة'); return; }
    }
  }
  const msg = isApproved
    ? 'الإذن ده معتمد ومترحّل بالفعل — سيتم عكس أثره على المخزون وحذف القيد المحاسبي بالكامل. هل أنت متأكد؟'
    : 'هل تريد حذف هذا الإذن نهائياً؟';
  confirmAction('حذف '+(ship.type==='return'?'المرتجع':'إذن الصرف'), msg, ()=>{
    if(isApproved){
      const isReturn = ship.type==='return';
      ship.items.forEach(it=>{
        const p = productById(it.productId);
        if(p) adjustStock(p, isReturn ? -it.qty : it.qty);
        logStockMove(it.productId, isReturn?-it.qty:it.qty, 'consign_delete', ship.number, 'حذف '+(isReturn?'مرتجع':'إذن صرف')+' بضاعة أمانة');
      });
      persist('products');
      removeJournalBySource(ship.id);
    }
    DB.consignShipments = DB.consignShipments.filter(x=>x.id!==id);
    persist('consignShipments');
    logActivity('consignment', 'حذف '+(ship.type==='return'?'مرتجع':'إذن صرف')+' بضاعة أمانة '+ship.number+' - '+ship.customerName);
    closeModal(); render(); toast('تم الحذف بنجاح');
  });
}

function approveTesterHandout(id){
  if(!requirePerm('approve_consignment','اعتماد توزيع العينات/التسترز')) return;
  const th = DB.testerHandouts.find(x=>x.id===id);
  if(!th || th.status!=='pending') return;
  if(!checkPeriodLock(th.date)) return;
  const orphan = th.items.find(it=>!productById(it.productId));
  if(orphan){ toast('لا يمكن الاعتماد: الصنف "'+orphan.name+'" مرتبط بمنتج محذوف أو غير موجود حالياً في النظام - راجع الصنف ده قبل الاعتماد'); return; }
  for(const it of th.items){
    const p = productById(it.productId);
    if(p && it.qty>p.quantity+0.001){ toast('لا يمكن الاعتماد: الكمية المطلوبة من "'+it.name+'" أكبر من المتاح بالمخزون حالياً ('+fmt(p.quantity)+')'); return; }
  }
  confirmAction('اعتماد التوزيع', 'سيتم تحريك المخزون وترحيل قيد المصروف فوراً. هل أنت متأكد؟', ()=>{
    th.status = 'approved'; th.approvedBy = currentUserName(); th.approvedAt = Date.now();
    persist('testerHandouts');
    th.items.forEach(it=>{
      const p = productById(it.productId);
      adjustStock(p, -it.qty);
      logStockMove(it.productId, -it.qty, 'samples', th.number, 'عينات / تسترز مجانية'+(th.customerName?' - '+th.customerName:''));
    });
    persist('products');
    const value = th.items.reduce((s,it)=>s+it.qty*(it.cost||0),0);
    if(value>0){
      postJournal(th.date, 'عينات وتسترز مجانية '+th.number+(th.customerName?' - '+th.customerName:''), [
        {accountId:'acc_samples', debit:value, credit:0},
        {accountId:'acc_inventory', debit:0, credit:value},
      ], 'tester_handout', th.id);
    }
    logActivity('samples', 'اعتماد توزيع عينات/تسترز '+th.number+' بقيمة '+money(value));
    closeModal(); render(); toast('تم الاعتماد والترحيل بنجاح');
  });
}
