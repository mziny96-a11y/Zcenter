<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سنتر الدروس | نظام الإدارة</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='30%25' cy='30%25'%3E%3Cstop offset='0%25' stop-color='%23E9C77E'/%3E%3Cstop offset='70%25' stop-color='%23D4A657'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='32' fill='url(%23g)'/%3E%3Ctext x='32' y='43' font-family='Georgia,serif' font-weight='700' font-size='28' fill='%233A2410' text-anchor='middle'%3E%D8%B3%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=El+Messiri:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F5F8;
  --bg-soft:#EAEBF0;
  --surface:#FFFFFF;
  --surface-2:#F6F7FA;
  --sidebar:#15161F;
  --sidebar-hover:#212230;
  --sidebar-text:#B8B9C7;
  --gold:#D4A657;
  --gold-light:#E9C77E;
  --primary:#C0245C;
  --primary-dark:#98183F;
  --primary-light:#FBE3ED;
  --text:#1A1B23;
  --text-muted:#767986;
  --border:#E4E5EB;
  --success:#12946B;
  --success-bg:#DDF5EC;
  --danger:#DC3545;
  --danger-bg:#FCE4E6;
  --warning:#D68A1F;
  --warning-bg:#FCEFD9;
  --radius:16px;
  --shadow: 0 2px 10px rgba(20,20,35,.05), 0 1px 2px rgba(20,20,35,.05);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
body{ background:var(--bg); color:var(--text); font-family:'Tajawal',sans-serif; min-height:100vh; }
h1,h2,h3,.brand,.display{font-family:'El Messiri',serif;}
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
::-webkit-scrollbar-track{background:transparent;}

#app{display:flex;flex-direction:column;min-height:100vh;max-width:100vw;overflow-x:hidden;}

/* TOP NAV */
.topnav{
  display:flex;align-items:center;gap:22px;
  background:var(--sidebar);color:var(--sidebar-text);
  padding:0 24px;height:64px;flex:none;
  position:sticky;top:0;z-index:30;
}
.topnav-brand{display:flex;align-items:center;gap:10px;flex:none;}
.brand-mark{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%, var(--gold-light), var(--gold) 70%);
  display:flex;align-items:center;justify-content:center;
  font-family:'El Messiri',serif;font-weight:700;font-size:17px;color:#3A2410;flex:none;
}
.brand-titles{overflow:hidden;}
.brand-name{font-size:14.5px;font-weight:700;color:#F3E9DC;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2;}
.brand-sub{font-size:10.5px;color:var(--sidebar-text);opacity:.7;margin-top:1px;}

.topnav-menu{display:flex;align-items:center;gap:2px;flex:1;overflow-x:auto;overflow-y:visible;scrollbar-width:none;}
.topnav-menu::-webkit-scrollbar{display:none;}
.topnav-item{position:relative;flex:none;}
.topnav-btn{
  display:flex;align-items:center;gap:7px;padding:10px 13px;border-radius:9px;
  cursor:pointer;font-size:13px;font-weight:500;color:var(--sidebar-text);white-space:nowrap;user-select:none;
  transition:background .15s,color .15s;
}
.topnav-btn:hover{background:var(--sidebar-hover);color:#fff;}
.topnav-btn.active{background:linear-gradient(90deg, rgba(212,166,87,.22), rgba(212,166,87,.08));color:var(--gold-light);}
.topnav-btn .chev{font-size:10px;opacity:.7;margin-inline-start:2px;}
.topnav-dropdown{
  position:fixed;min-width:210px;
  background:var(--surface);border:1px solid var(--border);border-radius:13px;
  box-shadow:0 16px 36px rgba(15,15,25,.2);padding:6px;z-index:250;
  display:none;
}
.topnav-item.open .topnav-dropdown{display:block;}
.dropdown-item{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:9px;
  font-size:13.5px;color:var(--text);cursor:pointer;white-space:nowrap;
  transition:background .12s;
}
.dropdown-item:hover{background:var(--surface-2);}
.dropdown-item.active{background:var(--primary-light);color:var(--primary-dark);font-weight:700;}

.teacher-search-wrap{position:relative;}
.teacher-search-dropdown{
  position:absolute;top:calc(100% + 4px);right:0;left:0;z-index:60;
  background:var(--surface);border:1px solid var(--border);border-radius:11px;
  box-shadow:0 14px 32px rgba(15,15,25,.16);padding:6px;max-height:230px;overflow-y:auto;
}
.teacher-search-dropdown .dropdown-item{white-space:normal;}
.teacher-search-dropdown .dropdown-item.empty{color:var(--text-muted);cursor:default;}
.teacher-search-dropdown .dropdown-item.empty:hover{background:none;}

.topnav-actions{display:flex;align-items:center;gap:10px;flex:none;}
.topnav-actions .btn-outline{ background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.14);color:var(--sidebar-text); }
.topnav-actions .btn-outline:hover{ background:rgba(255,255,255,.12);color:#F3E9DC; }
.topnav-userbar{display:flex;align-items:center;gap:8px;padding-right:10px;margin-right:2px;border-right:1px solid rgba(255,255,255,.12);}
.logout-btn{cursor:pointer;background:rgba(220,90,90,.14);border:1px solid rgba(220,90,90,.3);color:#E8918D;padding:7px 10px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;font-family:inherit;font-size:13px;transition:background .15s,color .15s;}
.logout-btn:hover{background:rgba(220,90,90,.28);color:#FFD3D0;}
.conn-pill{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;padding:5px 12px;border-radius:99px;font-weight:600;background:rgba(18,148,107,.18);color:#5CE0AE;white-space:nowrap;}

/* PAGE */
.page-header{ background:var(--bg); border-bottom:1px solid var(--border); padding:16px 28px; position:sticky; top:64px; z-index:20; }
.page-header h1{margin:0;font-size:20px;font-weight:700;color:var(--text);}
.page-header .sub{font-size:12.5px;color:var(--text-muted);margin-top:2px;}
.content{padding:22px 28px 60px 28px;flex:1;min-width:0;}

/* CARDS / GRID */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-bottom:18px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow);transition:box-shadow .18s, transform .18s;}
.stat-card:hover{box-shadow:0 6px 18px rgba(60,40,30,.09), 0 2px 4px rgba(60,40,30,.07);transform:translateY(-1px);}
.stat-card .lbl{font-size:10.5px;color:var(--text-muted);margin-bottom:6px;font-weight:500;}
.stat-card .val{font-size:18px;font-weight:700;font-family:'El Messiri',serif;color:var(--text);letter-spacing:-.01em;}
.stat-card.rose .val{color:var(--primary);}
.stat-card.gold .val{color:#8A6220;}
.stat-card.green .val{color:var(--success);}
.stat-card.red .val{color:var(--danger);}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-bottom:20px;}
.card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--border);}
.card-head h2{font-size:16.5px;margin:0;font-weight:700;color:var(--text);letter-spacing:-.01em;}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
.row6{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;}

/* BUTTONS */
.btn{
  display:inline-flex;align-items:center;gap:6px;
  font-family:'Tajawal',sans-serif;font-size:13.5px;font-weight:600;
  padding:9px 16px;border-radius:9px;border:1px solid transparent;
  cursor:pointer;transition:background .15s, box-shadow .15s, transform .1s, border-color .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 1px 2px rgba(140,75,92,.25);}
.btn-primary:hover{background:var(--primary-dark);box-shadow:0 3px 8px rgba(140,75,92,.32);}
.btn-gold{background:var(--gold);color:#3A2410;box-shadow:0 1px 2px rgba(212,166,87,.3);}
.btn-gold:hover{background:#B98940;box-shadow:0 3px 8px rgba(212,166,87,.35);}
.btn-success{background:var(--success);color:#fff;box-shadow:0 1px 2px rgba(18,148,107,.25);}
.btn-success:hover{background:#0d7a58;}
.btn-danger{background:var(--danger);color:#fff;box-shadow:0 1px 2px rgba(220,53,69,.25);}
.btn-danger:hover{background:#b52a37;}
.btn-outline{background:var(--surface);border-color:var(--border);color:var(--text);}
.btn-outline:hover{background:var(--surface-2);border-color:#D9CBB0;}
.btn-danger-o{background:var(--surface);border-color:var(--danger);color:var(--danger);}
.btn-danger-o:hover{background:var(--danger-bg);}
.btn-sm{padding:6.5px 12px;font-size:12.5px;}
.btn-icon{padding:7px;border-radius:8px;}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;}

/* FORMS */
label{font-size:12.5px;color:var(--text-muted);display:block;margin-bottom:5px;font-weight:500;}
input,select,textarea{
  width:100%;font-family:'Tajawal',sans-serif;font-size:14px;color:var(--text);
  padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface-2);
  outline:none;transition:border-color .15s, box-shadow .15s, background .15s;
}
input[type="checkbox"],input[type="radio"]{width:16px;height:16px;padding:0;border:none;background:none;accent-color:var(--primary);cursor:pointer;}
input:focus,select:focus,textarea:focus{border-color:var(--gold);background:var(--surface);box-shadow:0 0 0 3px rgba(212,166,87,.15);}
.field{margin-bottom:13px;}
.hint{font-size:12.5px;color:var(--text-muted);}
.radio-row{display:flex;align-items:center;gap:8px;padding:8px 0;cursor:pointer;font-size:13.5px;font-weight:500;}
.radio-row input{flex:none;}

/* قايمة مصروفات مجمّعة باليوم — كل يوم صف قابل للفتح (details/summary) بيوضح ملخصه، وبيفتح تفاصيل مصروفات اليوم ده جواه */
.expense-day-group{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.expense-day-group:last-child{margin-bottom:0;}
.expense-day-summary{
  list-style:none;cursor:pointer;padding:13px 16px;background:var(--surface-2);
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;font-weight:600;
}
.expense-day-summary::-webkit-details-marker{display:none;}
.expense-day-summary::before{content:'›';display:inline-block;margin-inline-end:8px;transition:transform .15s;color:var(--text-muted);font-size:16px;}
.expense-day-group[open] > .expense-day-summary::before{transform:rotate(90deg);}
.expense-day-summary:hover{background:var(--bg-soft);}
.expense-day-date{color:var(--text);font-size:14px;}
.expense-day-meta{display:flex;align-items:center;gap:14px;font-size:13px;color:var(--text-muted);font-weight:500;}
.expense-day-total{color:var(--text);font-weight:700;}
.expense-day-body{padding:0;}

/* TABLE */
.table-wrap{overflow-x:auto;overflow-y:hidden;border:1px solid var(--border);border-radius:12px;}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);}
thead th{
  text-align:right;background:var(--surface-2);color:var(--text-muted);
  padding:11px 14px;font-weight:700;font-size:11px;white-space:nowrap;
  text-transform:uppercase;letter-spacing:.03em;border-bottom:1.5px solid var(--border);
}
tbody td{padding:12px 14px;border-bottom:1px solid var(--border);}
tbody tr:hover{background:var(--surface-2);}
tbody tr:last-child td{border-bottom:none;}
tbody tr.row-cancelled td{opacity:.55;}
tbody tr.row-cancelled td.strike{text-decoration:line-through;}
.tnum{font-variant-numeric:tabular-nums;}
.empty-row{color:var(--text-muted);text-align:center;padding:22px;font-size:13px;}
.empty{text-align:center;padding:36px 16px;color:var(--text-muted);}
.empty h3{margin:0 0 6px 0;color:var(--text);font-size:15px;}
.empty p{margin:0;font-size:13px;}

.badge{display:inline-block;padding:3.5px 11px;border-radius:7px;font-size:11px;font-weight:700;letter-spacing:.01em;white-space:nowrap;}
.badge.paid{background:var(--success-bg);color:var(--success);}
.badge.partial{background:var(--warning-bg);color:var(--warning);}
.badge.unpaid{background:var(--danger-bg);color:var(--danger);}
.badge.neutral{background:var(--surface-2);color:var(--text-muted);}

/* CENTERS */
.center-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px;}
.center-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);}
.center-card h3{margin:0 0 10px 0;font-size:15px;border-bottom:2px solid var(--gold);padding-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.hall-chip{background:var(--surface-2);border-radius:9px;padding:8px 10px;margin-bottom:6px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:8px;}

/* SETUP / AUTH SCREENS */
.setup-wrap{position:fixed;inset:0;background:var(--bg);z-index:200;overflow-y:auto;padding:40px 16px;display:flex;align-items:center;}
.setup-card{max-width:660px;width:100%;margin:0 auto;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:30px 32px;box-shadow:var(--shadow);}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);overflow-x:auto;}
.tab{padding:9px 16px;font-size:13.5px;color:var(--text-muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap;transition:color .15s, border-color .15s;font-weight:500;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--primary);border-color:var(--primary);font-weight:700;}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(20,15,15,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:150;overflow-y:auto;}
.modal{background:var(--surface);border-radius:16px;max-width:460px;width:100%;padding:24px 26px;box-shadow:0 20px 50px rgba(20,15,15,.3);}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.modal-head h3{margin:0;font-size:16px;color:var(--primary-dark);}
.modal-close{cursor:pointer;background:none;border:none;font-size:16px;color:var(--text-muted);padding:5px 9px;border-radius:8px;}
.modal-close:hover{background:var(--surface-2);}
.modal-foot{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border);}

.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#15161F;color:#F3E9DC;padding:11px 22px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 20px rgba(0,0,0,.25);z-index:100;opacity:0;transition:opacity .25s;pointer-events:none;}
.toast.show{opacity:1;}

@media print{
  .topnav, .page-header, .no-print{ display:none !important; }
}

@media screen and (max-width:980px){
  .content{padding:16px;}
  .page-header{padding:12px 16px;}
  .row2,.row3,.row6{grid-template-columns:1fr;}
}
@media screen and (max-width:640px){
  input,select,textarea{font-size:16px;}
  .topnav{padding:0 10px;gap:6px;height:56px;}
  .topnav-brand{gap:6px;}
  .brand-mark{width:32px;height:32px;font-size:14px;}
  .brand-titles{display:none;}
  .page-header{top:56px;padding:10px 14px;}
  .page-header h1{font-size:16.5px;}
  .page-header .sub{display:none;}
  .content{padding:10px;}
  .card{padding:14px 14px;margin-bottom:14px;}
  .card-head{flex-direction:column;align-items:stretch;gap:10px;}
  .card-head h2{font-size:14.5px;}
  .btn{padding:8px 12px;font-size:12.5px;}
  .btn-sm{padding:6px 10px;font-size:11.5px;}
  .stat-grid{grid-template-columns:1fr 1fr;gap:10px;}
  .stat-card{padding:12px 14px;}
  .stat-card .val{font-size:18px;}
  table{font-size:12px;}
  thead th{padding:8px 10px;font-size:9.5px;}
  tbody td{padding:9px 10px;}
  .topnav-userbar > div{display:none;}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modalRoot"></div>
<div id="toast" class="toast"></div>

<script>
/* =========================================================================
   نظام سنتر الدروس — نسخة أونلاين بس (Supabase)
   سناتر متعددة، كل سنتر بمدرجاته، مدرسين بمادة وسعر واحد، حصص/مواعيد
   ثابتة بتتولد يوميًا وتتحصّل أو تتلغي/تتأجل من الصفحة الرئيسية.
   ========================================================================= */

const DEFAULT_SUPABASE_URL = 'https://brpfuggoidmoxvxgkxfz.supabase.co';
const DEFAULT_SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJycGZ1Z2dvaWRtb3h2eGdreGZ6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjUzODYsImV4cCI6MjEwMjU0MTM4Nn0.KxQutXYvHzxoh9V2sRKX4XYC0HQ0fU6YAsdG8XBAKw4';

/* ---------------- Utilities ---------------- */
function uid(){ return 'id_' + Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function pad(n){ return String(n).padStart(2,'0'); }
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowHHMM(){ const d = new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function addDaysISO(dateStr, delta){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  dt.setDate(dt.getDate()+delta);
  return dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate());
}
function arabicWeekdayFromISO(dateStr){
  const [y,m,d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  return (dt.getDay()+1)%7; // Sat=0 .. Fri=6
}
const ARABIC_DAYS = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
function fmt2(n){ return (Math.round((n||0)*100)/100).toFixed(2); }
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(()=>el.classList.remove('show'), 2800);
}
function normalizeSupaUrl(raw){
  let u = (raw||'').trim().replace(/\s+/g,'');
  if(!u) return u;
  if(!/^https?:\/\//i.test(u)){ u = 'https://'+u; }
  u = u.replace(/\/(rest|auth|realtime|storage)\/v1\/?.*$/i, '');
  u = u.replace(/\/+$/,'');
  return u;
}
async function testSupaConnection(url, key){
  let res;
  try{
    res = await fetch(url+'/auth/v1/settings', { headers:{ 'apikey':key } });
  }catch(e){
    throw new Error('مقدرش أوصل للرابط أصلاً: '+url+'\n(اتأكد إنه Project URL صحيح ومنسوخ كامل من Project Settings → API)');
  }
  if(!res.ok){
    throw new Error('الرابط اتفتح بس رجّع HTTP '+res.status+' على: '+url+'\n(اتأكد إنه ده "Project URL" بالظبط من غير أي إضافات زي /rest/v1 أو /auth/v1، وإن الـ anon key مظبوط)');
  }
  return true;
}
function camelToSnake(s){ return s.replace(/[A-Z]/g, m=>'_'+m.toLowerCase()); }
function snakeToCamel(s){ return s.replace(/_([a-z0-9])/g, (_,c)=>c.toUpperCase()); }
function objToSnake(obj){ const out={}; for(const k in obj){ out[camelToSnake(k)] = obj[k]; } return out; }
function objToCamel(obj){ const out={}; for(const k in obj){ out[snakeToCamel(k)] = obj[k]; } return out; }

/* ---------------- Permission modules ---------------- */
const PERMISSION_MODULES = [
  {key:'centers', label:'السناتر والمدرجات'},
  {key:'teachers', label:'المدرسين ومواعيدهم'},
  {key:'employees', label:'الموظفين ومرتباتهم وسلفهم'},
  {key:'sessions', label:'الحصص (الرئيسية)'},

/* ---------------- Supabase: auth (بريد إلكتروني حقيقي) ---------------- */
async function supaAuthRequest(path, body){
  const res = await fetch(SUPA.url+path, { method:'POST', headers:{'apikey':SUPA.key,'Authorization':'Bearer '+SUPA.key,'Content-Type':'application/json'}, body: JSON.stringify(body) });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error_description || data.msg || data.error || ('HTTP '+res.status));
  return data;
}
async function fetchProfileById(accessToken, userId){
  const res = await fetch(SUPA.url+'/rest/v1/profiles?id=eq.'+userId+'&select=*', { headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+accessToken } });
  const rows = await res.json().catch(()=>[]);
  return (rows && rows[0]) ? objToCamel(rows[0]) : null;
}
async function createProfileRow(accessToken, userId, username, fullName){
  let tryUsername = (username||'').trim() || ('user_'+userId.slice(0,6));
  for(let attempt=0; attempt<3; attempt++){
    const res = await fetch(SUPA.url+'/rest/v1/profiles', {
      method:'POST',
      headers:{ 'apikey':SUPA.key, 'Authorization':'Bearer '+accessToken, 'Content-Type':'application/json', 'Prefer':'return=representation' },
      body: JSON.stringify([{ id:userId, username:tryUsername, full_name:(fullName||tryUsername).trim(), role:'staff', permissions:{} }])
    });
    if(res.ok){ const rows = await res.json(); return objToCamel(rows[0]); }
    const t = await res.text().catch(()=>'');
    if(res.status===404 || /relation .* does not exist/i.test(t)){
      throw new Error('يبدو إن جدول profiles مش موجود — اتأكد إنك شغّلت سكريبت supabase-schema.sql كامل في SQL Editor بتاع مشروعك.');
    }
    if(/duplicate key|already exists|unique/i.test(t)){
      tryUsername = tryUsername + '_' + Math.floor(Math.random()*1000);
      continue;
    }
    throw new Error('فشل إنشاء بروفايل المستخدم (HTTP '+res.status+'): '+t);
  }
  throw new Error('فشل إنشاء بروفايل المستخدم: اسم المستخدم مكرر، جرب اسم تاني.');
}
async function doSignup(fullName, username, email, password){
  const data = await supaAuthRequest('/auth/v1/signup', {email, password});
  if(!data.access_token || !data.user){
    return { pendingConfirmation:true };
  }
  const profile = await createProfileRow(data.access_token, data.user.id, username, fullName);
  return { access_token:data.access_token, refresh_token:data.refresh_token, user:data.user, profile };
}

async function doLogin(email, password){
  const data = await supaAuthRequest('/auth/v1/token?grant_type=password', {email, password});
  if(!data.access_token) throw new Error('البريد الإلكتروني أو كلمة المرور غير صحيحة');
  let profile = await fetchProfileById(data.access_token, data.user.id);
  if(!profile){
    const displayName = prompt('أول دخول ليك! اكتب اسمك اللي هيتعرض في النظام:') || email.split('@')[0];
    profile = await createProfileRow(data.access_token, data.user.id, email.split('@')[0], displayName);
  }
  if(profile.active===false){ throw new Error('الحساب ده متعطل — تواصل مع الأدمن'); }
  return { access_token:data.access_token, refresh_token:data.refresh_token, user:data.user, profile };
}
async function refreshAccessToken(){
  if(!SESSION || !SESSION.refresh_token) return false;
  try{
    const data = await supaAuthRequest('/auth/v1/token?grant_type=refresh_token', {refresh_token:SESSION.refresh_token});
    if(data.access_token){
      SESSION.access_token=data.access_token; SESSION.refresh_token=data.refresh_token||SESSION.refresh_token;
      saveSessionToStorage();
      return true;
    }
  }catch(e){}
  return false;
}
async function supaFetch(path, opts={}){
  const doFetch = ()=> fetch(SUPA.url+path, {
    ...opts,
    headers:{
      'apikey': SUPA.key,
      'Authorization': 'Bearer '+(SESSION? SESSION.access_token : SUPA.key),
      'Content-Type':'application/json',
      ...(opts.headers||{})
    }
  });
  let res = await doFetch();
  if(res.status===401 && SESSION){
    const ok = await refreshAccessToken();
    if(ok) res = await doFetch();
  }
  if(!res.ok){
    const t = await res.text().catch(()=>'');
    let msg = t;
    try{ msg = JSON.parse(t).message || t; }catch(e){}
    throw new Error(msg || ('HTTP '+res.status));
  }
  return res;
}

/* ---------------- سجل التدقيق (Audit log) — best-effort، فشله ميوقفش أي عملية أساسية ---------------- */
async function logAudit(action, entityType, entityId, description){
  if(!SESSION) return;
  try{
    const saved = await dbInsert('audit_log', {
      actorId: SESSION.profile.id,
      actorName: SESSION.profile.fullName || SESSION.profile.username,
      action, entityType,
      entityId: (entityId!=null) ? String(entityId) : null,
      description
    });
    if(auditLogState.loaded){ auditLogState.entries.unshift(saved); }
  }catch(e){ /* تسجيل السجل عملية ثانوية — أي فشل فيه (مثلاً صلاحية ناقصة) ميوقفش العملية الأساسية */ }
}
async function loadAuditLog(){
  if(!(SESSION && (SESSION.profile.role==='admin' || can('audit_log')))) return;
  auditLogState.loading = true;
  try{
    const rows = await dbList('audit_log', 'order=created_at.desc&limit=300');
    // نرتب في الجافاسكريبت كمان (مش بس على السيرفر) عشان نضمن الترتيب الصحيح دايمًا
    auditLogState.entries = rows.sort((a,b)=> (b.createdAt||'').localeCompare(a.createdAt||''));
    auditLogState.loaded = true;
  }catch(e){ toast('فشل تحميل سجل التدقيق: '+e.message); }
  auditLogState.loading = false;
}

async function adminCreateUser(fullName, username, password, role, permissions, teacherId){

  const email = usernameToSyntheticEmail(username);

// gradeRates: كائن {grade_key: rate} — المراحل السنية اللي المدرس اختار إنه بيدرّسها وسعرها الخاص
function sanitizeGradeRates(gradeRates){
  const clean = {};
  Object.keys(gradeRates||{}).forEach(k=>{
    if(!GRADE_LEVELS.some(g=>g.key===k)) return;
    const r = parseFloat(gradeRates[k]);
    clean[k] = (isNaN(r)||r<0) ? 0 : r;
  });
  return clean;
}
async function addTeacher(name, subject, rateRaw, phone, notes, sharePercentRaw, gradeRatesRaw){
  if(!requirePerm('teachers')) return null;
  name=(name||'').trim(); subject=(subject||'').trim();
  if(!name || !subject) return null;
  const rate = parseFloat(rateRaw);
  if(isNaN(rate) || rate<0){ toast('سعر الطالب غير صحيح'); return null; }
  let sharePercent = parseFloat(sharePercentRaw);
  if(isNaN(sharePercent) || sharePercent<0) sharePercent = 0;
  if(sharePercent>100) sharePercent = 100;
  const gradeRates = sanitizeGradeRates(gradeRatesRaw);
  const obj = { name, subject, ratePerChild:rate, phone:phone||'', notes:notes||'', sharePercent, gradeRates, active:true };
  try{ const saved = await dbInsert('teachers', obj); DB.teachers.push(saved); await logAudit('create','teacher', saved.id, 'أضاف مدرس: '+name); return saved.id; }
  catch(e){ toast('فشل الحفظ: '+e.message); return null; }
}
async function saveTeacherData(id, name, subject, rateRaw, phone, notes, sharePercentRaw, gradeRatesRaw){
  if(!requirePerm('teachers')) return;
  const rate = parseFloat(rateRaw);
  if(isNaN(rate) || rate<0){ toast('سعر الطالب غير صحيح'); return; }
  let sharePercent = parseFloat(sharePercentRaw);
  if(isNaN(sharePercent) || sharePercent<0) sharePercent = 0;
  if(sharePercent>100) sharePercent = 100;
  const gradeRates = sanitizeGradeRates(gradeRatesRaw);
  const patch = { name:(name||'').trim(), subject:(subject||'').trim(), ratePerChild:rate, phone:phone||'', notes:notes||'', sharePercent, gradeRates };
  try{ await dbUpdate('teachers', id, patch); }catch(e){ toast('فشل الحفظ: '+e.message); return; }
  const t=teacherById(id); if(t) Object.assign(t,patch);

/* ---------------- استيراد/تصدير المدرسين (CSV) ---------------- */
const TEACHERS_CSV_HEADER = ['الاسم','المادة','سعر الطالب','التليفون','نسبة الاستحقاق %','ملاحظات','الحالة','الرصيد الحالي (حساب الشريك)'];
function csvEscapeField(val){
  const s = String(val==null ? '' : val);
  if(/[",\n\r]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}
function parseCsvLine(line){
  const result = [];
  let cur = '', inQuotes = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(inQuotes){
      if(c === '"'){
        if(line[i+1] === '"'){ cur += '"'; i++; } else { inQuotes = false; }
      } else cur += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ result.push(cur); cur=''; }
      else cur += c;
    }
  }
  result.push(cur);
  return result;
}
function teachersToCsv(){
  // كل الخانات اللي بتتملى في بروفايل المدرس (الاسم، المادة، سعر الطالب، نسبة الاستحقاق، التليفون،
  // الملاحظات) بالإضافة لحالة المدرس ورصيد حسابه الحالي كبيانات إضافية للمرجعية (مش بتتستورد تاني،
  // لأنها إما محسوبة تلقائي أو محتاجة تأكيد قبل ما تتغيّر). بيتصدّر كل المدرسين حتى المحذوفين (غير النشطين).
  const rows = DB.teachers.map(t=>[
    t.name, t.subject, t.ratePerChild, t.phone||'', t.sharePercent??0, t.notes||'',
    t.active? 'نشط' : 'غير نشط (محذوف)',
    teacherBalance(t.id)
  ]);
  return [TEACHERS_CSV_HEADER, ...rows].map(r=>r.map(csvEscapeField).join(',')).join('\r\n');
}
function exportTeachersCsv(){
  if(!DB || !DB.teachers || !DB.teachers.length){ toast('مفيش مدرسين لتصديرهم'); return; }
  const csv = '﻿' + teachersToCsv(); // BOM عشان إكسل يعرض العربي صح
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'المدرسين.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
async function importTeachersCsv(file){
  if(!file) return;
  if(!requirePerm('teachers')) return;
  let text;
  try{ text = await file.text(); }catch(e){ toast('فشل قراءة الملف'); return; }
  const lines = text.replace(/^﻿/,'').split(/\r\n|\n/).filter(l=>l.trim().length);
  if(lines.length<2){ toast('الملف فاضي أو مفيش صفوف بيانات فيه'); return; }
  let added=0, failed=0;
  for(let i=1;i<lines.length;i++){
    const cols = parseCsvLine(lines[i]);
    const [name, subject, rate, phone, sharePercent, notes] = cols;
    if(!name || !subject || rate===undefined || rate===''){ failed++; continue; }
    const id = await addTeacher(name, subject, rate, phone||'', notes||'', sharePercent||0);
    if(id) added++; else failed++;
  }
  toast('تم استيراد '+added+' مدرس'+(failed? (' - فشل '+failed+' سطر'):''));
  render();
}

/* ---------------- Business logic: sessions (appointments) ---------------- */
async function ensureSessionsForDate(dateStr){
  const dow = arabicWeekdayFromISO(dateStr);
  const existingScheduleIds = new Set(DB.sessions.filter(s=>s.sessionDate===dateStr && s.scheduleId).map(s=>s.scheduleId));
  const slots = DB.weeklySchedule.filter(w=>w.dayOfWeek===dow && (!w.endDate || dateStr<=w.endDate));
  for(const slot of slots){
    if(existingScheduleIds.has(slot.id)) continue;
    if(!can('sessions')) continue;
    const teacher = teacherById(slot.teacherId);
    // لو الموعد الأسبوعي محدد له مرحلة سنية، بتتحط تلقائي كافتراضي للحصة (والسعر بيتحسب على أساسها)،
    // لكن تفضل قابلة للتغيير يوم بيوم من الصفحة الرئيسية زي أي حصة عادية. لو الموعد من غير مرحلة محددة،
    // السلوك زي الأول بالظبط (بدون مرحلة، السعر العام).
    const rate = teacherRateForGrade(teacher, slot.gradeLevel);
    // عدد الطلاب بيتحدد يوم بيوم من الصفحة الرئيسية نفسها، مش من الموعد الأسبوعي الثابت
    const obj = { sessionDate:dateStr, dayOfWeek:dow, startTime:slot.startTime, endTime:slot.endTime, hallId:slot.hallId, teacherId:slot.teacherId, childrenCount:null, ratePerChild:rate, gradeLevel:slot.gradeLevel||null, amountDue:null, status:'pending', collectedAmount:null, cancelReason:null, postponedToDate:null, isAdhoc:false, scheduleId:slot.id, notes:'' };
    try{ const saved = await dbInsert('sessions', obj); DB.sessions.push(saved); }
    catch(e){ /* غالبًا تكرار من توليد متزامن على جهاز تاني - نتجاهله */ }
  }
}
function sessionsForDate(dateStr){
  return DB.sessions.filter(s=>s.sessionDate===dateStr).sort((a,b)=>(a.startTime||'').localeCompare(b.startTime||''));
}
async function addAdhocSession(dateStr, hallId, teacherId, childrenCountRaw, startTime, ratePerChildRaw, gradeLevelRaw){
  if(!requirePerm('sessions')) return;
  const children = parseInt(childrenCountRaw,10);
  if(!hallId){ toast('اختار مدرج'); return; }
  if(isNaN(children) || children<0){ toast('عدد الطلاب غير صحيح'); return; }
  const teacher = teacherById(teacherId);
  const gradeLevel = gradeLevelRaw || null;
  // سعر الطالب بيتحدد افتراضيًا من سعر المرحلة السنية المختارة عند المدرس (أو سعره العام لو المرحلة
  // مش محددة)، لكن ممكن تتعدل هنا لحصة بسعر مختلف (استثناء لحصة بعينها)
  let rate = teacherRateForGrade(teacher, gradeLevel);
  if(ratePerChildRaw!==undefined && ratePerChildRaw!==null && ratePerChildRaw!==''){
    const overriddenRate = parseFloat(ratePerChildRaw);
    if(isNaN(overriddenRate) || overriddenRate<0){ toast('سعر الطالب غير صحيح'); return; }
    rate = overriddenRate;
  }
  const amountDue = Math.round(children*rate*100)/100;
  const obj = { sessionDate:dateStr, dayOfWeek:arabicWeekdayFromISO(dateStr), startTime, endTime:null, hallId, teacherId, childrenCount:children, ratePerChild:rate, gradeLevel, amountDue, status:'pending', collectedAmount:null, cancelReason:null, postponedToDate:null, isAdhoc:true, scheduleId:null, notes:'' };
  try{ const saved = await dbInsert('sessions', obj); DB.sessions.push(saved); }
  catch(e){ toast('فشل الحفظ: '+e.message); return; }
}
async function updateSessionChildren(sessionId, valueRaw){

// تغيير المرحلة السنية لحصة معيّنة (بتتحدد يوم بيوم زي عدد الطلاب بالظبط) — بيحدّث سعر الطالب
// تلقائي حسب سعر المرحلة دي عند المدرس، وبيعيد حساب المبلغ المتوقع لو عدد الطلاب اتحدد فعلًا.

async function collectSession(id, amount, note){
  if(!requirePerm('sessions')) return;
  const s = DB.sessions.find(x=>x.id===id); if(!s) return;
  const patch = { status:'collected', collectedAmount:amount };
  if(note){ patch.notes = note; }
  try{ await dbUpdate('sessions', id, patch); }catch(e){ toast('فشل: '+e.message); return; }
  Object.assign(s, patch);
  const hall = hallById(s.hallId);
  const tx = { ttype:'income', amount, ttdate:todayISO(), description:'تحصيل حصة: '+teacherName(s.teacherId)+' — '+s.sessionDate, relatedSessionId:id, relatedTeacherId:null, centerId: hall? hall.centerId : null };
  try{ const saved = await dbInsert('treasury_transactions', tx); DB.treasury.push(saved); }
  catch(e){ toast('اتحصّلت الحصة، بس حصل خطأ في تسجيل الخزينة: '+e.message); }
  const teacher = teacherById(s.teacherId);
  if(teacher && teacher.sharePercent>0){
    const due = Math.round(amount*teacher.sharePercent/100*100)/100;
    if(due>0){
      const entry = { teacherId:s.teacherId, entryType:'credit', amount:due, entryDate:todayISO(), description:'استحقاق حصة يوم '+s.sessionDate+' ('+teacher.sharePercent+'%)', relatedSessionId:id, relatedExpenseId:null };
      try{ const saved = await dbInsert('teacher_ledger', entry); DB.teacherLedger.push(saved); }
      catch(e){ toast('اتحصّلت الحصة، بس حصل خطأ في تسجيل استحقاق المدرس: '+e.message); }
    }
  }
  await logAudit('collect','session', id, 'حصّل حصة يوم '+s.sessionDate+' للمدرس '+teacherName(s.teacherId)+' بمبلغ '+fmt2(amount)+' ج.م'+(note?(' — ملاحظة: '+note):''));
  toast('تم التحصيل');
}
async function cancelSession(id, reasonKey, customText, postponeDate){
  if(!requirePerm('sessions')) return;
  const s = DB.sessions.find(x=>x.id===id); if(!s) return;
  const isPostpone = reasonKey==='تأجيل لموعد تاني';
  const reasonText = reasonKey==='سبب تاني' ? (customText||'').trim() : reasonKey;
  const patch = { status:'cancelled', cancelReason:reasonText, postponedToDate: isPostpone ? postponeDate : null };

  Object.assign(s, patch);

    const obj = { sessionDate:postponeDate, dayOfWeek:arabicWeekdayFromISO(postponeDate), startTime:s.startTime, endTime:s.endTime, hallId:s.hallId, teacherId:s.teacherId, childrenCount:s.childrenCount, ratePerChild:s.ratePerChild, gradeLevel:s.gradeLevel||null, amountDue:s.amountDue, status:'pending', collectedAmount:null, cancelReason:null, postponedToDate:null, isAdhoc:true, scheduleId:null, notes:'مؤجلة من '+s.sessionDate };
    try{ const saved = await dbInsert('sessions', obj); DB.sessions.push(saved); }
    catch(e){ toast('اتلغت الحصة، بس حصل خطأ في إنشاء الموعد الجديد: '+e.message); }
  }
  await logAudit('cancel','session', id, (isPostpone?'أجّل':'ألغى')+' حصة يوم '+s.sessionDate+' للمدرس '+teacherName(s.teacherId)+(isPostpone&&postponeDate?(' لـ '+postponeDate):'')+' — السبب: '+reasonText);
  toast('تم الإلغاء');
}

/* ---------------- Business logic: treasury / expenses ---------------- */
function treasuryTotals(centerId){
  let income=0, expense=0;
  DB.treasury.forEach(t=>{
    if(centerId && t.centerId!==centerId) return; // فلترة بالسنتر (الفرع) لو محدد
    if(t.ttype==='income'){ income+=t.amount; return; }
    // المصروف اللي لسه بانتظار موافقة الشريك أو اتّرفض منه، مبيتحسبش لحد ما يتوافق عليه فعلًا
    const status = t.approvalStatus || 'approved';
    if(status==='approved'){ expense+=t.amount; }
  });
  const balance = income-expense;
  // مستحق الشركاء دايمًا إجمالي لكل الفروع (المدرس بيشتغل في أي سنتر، مش مربوط بسنتر معين)
  const partnersDue = DB.teachers.reduce((sum,t)=> sum + Math.max(0, teacherBalance(t.id)), 0);
  // رصيد السنتر = الرصيد الكلي بعد ما نجنّب اللي مستحق للمدرسين ولسه ما اتصرفش
  const centerBalance = balance - partnersDue;
  return { income, expense, balance, partnersDue, centerBalance };
}
// عدد الأيام اللي مصروف "بانتظار الموافقة" فضل معلّق فيها من غير رد فعل من الشريك
function pendingExpenseAgeDays(tx){
  if(!tx.createdAt) return 0;
  const created = new Date(tx.createdAt).getTime();
  if(isNaN(created)) return 0;
  return Math.floor((Date.now()-created)/86400000);
}
function isStalePendingExpense(tx){
  return (tx.approvalStatus||'approved')==='pending' && pendingExpenseAgeDays(tx)>=STALE_PENDING_DAYS;
}
async function addExpense(amount, ttdate, description, teacherId, centerId, lineItems){
  if(!requirePerm('expenses')) return;
  // لو المصروف مرتبط بمدرس (شريك) عنده حساب دخول مرتبط بيه، لازم هو (أو الأدمن) يوافق عليه
  // الأول قبل ما يتخصم فعليًا من حسابه — غير كده بيتسجل معتمد على طول زي أي مصروف عادي.
  const linked = teacherId ? await teacherHasLinkedLogin(teacherId) : false;
  const approvalStatus = linked ? 'pending' : 'approved';
  // lineItems (اختياري): مصفوفة {description, amount} لو المصروف ده اتسجل كعناصر/بنود متعددة
  // بدل مبلغ واحد — المبلغ الكلي already بيمثّل مجموعها (اتحسب في الواجهة قبل الإرسال).
  const obj = { ttype:'expense', amount, ttdate, description, relatedSessionId:null, relatedTeacherId: teacherId||null, centerId: centerId||null, approvalStatus, lineItems: (lineItems && lineItems.length) ? lineItems : null };
  let saved;
  try{ saved = await dbInsert('treasury_transactions', obj); DB.treasury.push(saved); }
  catch(e){ toast('فشل الحفظ: '+e.message); return; }
  if(teacherId && approvalStatus==='approved'){
    const entry = { teacherId, entryType:'debit', amount, entryDate:ttdate, description:'سحب/دفعة: '+(description||''), relatedSessionId:null, relatedExpenseId:saved.id };
    try{ const savedEntry = await dbInsert('teacher_ledger', entry); DB.teacherLedger.push(savedEntry); }
    catch(e){ toast('اتسجل المصروف، بس حصل خطأ في تحديث حساب المدرس: '+e.message); }
  }
  await logAudit('create','expense', saved.id, 'سجّل مصروف بمبلغ '+fmt2(amount)+' ج.م'+(teacherId?(' على '+teacherName(teacherId)):'')+(approvalStatus==='pending'?' (بانتظار الموافقة)':'')+' — '+(description||''));
}
async function approveExpense(id){
  const tx = DB.treasury.find(t=>t.id===id);
  if(!tx || tx.ttype!=='expense') return;
  const isOwner = SESSION && SESSION.profile.teacherId && SESSION.profile.teacherId===tx.relatedTeacherId;
  const isAdmin = SESSION && SESSION.profile.role==='admin';
  if(!isOwner && !isAdmin){ toast('مينفعش توافق على مصروف مش بتاعك'); return; }
  try{ await dbUpdate('treasury_transactions', id, { approvalStatus:'approved' }); }
  catch(e){ toast('فشل: '+e.message); return; }
  tx.approvalStatus = 'approved';
  const entry = { teacherId: tx.relatedTeacherId, entryType:'debit', amount:tx.amount, entryDate:tx.ttdate, description:'سحب/دفعة: '+(tx.description||''), relatedSessionId:null, relatedExpenseId:tx.id };
  try{ const savedEntry = await dbInsert('teacher_ledger', entry); DB.teacherLedger.push(savedEntry); }
  catch(e){ toast('اتعمد المصروف، بس حصل خطأ في تحديث حساب المدرس: '+e.message); return; }
  await logAudit('approve','expense', id, 'وافق على مصروف بمبلغ '+fmt2(tx.amount)+' ج.م'+(tx.relatedTeacherId?(' على '+teacherName(tx.relatedTeacherId)):''));
  toast('تمت الموافقة على المصروف');
}
async function rejectExpense(id){
  const tx = DB.treasury.find(t=>t.id===id);
  if(!tx || tx.ttype!=='expense') return;
  const isOwner = SESSION && SESSION.profile.teacherId && SESSION.profile.teacherId===tx.relatedTeacherId;
  const isAdmin = SESSION && SESSION.profile.role==='admin';
  if(!isOwner && !isAdmin){ toast('مينفعش ترفض مصروف مش بتاعك'); return; }
  try{ await dbUpdate('treasury_transactions', id, { approvalStatus:'rejected' }); }
  catch(e){ toast('فشل: '+e.message); return; }
  tx.approvalStatus = 'rejected';
  await logAudit('reject','expense', id, 'رفض مصروف بمبلغ '+fmt2(tx.amount)+' ج.م'+(tx.relatedTeacherId?(' على '+teacherName(tx.relatedTeacherId)):''));
  toast('تم رفض المصروف');
}
function expenseApprovalBadgeHtml(tx){
  const status = tx.approvalStatus || 'approved';
  if(status==='pending'){
    return isStalePendingExpense(tx)
      ? '<span class="badge unpaid">⚠ بانتظار موافقة الشريك — متأخر ('+pendingExpenseAgeDays(tx)+' يوم)</span>'
      : '<span class="badge partial">بانتظار موافقة الشريك</span>';
  }
  if(status==='rejected') return '<span class="badge unpaid">مرفوض من الشريك</span>';
  return '<span class="badge paid">معتمد</span>';
}
// لو مصروف اتسجل مقسّم لبنود (line_items)، بيوضح "تفاصيل" قابلة للفتح جنب بيانه فيها البنود وقيمتها.
function expenseLineItemsDetailHtml(tx){
  if(!tx.lineItems || !Array.isArray(tx.lineItems) || !tx.lineItems.length) return '';
  const itemsHtml = tx.lineItems.map(it=>`<li>${escapeHtml(it.description||'بدون بيان')}: <b>${fmt2(it.amount||0)}</b> ج.م</li>`).join('');
  return `<details class="expense-items-detail" style="margin-top:4px;"><summary style="cursor:pointer;color:var(--text-muted);font-size:12.5px;">${tx.lineItems.length} بنود (دوس للتفاصيل)</summary><ul style="margin:6px 0 0;padding-inline-start:18px;font-size:13px;">${itemsHtml}</ul></details>`;
}

  const linkedEmployeeEntries = DB.employeeLedger.filter(l=>l.relatedExpenseId===id);

}

function teacherLedgerEntries(teacherId){
  return DB.teacherLedger.filter(l=>l.teacherId===teacherId).sort((a,b)=> (a.entryDate||'').localeCompare(b.entryDate||'') || (a.id||'').localeCompare(b.id||''));

function ledgerEntrySourceLabel(e){
  return e.relatedSessionId ? 'تلقائي من حصة' : e.relatedExpenseId ? 'مرتبط بمصروف' : 'يدوي';

function teacherBalance(teacherId){
  let bal = 0;
  DB.teacherLedger.forEach(l=>{ if(l.teacherId===teacherId){ bal += l.entryType==='credit' ? l.amount : -l.amount; } });

function employeeLedgerEntries(employeeId){

// السلفة المستحقة على الموظف (لسه ما اتسوتش من راتب) = مجموع السلف (والقيود المدينة
// اليدوية) ناقص مجموع تسويات السلف (والقيود الدائنة اليدوية). موجب = عليه سلفة للسنتر.
function employeeAdvanceBalance(employeeId){
  let bal = 0;
  DB.employeeLedger.forEach(l=>{
    if(l.employeeId!==employeeId) return;
    if(l.entryType==='advance' || l.entryType==='debit') bal += l.amount;
    else if(l.entryType==='advance_settle' || l.entryType==='credit') bal -= l.amount;
  });

}

// صرف راتب: المرتب الأساسي + مكافأة اختيارية - خصم اختياري - تسوية سلفة سابقة اختيارية
// (بحد أقصى السلفة المستحقة فعلاً) = صافي المبلغ اللي بيتسجل كمصروف واحد في الخزينة.
async function payEmployeeSalary(employeeId, baseAmountRaw, bonusAmountRaw, bonusDesc, deductionAmountRaw, deductionDesc, advanceSettleAmountRaw, payDate, description){
  if(!requirePerm('employees')) return;
  const emp = employeeById(employeeId);
  if(!emp){ toast('الموظف غير موجود'); return; }
  const base = parseFloat(baseAmountRaw); if(isNaN(base) || base<0){ toast('المرتب الأساسي غير صحيح'); return; }
  let bonus = parseFloat(bonusAmountRaw); if(isNaN(bonus) || bonus<0) bonus = 0;
  let deduction = parseFloat(deductionAmountRaw); if(isNaN(deduction) || deduction<0) deduction = 0;
  let advanceSettle = parseFloat(advanceSettleAmountRaw); if(isNaN(advanceSettle) || advanceSettle<0) advanceSettle = 0;
  const outstandingAdvance = employeeAdvanceBalance(employeeId);
  if(advanceSettle > outstandingAdvance + 0.001){ toast('المبلغ المطلوب تسويته من السلفة أكبر من السلفة المستحقة فعلاً ('+fmt2(outstandingAdvance)+' ج.م)'); return; }
  const netAmount = Math.round((base + bonus - deduction - advanceSettle)*100)/100;
  if(netAmount < 0){ toast('صافي الراتب مينفعش يبقى بالسالب — قلّل الخصم أو مبلغ تسوية السلفة'); return; }
  const date = payDate || todayISO();
  const desc = (description||'').trim();
  let txnId = null;
  if(netAmount > 0){
    const tx = { ttype:'expense', amount:netAmount, ttdate:date, description:'صرف راتب: '+emp.name+(desc?(' — '+desc):''), relatedSessionId:null, relatedTeacherId:null, employeeId, centerId:null, approvalStatus:'approved' };
    try{ const saved = await dbInsert('treasury_transactions', tx); DB.treasury.push(saved); txnId = saved.id; }
    catch(e){ toast('فشل تسجيل صرف الراتب: '+e.message); return; }
  }
  const entriesToAdd = [];
  if(base>0) entriesToAdd.push({ employeeId, entryType:'salary', amount:base, entryDate:date, description:'مرتب أساسي'+(desc?(' — '+desc):''), relatedExpenseId:txnId });
  if(bonus>0) entriesToAdd.push({ employeeId, entryType:'bonus', amount:bonus, entryDate:date, description:(bonusDesc||'').trim()||'مكافأة', relatedExpenseId:txnId });
  if(deduction>0) entriesToAdd.push({ employeeId, entryType:'deduction', amount:deduction, entryDate:date, description:(deductionDesc||'').trim()||'خصم', relatedExpenseId:txnId });
  if(advanceSettle>0) entriesToAdd.push({ employeeId, entryType:'advance_settle', amount:advanceSettle, entryDate:date, description:'تسوية سلفة من الراتب', relatedExpenseId:txnId });
  for(const entry of entriesToAdd){
    try{ const saved = await dbInsert('employee_ledger', entry); DB.employeeLedger.push(saved); }
    catch(e){ toast('اتسجل صرف الراتب، بس حصل خطأ في تحديث حساب الموظف: '+e.message); }
  }
  await logAudit('create','employee_salary', employeeId, 'صرف راتب لـ '+emp.name+' — صافي '+fmt2(netAmount)+' ج.م (أساسي '+fmt2(base)+(bonus>0?', مكافأة '+fmt2(bonus):'')+(deduction>0?', خصم '+fmt2(deduction):'')+(advanceSettle>0?', تسوية سلفة '+fmt2(advanceSettle):'')+')');
  toast('تم صرف الراتب');
}

// كشف حساب شامل للمدرس: بيدمج تفاصيل الحصص (تاريخ، مرحلة، عدد طلاب، حالة، مبلغ محصّل، استحقاق
// المدرس منها) مع حركة حسابه المالي (قيود مدين/دائن) في نفس الفترة، بالإضافة لرصيد افتتاحي
// (كل القيود قبل "من تاريخ") ورصيد ختامي — عشان يوضح بالظبط المدرس مستحق له كام أو عليه كام.
function computeStatement(teacherId, from, to){
  const sess = DB.sessions.filter(s=>s.teacherId===teacherId && s.sessionDate>=from && s.sessionDate<=to).sort((a,b)=>a.sessionDate.localeCompare(b.sessionDate));
  const collected = sess.filter(s=>s.status==='collected');
  const cancelled = sess.filter(s=>s.status==='cancelled');
  const pending = sess.filter(s=>s.status==='pending');
  const totalCollected = collected.reduce((a,s)=>a+(s.collectedAmount||0),0);
  const totalChildren = collected.reduce((a,s)=>a+(s.childrenCount||0),0);

  const allLedger = teacherLedgerEntries(teacherId); // مرتبة بالتاريخ تصاعدي بالفعل
  // استحقاق المدرس من كل حصة (لو اتحصّلت) بيتسجل تلقائي كقيد دائن مرتبط بالحصة — نربطهم هنا
  // عشان نوضح جنب كل حصة قد إيه استحقاق المدرس منها (مش بس المبلغ المحصّل من الطالب).
  const sessionCreditById = {};
  allLedger.forEach(l=>{ if(l.relatedSessionId) sessionCreditById[l.relatedSessionId] = l.amount; });
  const totalTeacherShare = collected.reduce((a,s)=> a + (sessionCreditById[s.id]||0), 0);

  const openingBalance = allLedger.filter(l=>l.entryDate<from).reduce((bal,l)=> bal + (l.entryType==='credit'? l.amount : -l.amount), 0);
  const periodEntries = allLedger.filter(l=> l.entryDate>=from && l.entryDate<=to);
  let running = openingBalance;
  const ledgerRows = periodEntries.map(l=>{
    running += l.entryType==='credit' ? l.amount : -l.amount;
    return Object.assign({}, l, { runningBalance: running });
  });
  const periodCredit = periodEntries.filter(l=>l.entryType==='credit').reduce((a,l)=>a+l.amount,0);
  const periodDebit = periodEntries.filter(l=>l.entryType==='debit').reduce((a,l)=>a+l.amount,0);
  const closingBalance = openingBalance + periodCredit - periodDebit;

  return { sessions:sess, collected, cancelled, pending, totalCollected, totalChildren, sessionCreditById,
    totalTeacherShare, openingBalance, ledgerRows, periodCredit, periodDebit, closingBalance };
}

/* ---------------- تقرير الأرباح والخسائر (شهري + أسبوعي) ---------------- */
const ARABIC_MONTHS = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function arabicMonthLabel(key){
  const [y,m] = key.split('-').map(Number);
  return (ARABIC_MONTHS[m-1]||key)+' '+y;
}
function lastNMonthKeys(n){
  const keys = [];
  const now = new Date();
  for(let i=n-1;i>=0;i--){
    const d = new Date(now.getFullYear(), now.getMonth()-i, 1);
    keys.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'));
  }
  return keys;
}
// بداية الأسبوع (السبت) اللي بيقع فيه التاريخ ده — الأسبوع هنا سبت→جمعة زي باقي النظام (ARABIC_DAYS).
function weekStartISO(dateStr){
  const dow = arabicWeekdayFromISO(dateStr); // 0=سبت .. 6=جمعة
  return addDaysISO(dateStr, -dow);
}
function lastNWeekKeys(n){
  const keys = [];
  const curStart = weekStartISO(todayISO());
  for(let i=n-1;i>=0;i--){ keys.push(addDaysISO(curStart, -7*i)); }
  return keys;
}
function weekLabel(startKey){
  const endKey = addDaysISO(startKey, 6);
  const short = iso=>{ const [,m,d]=iso.split('-'); return d+'/'+m; };
  return short(startKey)+' – '+short(endKey);
}
// صافي الربح للفترة = التحصيل - المصروفات المعتمدة - مستحقات المدرسين اللي اتحقت في نفس الفترة (استحقاق
// المدرس بيتحسب تكلفة على السنتر وقت ما يتسجل، مش وقت ما يتسوى فعليًا — عشان الرقم يعكس الربح الحقيقي).
// لو فيه فلترة بسنتر معيّن، مستحقات المدرسين بتتشال من الحساب خالص (المدرس مش مربوط بسنتر معين أصلًا).
// دالة عامة بتتقسم على فترات (شهور أو أسابيع) — بتاخد قايمة مفاتيح الفترة ودالة بتحوّل تاريخ لمفتاح فترة.
function pnlSeriesForPeriods(centerId, periodKeys, dateToKeyFn){
  const filtered = !!centerId;
  const byPeriod = {};
  periodKeys.forEach(p=> byPeriod[p] = { period:p, income:0, expense:0, teacherShare:0 });
  DB.treasury.forEach(t=>{
    if(filtered && t.centerId!==centerId) return;
    const p = dateToKeyFn(t.ttdate);
    if(!byPeriod[p]) return; // برّه نطاق الفترات المعروضة، متجاهلينه
    if(t.ttype==='income'){ byPeriod[p].income += t.amount; }
    else if((t.approvalStatus||'approved')==='approved'){ byPeriod[p].expense += t.amount; }
  });
  if(!filtered){
    DB.teacherLedger.forEach(l=>{
      if(l.entryType!=='credit') return;
      const p = dateToKeyFn(l.entryDate);
      if(!byPeriod[p]) return;
      byPeriod[p].teacherShare += l.amount;
    });
  }
  let prevNet = null;
  return periodKeys.map(p=>{
    const row = byPeriod[p];
    const net = filtered ? (row.income-row.expense) : (row.income-row.expense-row.teacherShare);
    const delta = prevNet==null? null : Math.round((net-prevNet)*100)/100;
    prevNet = net;
    return Object.assign({}, row, { net:Math.round(net*100)/100, delta, filtered });
  });
}
function monthlyPnlData(centerId){
  const months = lastNMonthKeys(12);
  return pnlSeriesForPeriods(centerId, months, d=>(d||'').slice(0,7))
    .map(r=> ({ month:r.period, income:r.income, expense:r.expense, teacherShare:r.teacherShare, net:r.net, delta:r.delta, filtered:r.filtered }));
}
function weeklyPnlData(centerId){
  const weeks = lastNWeekKeys(12);
  return pnlSeriesForPeriods(centerId, weeks, d=> d? weekStartISO(d) : '')
    .map(r=> ({ week:r.period, income:r.income, expense:r.expense, teacherShare:r.teacherShare, net:r.net, delta:r.delta, filtered:r.filtered }));
}
function setPnlFilterCenter(centerId){ pnlFilterCenterId = centerId||''; render(); }
function setPnlPeriod(period){ pnlPeriod = (period==='weekly') ? 'weekly' : 'monthly'; render(); }
// رسم بياني عام (أعمدة تحصيل/مصروفات + خط صافي الربح) — SVG يدوي بدون أي مكتبة خارجية، عشان الملف يفضل مكتفي بذاته.
function financeChartSvg(rows, opts){
  opts = opts||{};
  if(!rows || !rows.length) return '<p class="hint">لا يوجد بيانات كافية لعرض الرسم البياني.</p>';
  const W = 900, H = opts.height||260, padL=52, padR=14, padT=16, padB=52;
  const innerW = W-padL-padR, innerH = H-padT-padB;
  const n = rows.length;
  const allVals = rows.reduce((a,r)=>a.concat([r.income,r.expense,r.net]),[]);
  let maxV = Math.max(0, ...allVals), minV = Math.min(0, ...allVals);
  if(maxV===minV){ maxV += 1; minV -= 1; }
  const range = (maxV-minV) || 1;
  const yOf = v => padT + innerH - ((v-minV)/range)*innerH;
  const zeroY = yOf(0);
  const slotW = innerW/n;
  const barW = Math.max(4, Math.min(18, slotW*0.28));
  const gridCount = 4;
  let gridHtml = '';
  for(let i=0;i<=gridCount;i++){
    const v = minV + (range*i/gridCount);
    const y = yOf(v);
    gridHtml += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${W-padR}" y2="${y.toFixed(1)}" stroke="var(--border)" stroke-width="1" stroke-dasharray="3,3"/>`;
    gridHtml += `<text x="${padL-8}" y="${(y+3.5).toFixed(1)}" font-size="10" fill="var(--text-muted)" text-anchor="end">${fmt2(v)}</text>`;
  }
  let barsHtml = '', xLabelsHtml = '';
  const linePts = [];
  rows.forEach((r,i)=>{
    const cx = padL + slotW*i + slotW/2;
    const xInc = cx - barW - 2, xExp = cx + 2;
    const yInc = Math.min(yOf(r.income), zeroY), hInc = Math.max(1, Math.abs(yOf(r.income)-zeroY));
    const yExp = Math.min(yOf(r.expense), zeroY), hExp = Math.max(1, Math.abs(yOf(r.expense)-zeroY));
    barsHtml += `<rect x="${xInc.toFixed(1)}" y="${yInc.toFixed(1)}" width="${barW.toFixed(1)}" height="${hInc.toFixed(1)}" fill="var(--success)" rx="2"><title>${escapeHtml(r.label)} — تحصيل: ${fmt2(r.income)}</title></rect>`;
    barsHtml += `<rect x="${xExp.toFixed(1)}" y="${yExp.toFixed(1)}" width="${barW.toFixed(1)}" height="${hExp.toFixed(1)}" fill="var(--danger)" rx="2"><title>${escapeHtml(r.label)} — مصروفات: ${fmt2(r.expense)}</title></rect>`;
    linePts.push([cx, yOf(r.net)]);
    xLabelsHtml += `<text x="${cx.toFixed(1)}" y="${(H-padB+18).toFixed(1)}" font-size="10" fill="var(--text-muted)" text-anchor="middle" transform="rotate(-35 ${cx.toFixed(1)} ${(H-padB+18).toFixed(1)})">${escapeHtml(r.label)}</text>`;
  });
  const linePath = linePts.map((p,i)=> (i===0?'M':'L')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const areaPath = linePts.length ? (linePath + ` L${linePts[linePts.length-1][0].toFixed(1)},${zeroY.toFixed(1)} L${linePts[0][0].toFixed(1)},${zeroY.toFixed(1)} Z`) : '';
  const netLabel = opts.filtered ? 'صافي التدفق النقدي' : 'صافي الربح';
  const lineHtml = `<path d="${areaPath}" fill="url(#pnlGrad)" opacity="0.2"/>`
    + `<path d="${linePath}" fill="none" stroke="var(--gold)" stroke-width="2.5"/>`

/* ---------------- تصدير Excel عام (صيغة SpreadsheetML — بتفتح في Excel/Sheets من غير أي مكتبة خارجية) ---------------- */
function xmlEscape(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function excelRowXml(cells){
  return '<Row>'+cells.map(c=>{
    const isNum = typeof c === 'number' && isFinite(c);
    return isNum ? ('<Cell><Data ss:Type="Number">'+c+'</Data></Cell>') : ('<Cell><Data ss:Type="String">'+xmlEscape(c)+'</Data></Cell>');
  }).join('')+'</Row>';
}
function buildExcelWorksheetXml(sheetName, headerRow, dataRows){
  return ' <Worksheet ss:Name="'+xmlEscape(sheetName).slice(0,31)+'">\n  <Table>\n   '
    + excelRowXml(headerRow) + '\n   ' + dataRows.map(excelRowXml).join('\n   ')
    + '\n  </Table>\n </Worksheet>';
}
function buildExcelXml(sheetName, headerRow, dataRows){
  return '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n'
    + buildExcelWorksheetXml(sheetName, headerRow, dataRows)
    + '\n</Workbook>';
}
// زي buildExcelXml لكن بيدعم أكتر من ورقة (شيت) في نفس ملف الإكسل — sheets = [{name, headerRow, dataRows}, ...]
function buildExcelXmlMultiSheet(sheets){
  return '<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n'
    + '<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">\n'
    + sheets.map(sh=>buildExcelWorksheetXml(sh.name, sh.headerRow, sh.dataRows)).join('\n')
    + '\n</Workbook>';
}
function downloadExcelBlob(filename, xml){
  const blob = new Blob(['﻿'+xml], {type:'application/vnd.ms-excel;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}
function downloadExcelFile(filename, sheetName, headerRow, dataRows){
  downloadExcelBlob(filename, buildExcelXml(sheetName, headerRow, dataRows));
}
function downloadExcelFileMultiSheet(filename, sheets){
  downloadExcelBlob(filename, buildExcelXmlMultiSheet(sheets));
}

function teachersSortedByBalance(list){
  return list.slice().sort((a,b)=>{
    const balA = teacherBalance(a.id), balB = teacherBalance(b.id);
    const nonZeroA = balA!==0, nonZeroB = balB!==0;
    if(nonZeroA !== nonZeroB) return nonZeroA ? -1 : 1;
    return Math.abs(balB) - Math.abs(balA);
  });
}
// فلترة صفوف جدول المدرسين وقت الكتابة في خانة البحث — بيغيّر ظهور الصفوف مباشرة في الـDOM
// من غير ما يعمل render() كامل، عشان مؤشر الكتابة في الخانة ميضيعش مع كل حرف.
function filterTeachersRows(query){
  const q = (query||'').trim().toLowerCase();
  const rows = document.querySelectorAll('#teachersTableBody tr[data-search]');
  let visibleCount = 0;
  rows.forEach(tr=>{
    const match = !q || (tr.getAttribute('data-search')||'').includes(q);
    tr.style.display = match ? '' : 'none';
    if(match) visibleCount++;
  });
  const noResultsRow = document.getElementById('teachersNoResultsRow');
  if(noResultsRow) noResultsRow.style.display = (visibleCount===0 && rows.length>0) ? '' : 'none';
}

// آخر سطر (غالبًا بتسجل أكتر من مصروف بنفس التفاصيل لنفس الشريك)، لكن التاريخ والسنتر بيفضلوا

            <div class="teacher-search-dropdown expense-teacher-dropdown" style="display:none;"></div>

        <div class="field"><label>البيان</label><input type="text" name="description" placeholder="سبب المصروف" value="${prefill.description?escapeHtml(prefill.description):''}" required></div>

        <p class="hint" style="margin:0 0 8px;">اكتب بنود المصروف وقيمتها — المبلغ الكلي فوق هيتحسب تلقائي من مجموعها.</p>
        <div class="expense-items-list"></div>

        </div>
      </div>
      <input type="hidden" name="items_json" class="expense-items-json" value="">
      <button type="button" class="btn btn-danger-o btn-sm expense-row-remove" style="position:absolute;top:10px;left:10px;" onclick="removeExpenseRow(this)">حذف السطر</button>

// تقسيم المبلغ لبنود: مصروف واحد (سطر واحد) ممكن يتكوّن من أكتر من عنصر (مثلاً فاتورة فيها
// كهرباء + مياه) — بيتخزنوا كمصفوفة jsonb في items_json (hidden input)، والمبلغ الكلي بيتحسب
// تلقائي من مجموعهم بدل ما يتكتب يدوي. زي خانة الشريك، الدوال دي بتشتغل على مستوى السطر
// (.closest('.expense-row')) عشان ممكن يكون فيه أكتر من سطر مصروف في نفس الوقت.
function expenseItemRowHtml(){
  return `<div class="expense-item-row" style="display:flex;gap:8px;margin-bottom:6px;align-items:center;">
    <input type="text" class="expense-item-desc" placeholder="بيان البند (اختياري)" style="flex:2;" oninput="recalcExpenseItems(this)">
    <input type="number" step="0.01" min="0" class="expense-item-amount" placeholder="المبلغ" style="flex:1;" oninput="recalcExpenseItems(this)">
    <button type="button" class="btn btn-danger-o btn-sm" onclick="removeExpenseItemRow(this)">حذف</button>
  </div>`;
}
function toggleExpenseItems(btn){
  const row = btn.closest('.expense-row');
  if(!row) return;
  const panel = row.querySelector('.expense-items-panel');
  const list = row.querySelector('.expense-items-list');
  const toggleBtn = row.querySelector('.expense-items-toggle');
  if(!panel) return;
  panel.style.display = 'block';
  if(toggleBtn) toggleBtn.style.display = 'none';
  if(list && !list.children.length){
    list.insertAdjacentHTML('beforeend', expenseItemRowHtml());
    list.insertAdjacentHTML('beforeend', expenseItemRowHtml());
  }
  recalcExpenseItems(row);
}
function addExpenseItemRow(btn){
  const row = btn.closest('.expense-row');
  const list = row && row.querySelector('.expense-items-list');
  if(!list) return;
  list.insertAdjacentHTML('beforeend', expenseItemRowHtml());
  recalcExpenseItems(row);
}
function removeExpenseItemRow(btn){
  const row = btn.closest('.expense-row');
  const item = btn.closest('.expense-item-row');
  if(item) item.remove();
  if(row) recalcExpenseItems(row);
}
function clearExpenseItems(btn){
  const row = btn.closest('.expense-row');
  if(!row) return;
  const panel = row.querySelector('.expense-items-panel');
  const list = row.querySelector('.expense-items-list');
  const toggleBtn = row.querySelector('.expense-items-toggle');
  const amountInput = row.querySelector('.expense-amount-input');
  const jsonInput = row.querySelector('.expense-items-json');
  if(list) list.innerHTML = '';
  if(panel) panel.style.display = 'none';
  if(toggleBtn) toggleBtn.style.display = '';
  if(jsonInput) jsonInput.value = '';
  if(amountInput) amountInput.removeAttribute('readonly');
}
// بتاخد أي عنصر جوه السطر (أو السطر نفسه) وبتعيد حساب مبلغ السطر الكلي من مجموع البنود
// الصحيحة (اللي ليها مبلغ أكبر من صفر)، وبتحدّث خانة "المبلغ" (للقراءة فقط طول ما التقسيم
// شغال) وخانة items_json المخفية اللي بتتبعت مع الفورم.
function recalcExpenseItems(el){
  const row = el.closest ? el.closest('.expense-row') : el;
  if(!row) return;
  const amountInput = row.querySelector('.expense-amount-input');
  const jsonInput = row.querySelector('.expense-items-json');
  const itemRows = row.querySelectorAll('.expense-item-row');
  const items = [];
  let total = 0;
  itemRows.forEach(ir=>{
    const descEl = ir.querySelector('.expense-item-desc');
    const amtEl = ir.querySelector('.expense-item-amount');
    const amt = parseFloat(amtEl ? amtEl.value : '');
    if(!isNaN(amt) && amt>0){
      items.push({ description: (descEl && descEl.value ? descEl.value.trim() : ''), amount: amt });
      total += amt;
    }
  });
  if(amountInput){ amountInput.value = items.length ? String(total) : ''; amountInput.setAttribute('readonly','readonly'); }
  if(jsonInput) jsonInput.value = items.length ? JSON.stringify(items) : '';
}
// خانة "الشريك" في تسجيل مصروف بقت بحث + قايمة منسدلة (زي خانة المدرس في "+ إضافة حصة")،
// وبما إن ممكن يكون فيه أكتر من سطر مصروف في نفس الوقت، الدوال دي بتشتغل على مستوى السطر
// (بتلاقي أقرب .expense-row للعنصر اللي اتنده منه) مش على عنصر واحد ثابت بمعرف فريد.
function expenseTeacherOptionsHtml(query){
  const q = (query||'').trim().toLowerCase();
  const activeTeachers = DB.teachers.filter(t=>t.active);
  const matches = q ? activeTeachers.filter(t=> (t.name+' '+t.subject).toLowerCase().includes(q)) : activeTeachers;
  const generalLabel = 'بدون — مصروف عام';
  const generalMatches = !q || generalLabel.toLowerCase().includes(q);
  let itemsHtml = '';
  if(generalMatches){ itemsHtml += `<div class="dropdown-item" onmousedown="event.preventDefault();selectExpenseTeacher(this,'')">${generalLabel}</div>`; }
  itemsHtml += matches.map(t=>`<div class="dropdown-item" onmousedown="event.preventDefault();selectExpenseTeacher(this,'${t.id}')">${escapeHtml(t.name)} (${escapeHtml(t.subject)})</div>`).join('');
  return itemsHtml || '<div class="dropdown-item empty">مفيش شريك مطابق للبحث</div>';
}
function renderExpenseTeacherDropdown(inputEl){
  const row = inputEl.closest('.expense-row');
  const box = row && row.querySelector('.expense-teacher-dropdown');
  if(!box) return;
  box.innerHTML = expenseTeacherOptionsHtml(inputEl.value);
  box.style.display = 'block';
}
// بيتنده لما خانة البحث تاخد فوكس أو تتداس — بيوضح كل الشركاء على طول، مهما كان مكتوب فيها حاليًا.
function openExpenseTeacherDropdown(inputEl){
  const row = inputEl.closest('.expense-row');
  const box = row && row.querySelector('.expense-teacher-dropdown');
  if(!box) return;
  box.innerHTML = expenseTeacherOptionsHtml('');
  box.style.display = 'block';
}
function closeExpenseTeacherDropdown(inputEl){
  const row = inputEl.closest('.expense-row');
  const box = row && row.querySelector('.expense-teacher-dropdown');
  if(box){ box.style.display = 'none'; box.innerHTML = ''; }
}
function selectExpenseTeacher(itemEl, teacherId){
  const row = itemEl.closest('.expense-row');
  if(!row) return;
  const input = row.querySelector('.expense-teacher-search');
  const hidden = row.querySelector('.expense-teacher-id');
  const teacher = teacherId ? teacherById(teacherId) : null;
  if(input) input.value = teacher ? teacher.name : '';
  if(hidden) hidden.value = teacherId || '';

}
function addExpenseFormRow(){

  const prefill = lastRow ? {

    description: lastRow.querySelector('input[name="description"]') ? lastRow.querySelector('input[name="description"]').value : '',
    teacherId: lastRow.querySelector('.expense-teacher-id') ? lastRow.querySelector('.expense-teacher-id').value : '',

function removeExpenseRow(btn){

// بيوضح تاريخ اليوم مع اسم يوم الأسبوع، لعنوان مجموعة المصروفات المجمّعة باليوم في "مصروفات السنتر".
function dayGroupLabel(dateStr){
  return ARABIC_DAYS[arabicWeekdayFromISO(dateStr)] + ' — ' + dateStr;
}
function expenseRowActionHtml(tx){
  const status = tx.approvalStatus||'approved';
  const canAct = tx.relatedTeacherId && status==='pending' && SESSION && (SESSION.profile.role==='admin' || (SESSION.profile.teacherId && SESSION.profile.teacherId===tx.relatedTeacherId));
  const actions = [];
  if(canAct){
    actions.push(`<button class="btn btn-success btn-sm" data-action="approve-expense" data-id="${tx.id}">موافقة</button>`);

  if(can('expenses_delete')){ actions.push(`<button class="btn btn-danger-o btn-sm" data-action="delete-expense" data-id="${tx.id}">حذف</button>`); }
  return actions.join('');
}
function expensesView(){
  const list = DB.treasury.filter(t=>t.ttype==='expense').slice().sort((a,b)=> b.ttdate.localeCompare(a.ttdate));
  const staleCount = list.filter(isStalePendingExpense).length;
  const staleAlertHtml = staleCount>0
    ? `<div class="card" style="border-color:var(--danger,#dc3545);"><p class="hint" style="margin:0;color:var(--danger,#dc3545);font-weight:600;">⚠ فيه ${staleCount} مصروف بانتظار موافقة الشريك من أكتر من ${STALE_PENDING_DAYS} أيام من غير رد فعل — يفضل تتابع مع الشريك أو الأدمن.</p></div>`
    : '';
  const showCenterCol = hasMultipleCenters();

  // تجميع المصروفات باليوم (التاريخ) — أحدث يوم فوق، وجوه كل يوم مصروفاته بترتيبها الأصلي.
  // كل يوم بيظهر كصف قابل للفتح (details/summary) بملخصه (عدد المصروفات + إجمالي المبلغ)،
  // وبيفتح جدول تفاصيل مصروفات اليوم ده بس لما تدوس عليه.
  const dayOrder = [];
  const dayMap = {};
  list.forEach(tx=>{
    if(!dayMap[tx.ttdate]){ dayMap[tx.ttdate]=[]; dayOrder.push(tx.ttdate); }
    dayMap[tx.ttdate].push(tx);
  });
  const dayGroupsHtml = dayOrder.map((date,idx)=>{
    const dayTxs = dayMap[date];
    const dayTotal = dayTxs.reduce((a,tx)=>a+tx.amount,0);
    const rowsHtml = dayTxs.map(tx=> `<tr><td class="tnum">${fmt2(tx.amount)}</td><td>${escapeHtml(tx.description||'-')}${expenseLineItemsDetailHtml(tx)}</td><td>${tx.relatedTeacherId? escapeHtml(teacherName(tx.relatedTeacherId)) : tx.employeeId? escapeHtml(employeeName(tx.employeeId)) : '-'}</td>${showCenterCol?`<td>${tx.centerId? escapeHtml(centerName(tx.centerId)) : '-'}</td>`:''}<td>${expenseApprovalBadgeHtml(tx)}</td><td style="display:flex;gap:6px;flex-wrap:wrap;">${expenseRowActionHtml(tx)}</td></tr>`).join('');
    // أحدث يوم (أول واحد في الترتيب) بيفضل مفتوح افتراضيًا عشان تشوف مصروفات النهارده على طول من غير ما تدوس؛ الأيام الأقدم بتبدأ مقفولة.

function approvalsView(){
  if(!(SESSION && SESSION.profile.teacherId)){

  }
  const myTeacherId = SESSION.profile.teacherId;
  const mine = DB.treasury.filter(t=>t.ttype==='expense' && t.relatedTeacherId===myTeacherId).slice().sort((a,b)=> b.ttdate.localeCompare(a.ttdate));
  const pending = mine.filter(t=>(t.approvalStatus||'approved')==='pending');

  const staleCount = pending.filter(isStalePendingExpense).length;

    ? `<div class="card" style="border-color:var(--danger,#dc3545);"><p class="hint" style="margin:0;color:var(--danger,#dc3545);font-weight:600;">⚠ عندك ${staleCount} مصروف مستني ردّك من أكتر من ${STALE_PENDING_DAYS} أيام — يفضل تراجعه بسرعة.</p></div>`
    : '';
  return `

    <div class="card-head"><h2>مصاريف بانتظار موافقتك (${pending.length})</h2></div>

  </div>

function auditActionLabel(action){

  return map[action] || action;
}
function auditLogCardHtml(){

/* ---------------- Modals ---------------- */
function toggleCancelFields(v){
  const dateWrap = document.getElementById('postponeDateWrap');
  const customWrap = document.getElementById('customReasonWrap');
  if(dateWrap) dateWrap.style.display = v==='تأجيل لموعد تاني' ? 'block':'none';
  if(customWrap) customWrap.style.display = v==='سبب تاني' ? 'block':'none';
}
function updateHallOptionsForCenter(centerId){
  const sel = document.getElementById('adhocHallSelect');
  if(!sel) return;
  const halls = DB.halls.filter(h=>h.active && h.centerId===centerId);
  sel.innerHTML = optionsHtml(halls);
}
// خانة "المدرس" في مودال "إضافة حصة" بقت خانة واحدة مدموجة: بحث + اختيار مع بعض،
// بقايمة منسدلة مبنية يدوي (مش <datalist>) عشان تجيب كل المدرسين لما تدوس على الخانة
// حتى لو فيها اسم مدرس متعبّي من قبل، وتفلتر بالاسم أو المادة أول ما تكتب.
function adhocTeacherLabel(t){ return t.name + ' (' + t.subject + ')'; }
function adhocTeacherMatches(query){
  const q = (query||'').trim().toLowerCase();
  const activeTeachers = DB.teachers.filter(t=>t.active);
  return q ? activeTeachers.filter(t=> (t.name+' '+t.subject).toLowerCase().includes(q)) : activeTeachers;
}
function renderAdhocTeacherDropdown(query){
  const box = document.getElementById('adhocTeacherDropdown');
  if(!box) return;
  const matches = adhocTeacherMatches(query);
  box.innerHTML = matches.length
    ? matches.map(t=>`<div class="dropdown-item" onmousedown="event.preventDefault();selectAdhocTeacher('${t.id}')">${escapeHtml(adhocTeacherLabel(t))}</div>`).join('')
    : '<div class="dropdown-item empty">مفيش مدرس مطابق للبحث</div>';
  box.style.display = 'block';
}
// بيتنده لما الخانة تاخد فوكس (تدوس عليها) — بيوضح كل المدرسين على طول، مهما كان مكتوب فيها حاليًا.
function openAdhocTeacherDropdown(){ renderAdhocTeacherDropdown(''); }
function closeAdhocTeacherDropdown(){
  const box = document.getElementById('adhocTeacherDropdown');
  if(box){ box.style.display = 'none'; box.innerHTML = ''; }
}
function selectAdhocTeacher(teacherId){
  const teacher = teacherById(teacherId);
  if(!teacher) return;
  const input = document.getElementById('adhocTeacherSearch');
  const hidden = document.getElementById('adhocTeacherIdInput');
  if(input) input.value = adhocTeacherLabel(teacher);
  if(hidden) hidden.value = teacherId;
  closeAdhocTeacherDropdown();
  updateRateForTeacher(teacherId);
}
function updateRateForTeacher(teacherId){
  // لما يتغيّر المدرس، بنجدد خيارات المرحلة السنية المتاحة (خاصة بالمدرس ده)، ونصفّر
  // اختيار المرحلة، وبنحدّث السعر بالسعر العام للمدرس الجديد (لحد ما يختار مرحلة).
  const gradeSel = document.getElementById('adhocGradeSelect');
  const teacher = teacherById(teacherId);
  if(gradeSel){
    const grades = teacherGrades(teacher);
    gradeSel.innerHTML = '<option value="">بدون تحديد (السعر العام)</option>'
      + grades.map(g=>`<option value="${g.key}">${escapeHtml(g.label)}</option>`).join('');
  }
  updateRateForGradeSelection(teacherId, '');
}
function updateRateForGradeSelection(teacherId, gradeKey){
  const input = document.getElementById('adhocRateInput');
  if(!input) return;
  const teacher = teacherById(teacherId);
  input.value = teacherRateForGrade(teacher, gradeKey||'');
}

function modalHtml(){
  if(!modalState) return '';
  if(modalState.type==='collect') return collectModalHtml(modalState.sessionId);
  if(modalState.type==='cancel') return cancelModalHtml(modalState.sessionId);
  if(modalState.type==='settle-teacher') return settleModalHtml(modalState.teacherId);
  if(modalState.type==='pay-salary') return paySalaryModalHtml(modalState.employeeId);
  if(modalState.type==='give-advance') return giveAdvanceModalHtml(modalState.employeeId);
  if(modalState.type==='add-session') return addSessionModalHtml();
  return '';
}

  'teacher-edit': ['تعديل مدرس','تعديل البيانات والمواعيد الأسبوعية'],
  employees: ['الموظفين','بيانات الموظفين ومرتباتهم وسلفهم'],

function render(){
  const app = document.getElementById('app');
  updateDocumentTitle();
  if(!SESSION){
    app.innerHTML = onlineStage==='auth' ? authScreenHtml() : connectScreenHtml();
    document.getElementById('modalRoot').innerHTML = '';
    return;
  }
  if(!DB){ app.innerHTML = '<div class="setup-wrap"><div class="setup-card" style="max-width:360px;text-align:center;">جاري تحميل البيانات...</div></div>'; return; }
  const [title, sub] = VIEW_TITLES[currentView] || VIEW_TITLES.dashboard;
  app.innerHTML = topbarHtml() + `<div class="page-header no-print"><h1>${title}</h1><div class="sub">${sub}</div></div><div class="content">${viewHtml()}</div>`;
  document.getElementById('modalRoot').innerHTML = modalHtml();
  positionNavDropdown();
  updateExpenseRowRemoveButtons();
}
function positionNavDropdown(){
  // .topnav-dropdown is position:fixed so it isn't clipped by .topnav-menu's overflow-x:auto
  // (which forces overflow-y to compute as "auto" too per the CSS overflow spec, clipping any
  // absolutely-positioned descendant taller than the nav bar). We compute its coordinates here.
  const wrap = document.querySelector('.nav-dropdown-wrap.open');
  if(!wrap) return;
  const btn = wrap.querySelector('.topnav-btn');
  const dd = wrap.querySelector('.topnav-dropdown');
  if(!btn || !dd) return;
  const r = btn.getBoundingClientRect();
  dd.style.top = (r.bottom + 6) + 'px';
  dd.style.right = (window.innerWidth - r.right) + 'px';
  dd.style.left = 'auto';
}
function viewHtml(){
  switch(currentView){
    case 'dashboard': return dashboardView();
    case 'centers': return centersView();
    case 'teachers': return teachersView();
    case 'teacher-new': return teacherFormView(null);
    case 'teacher-edit': return teacherFormView(editingTeacherId);
    case 'employees': return employeesView();
    case 'employee-new': return employeeFormView(null);
    case 'employee-edit': return employeeFormView(editingEmployeeId);
    case 'treasury': return treasuryView();
    case 'expenses': return expensesView();
    case 'reports': return reportsView();
    case 'settings': return settingsView();
    case 'approvals': return approvalsView();
    default: return dashboardView();
  }
}

  'edit-teacher': (id)=>{ if(!requirePerm('teachers')) return; editingTeacherId=id; currentView='teacher-edit'; render(); },
  'delete-teacher': async (id)=>{ if(!confirm('تأكيد الحذف؟')) return; await deleteTeacherById(id); render(); },
  'edit-employee': (id)=>{ if(!requirePerm('employees')) return; editingEmployeeId=id; currentView='employee-edit'; render(); },

  'delete-schedule': async (id)=>{ if(!confirm('حذف هذا الموعد الأسبوعي؟')) return; await deleteScheduleSlotById(id); render(); },

  'delete-expense': async (id)=>{ if(!confirm('تأكيد الحذف؟')) return; await deleteExpenseById(id); render(); },

document.addEventListener('click', function(e){

  if(!btn) return;
  const handler = clickHandlers[btn.dataset.action];
  if(handler){
    Promise.resolve(handler(btn.dataset.id, btn)).catch(err=>{
      console.error(err); toast('حصل خطأ: '+(err&&err.message?err.message:err));
    });
  }
});
document.addEventListener('click', function(e){
