// بيجمّع أسعار المراحل السنية من فورم إضافة/تعديل مدرس — checkbox لكل مرحلة مُعلّم (grade_keys)
// + خانة سعر مرتبطة بيها (rate_<key>)
function buildGradeRatesFromFd(fd){
  const keys = fd.getAll('grade_keys');
  const rates = {};
  keys.forEach(k=>{ rates[k] = fd.get('rate_'+k); });
  return rates;
}

/* ---------------- Event delegation: forms ---------------- */
const formHandlers = {
  connectSupa: async (fd)=>{
    const rawUrl=(fd.get('url')||''); const key=(fd.get('key')||'').trim();
    if(!rawUrl.trim()||!key){ toast('لازم تدخل الرابط والمفتاح كاملين'); return; }
    const url = normalizeSupaUrl(rawUrl);
    toast('بيتأكد من الاتصال...');
    try{ await testSupaConnection(url, key); }
    catch(e){ alert('فشل الاتصال بمشروع Supabase:\n\n'+e.message); return; }
    SUPA = { url, key };
    onlineStage='auth'; render();
    toast('تم الاتصال بنجاح');
  },
  doLogin: async (fd)=>{
    try{
      const username = (fd.get('username')||'').trim();
      if(!username) throw new Error('اكتب اسم المستخدم');
      const email = await lookupEmailByUsername(username);
      if(!email) throw new Error('اسم المستخدم أو كلمة المرور غير صحيحة');
      const data = await doLogin(email, fd.get('password'));
      SESSION = data;
      saveSessionToStorage();
      await loadAllTablesFromSupabase();
      currentView='dashboard'; editingTeacherId=null;
      await beforeRenderPrep();
      render();
    }catch(e){ alert('فشل الدخول: '+e.message); }
  },
  addCenter: async (fd)=>{ await addCenter(fd.get('name')); render(); },
  addHall: async (fd, form)=>{ await addHall(form.dataset.id, fd.get('name')); render(); },
  addTeacher: async (fd)=>{ const gradeRates = buildGradeRatesFromFd(fd); const id = await addTeacher(fd.get('name'), fd.get('subject'), fd.get('rate_per_child'), fd.get('phone'), fd.get('notes'), fd.get('share_percent'), gradeRates); if(id){ editingTeacherId=id; currentView='teacher-edit'; } render(); },
  saveTeacher: async (fd, form)=>{ const gradeRates = buildGradeRatesFromFd(fd); await saveTeacherData(form.dataset.id, fd.get('name'), fd.get('subject'), fd.get('rate_per_child'), fd.get('phone'), fd.get('notes'), fd.get('share_percent'), gradeRates); render(); },
  addSchedule: async (fd, form)=>{ await addScheduleSlot(form.dataset.id, fd.get('hall_id'), fd.getAll('days'), fd.get('start_time'), fd.get('end_time'), fd.get('repeat_end_date'), fd.get('grade_level')); render(); },
  gotoDate: async (fd)=>{ const d = fd.get('date'); if(d){ selectedDate=d; } await beforeRenderPrep(); render(); },
  addExpense: async (fd)=>{
    const amounts = fd.getAll('amount');
    const dates = fd.getAll('ttdate');
    const descriptions = fd.getAll('description');
    const teacherIds = fd.getAll('teacher_id');
    const centerIds = fd.getAll('center_id'); // ممكن تكون فاضية تمامًا لو سنتر واحد بس شغال (الخانة مش بتظهر أصلًا)
    const itemsJsonList = fd.getAll('items_json'); // لو سطر مقسّم لبنود، هنا مصفوفة {description, amount} كنص JSON
    let count = 0;
    for(let i=0;i<amounts.length;i++){
      const amt = parseFloat(amounts[i]);
      if(isNaN(amt) || amt<=0) continue;
      let lineItems = null;
      if(itemsJsonList[i]){
        try{ const parsed = JSON.parse(itemsJsonList[i]); if(Array.isArray(parsed) && parsed.length) lineItems = parsed; }
        catch(e){ /* JSON اتلخبط، تجاهله واعتبر السطر مبلغ عادي */ }
      }
      await addExpense(amt, dates[i], descriptions[i], teacherIds[i]||null, centerIds[i]||null, lineItems);
      count++;
    }
    if(count>1) toast('تم تسجيل '+count+' مصروفات');
    else if(count===1) toast('تم تسجيل المصروف');
    else toast('لازم تدخل مبلغ صحيح على الأقل في سطر واحد');
    render();
  },
  addLedgerEntry: async (fd, form)=>{ await addManualLedgerEntry(form.dataset.id, fd.get('entry_type'), fd.get('amount'), fd.get('entry_date'), fd.get('description')); render(); },
  filterReports: async (fd)=>{ if(!requirePerm('reports')) return; reportsState = { teacherId: fd.get('teacher_id'), from: fd.get('from'), to: fd.get('to') }; render(); },
  settleTeacher: async (fd, form)=>{
    await settleTeacherBalance(form.dataset.id, fd.get('amount'));
    modalState=null; render();
  },
  addEmployee: async (fd)=>{ const id = await addEmployee(fd.get('name'), fd.get('job_title'), fd.get('base_salary'), fd.get('phone'), fd.get('notes')); if(id){ editingEmployeeId=id; currentView='employee-edit'; } render(); },
  saveEmployee: async (fd, form)=>{ await saveEmployeeData(form.dataset.id, fd.get('name'), fd.get('job_title'), fd.get('base_salary'), fd.get('phone'), fd.get('notes')); render(); },
  addEmployeeLedgerEntry: async (fd, form)=>{ await addManualEmployeeLedgerEntry(form.dataset.id, fd.get('entry_type'), fd.get('amount'), fd.get('entry_date'), fd.get('description')); render(); },
  paySalary: async (fd, form)=>{
    await payEmployeeSalary(form.dataset.id, fd.get('base_amount'), fd.get('bonus_amount'), fd.get('bonus_desc'), fd.get('deduction_amount'), fd.get('deduction_desc'), fd.get('advance_settle_amount'), fd.get('pay_date'), fd.get('description'));
    modalState=null; render();
  },
  giveAdvance: async (fd, form)=>{
    await giveEmployeeAdvance(form.dataset.id, fd.get('amount'), fd.get('advance_date'), fd.get('description'));
    modalState=null; render();
  },
  collectSession: async (fd, form)=>{
    const amount = parseFloat(fd.get('amount'));
    if(isNaN(amount) || amount<0){ toast('مبلغ غير صحيح'); return; }
    const note = (fd.get('note')||'').trim();
    await collectSession(form.dataset.id, amount, note);
    modalState=null; render();
  },
  cancelSession: async (fd, form)=>{
    const reason = fd.get('reason');
    const custom = fd.get('custom_reason');
    const postponeDate = fd.get('postpone_date');
    if(reason==='تأجيل لموعد تاني' && !postponeDate){ toast('لازم تحدد التاريخ الجديد'); return; }
    if(reason==='سبب تاني' && !(custom||'').trim()){ toast('اكتب السبب'); return; }
    await cancelSession(form.dataset.id, reason, custom, postponeDate);
    modalState=null; render();
  },
  addSessionModal: async (fd)=>{
    await addAdhocSession(selectedDate, fd.get('hall_id'), fd.get('teacher_id'), fd.get('children_count'), fd.get('start_time'), fd.get('rate_per_child'), fd.get('grade_level'));
    modalState=null; render();
  },
  saveOrgSettings: async (fd)=>{
    await saveOrgSettings(fd.get('company_name'), fd.get('phone'), fd.get('address'));
    render();
  },
  addUser: async (fd, form)=>{
    const role = fd.get('role');
    const permissions = {};
    PERMISSION_MODULES.forEach(m=>{ permissions[m.key] = fd.get('perm_'+m.key)==='on'; });
    const teacherId = fd.get('teacher_id') || null;
    const ok = await adminCreateUser(fd.get('full_name'), fd.get('username'), fd.get('password'), role, permissions, teacherId);
    if(ok){ form.reset(); }
    await refreshUsersList();
    render();
  },
};
document.addEventListener('submit', function(e){
  const form = e.target.closest('form[data-form]');
  if(!form) return;
  e.preventDefault();
  // امنع الإرسال المتكرر (دبل كليك أو الضغط تاني قبل ما الأول يخلص) — من غير الحماية دي
  // أي فورم فيه عملية شبكة (زي تسجيل مصروف) ممكن يتسجل أكتر من مرة لو المستخدم ضغط بسرعة.
  if(form.dataset.submitting === '1') return;
  const handler = formHandlers[form.dataset.form];
  if(!handler) return;
  form.dataset.submitting = '1';
  const submitBtn = form.querySelector('button[type="submit"], button:not([type])');
  if(submitBtn) submitBtn.disabled = true;
  Promise.resolve(handler(new FormData(form), form))
    .catch(err=>{
      console.error(err); toast('حصل خطأ: '+(err&&err.message?err.message:err));
    })
    .finally(()=>{
      // لو الفورم اتشال من الصفحة خلاص (لأن render() غيّر الشاشة بنجاح) مفيش داعي نلمسه تاني
      if(form.isConnected){ form.dataset.submitting=''; if(submitBtn) submitBtn.disabled=false; }
    });
});

/* ---------------- Init ---------------- */
async function init(){
  // حاول استرجاع الجلسة المحفوظة أول حاجة عشان الريفرش ميرجّعش لصفحة تسجيل الدخول
  const saved = loadSessionFromStorage();
  if(saved && saved.supa && saved.session){
    try{
      await testSupaConnection(saved.supa.url, saved.supa.key);
      SUPA = saved.supa;
      SESSION = saved.session;
      onlineStage='auth';
      try{
        await loadAllTablesFromSupabase();
        currentView='dashboard'; editingTeacherId=null;
        await beforeRenderPrep();
        render();
        return;
      }catch(e){
        // فشل تحميل البيانات (توكن منتهي وفشل تجديده مثلاً) - ارجع لتسجيل الدخول
        clearSessionStorage();
        SESSION=null; DB=null;
      }
    }catch(e){
      // فشل الاتصال بنفس المشروع المحفوظ - امسح الجلسة واكمل عادي
      clearSessionStorage();
      SESSION=null; DB=null;
    }
  }
  if(DEFAULT_SUPABASE_URL && DEFAULT_SUPABASE_KEY){
    const url = normalizeSupaUrl(DEFAULT_SUPABASE_URL);
    const key = DEFAULT_SUPABASE_KEY.trim();
    try{
      await testSupaConnection(url, key);
      SUPA = { url, key };
      onlineStage='auth';
    }catch(e){
      onlineStage='connect';
    }
  } else {
    onlineStage='connect';
  }
  render();
}
init();
